<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetDynamic ATS360 Commercial Pricing Generator v3</title>
<style>
:root{
  --navy:#0b2a4a; --navy2:#123a63; --blue:#1f6fb2; --teal:#0f8b8d;
  --lb:#e9f2fb; --lb2:#f4f8fc; --line:#d9e1ea; --ink:#18263a; --muted:#5d6b7e;
  --green:#1e8e5a; --greenbg:#e6f5ec; --amber:#a86b00; --amberbg:#fff3d6; --red:#c0392b; --redbg:#fdeaea;
  --r:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Inter,system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:#f3f6fa;font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* top bar */
.topbar{background:var(--navy);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:30}
.topbar h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.1px}
.topbar .tag{font-size:12px;color:#a9c4de}
.topbar .sp{flex:1}
.tbtn{background:transparent;border:1px solid #4f7096;color:#dbe8f5;border-radius:7px;padding:6px 11px;font-size:12.5px}
.tbtn:hover{background:#17406b}
.brandmark{display:flex;align-items:center;gap:10px}
.brandmark .nd{background:#fff;border-radius:6px;padding:4px 8px;display:flex;align-items:center}
.brandmark img{height:24px;display:block}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 590px;gap:20px;padding:20px 24px 60px;max-width:1700px;margin:0 auto}
.left{min-width:0}
.right{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 78px);display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media(max-width:1150px){.layout{grid-template-columns:1fr}.right{position:static;max-height:none}}

/* cards */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.card>.hd{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--lb);border:0;border-bottom:1px solid transparent;padding:12px 16px;color:var(--navy)}
.card.open>.hd{border-bottom-color:var(--line)}
.card>.hd .t{font-weight:650;font-size:15px}
.card>.hd .s{font-size:12.5px;color:var(--muted);margin-left:2px}
.card>.hd .sp{flex:1}
.card>.hd .chev{transition:transform .15s;color:var(--blue)}
.card.open>.hd .chev{transform:rotate(90deg)}
.card>.bd{display:none;padding:16px}
.card.open>.bd{display:block}
.grid{display:grid;gap:12px 16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:700px){.g2,.g3{grid-template-columns:1fr}}
label.f{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
label.f>span.l{display:block;margin-bottom:4px}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid #c5d0dd;border-radius:7px;padding:8px 10px;background:#fff}
textarea{resize:vertical;min-height:54px}
input:disabled,select:disabled{background:#f1f4f8;color:#8793a3}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.sub{font-size:12px;font-weight:700;color:var(--navy);margin:16px 0 8px;letter-spacing:.2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--lb2);border:1px solid #cfe0f1;color:var(--navy2);border-radius:20px;padding:3px 10px;font-size:12px}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:650}
.pill.g{background:var(--greenbg);color:var(--green)}
.pill.a{background:var(--amberbg);color:var(--amber)}
.pill.r{background:var(--redbg);color:var(--red)}
.pill.b{background:var(--lb);color:var(--blue)}
.pill.n{background:#eef1f5;color:var(--muted)}
.note{border-radius:8px;padding:9px 12px;font-size:12.5px;margin-top:10px}
.note.a{background:var(--amberbg);color:#6f4600;border:1px solid #f0d58f}
.note.r{background:var(--redbg);color:#8a2217;border:1px solid #f1b8b1}
.note.g{background:var(--greenbg);color:#14653f;border:1px solid #b9e0c9}
.note.b{background:var(--lb2);color:var(--navy2);border:1px solid #cfe0f1}

/* choice cards */
.choices{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.choice{border:1.5px solid var(--line);border-radius:var(--r);padding:14px;background:#fff;text-align:left;position:relative}
.choice:hover{border-color:#9bbbdb}
.choice.sel{border-color:var(--blue);background:var(--lb2);box-shadow:inset 0 0 0 1px var(--blue)}
.choice.dis{opacity:.55;cursor:not-allowed}
.choice h4{margin:0 0 4px;font-size:14.5px;color:var(--navy)}
.choice .price{font-weight:700;font-size:16px;color:var(--navy);margin:6px 0}
.choice ul{margin:6px 0 0;padding-left:18px;color:#334559;font-size:12.5px}
.choice .tick{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;border:1.5px solid #b3c2d3;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.choice.sel .tick{background:var(--blue);border-color:var(--blue)}
.seg{display:inline-flex;border:1px solid #c5d0dd;border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;font-size:12.5px;border-right:1px solid #c5d0dd}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}
.seg button:disabled{opacity:.5;cursor:not-allowed}

/* custom rows */
.crow{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;background:#fff}
.crow .top{display:grid;grid-template-columns:minmax(150px,2fr) minmax(130px,1.1fr) 84px minmax(110px,1fr) auto minmax(100px,.9fr);gap:10px;align-items:end}
@media(max-width:900px){.crow .top{grid-template-columns:1fr 1fr}}
.crow .calc{font-weight:700;color:var(--navy);text-align:right;min-height:34px;display:flex;align-items:center;justify-content:flex-end}
.crow .calc.pend{color:var(--amber);font-weight:650}
.crow details{margin-top:8px}
.crow summary{cursor:pointer;color:var(--blue);font-size:12.5px;font-weight:600}
.crow .more{margin-top:10px}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);font-weight:600;white-space:nowrap}
.chk input{width:16px;height:16px}
.linkbtn{background:none;border:0;color:var(--blue);padding:0;font-size:12.5px;font-weight:600;text-decoration:underline}
.linkbtn.red{color:var(--red)}
.btn{border:1px solid #b9c7d7;background:#fff;color:var(--navy);border-radius:8px;padding:8px 14px;font-weight:600}
.btn:hover{background:var(--lb2)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy2)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.danger{border-color:#e3a9a2;color:var(--red)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.actionbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.policy-line{margin:6px 0 20px;text-align:center;color:var(--navy2);font-weight:600;font-size:13px}
.dropzone{display:flex;align-items:center;gap:12px}
.logo-prev{width:120px;height:56px;border:1px dashed #b3c2d3;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11.5px;background:#fafcfe;overflow:hidden}
.logo-prev img{max-width:100%;max-height:100%;object-fit:contain}
.future{opacity:.9;background:repeating-linear-gradient(135deg,#fafbfd,#fafbfd 10px,#f4f6f9 10px,#f4f6f9 20px)}

/* right panel */
.out-head{background:var(--navy);color:#fff;padding:10px 12px 0}
.out-top{display:flex;align-items:center;gap:10px;padding:2px 4px 10px}
.out-top .nm{font-weight:650;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{padding:4px 11px;border-radius:20px;font-size:12px;font-weight:750;letter-spacing:.2px}
.status.g{background:#d6f0e1;color:#0f6a3f}
.status.a{background:#ffe9b3;color:#7a4a00}
.status.r{background:#ffd3cd;color:#8f2116}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{background:transparent;border:0;color:#a9c4de;padding:8px 10px;font-size:12.5px;font-weight:600;border-radius:7px 7px 0 0;white-space:nowrap}
.tabs button.on{background:#fff;color:var(--navy)}
.out-body{overflow:auto;padding:16px;flex:1}
.tab-pane{display:none}
.tab-pane.on{display:block}
.sumblock{border:1px solid var(--line);border-radius:9px;margin-bottom:12px;overflow:hidden}
.sumblock h5{margin:0;padding:7px 12px;background:var(--lb);color:var(--navy);font-size:12.5px;font-weight:700}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 12px;border-top:1px solid #edf1f6;font-size:13px}
.kv:first-of-type{border-top:0}
.kv .k{color:#4a596c}
.kv .v{font-weight:650;text-align:right}
.kv.big .v{font-size:15px;color:var(--navy)}
.kv .v.pend{color:var(--amber)}
.kv .v.neg{color:var(--red)}
.flag{display:flex;gap:8px;padding:7px 10px;border-radius:7px;margin-bottom:6px;font-size:12.5px;align-items:flex-start}
.flag.r{background:var(--redbg);color:#8a2217}
.flag.a{background:var(--amberbg);color:#6f4600}
.flag.i{background:var(--lb2);color:var(--navy2)}
.flag .fx{margin-left:auto;white-space:nowrap}
.hero{background:var(--lb2);border:1px solid #cfe0f1;border-radius:9px;padding:12px 14px;margin-bottom:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero div small{display:block;color:var(--muted);font-size:11.5px}
.hero div b{font-size:17px;color:var(--navy)}
.invest{background:#f4ecff;border:1px solid #d9c6f5;color:#4b2a7a;border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:12.5px}

/* documents */
.doc{background:#fff;color:#111c2b;font-size:12.5px}
.doc .dh{display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:3px solid var(--navy);padding-bottom:12px;margin-bottom:14px}
.doc .dh .lg{display:flex;align-items:center;gap:14px}
.doc .dh img.nd{max-height:44px;max-width:190px;display:block}
.doc .dh img.client{max-height:56px;max-width:180px;object-fit:contain;display:block}
.logo-ph{display:none;align-items:center;justify-content:center;height:40px;padding:0 12px;border:1.5px solid var(--navy);color:var(--navy);font-weight:700;border-radius:4px;font-size:13px}
.ats-badge{display:inline-flex;align-items:center;height:36px;padding:0 12px;background:var(--teal);color:#fff;font-weight:750;border-radius:4px;letter-spacing:.4px;font-size:13px}
.doc h2{margin:0;font-size:22px;color:var(--navy)}
.doc h3{margin:18px 0 6px;font-size:14px;color:#fff;background:var(--navy);padding:5px 10px;border-radius:4px}
.doc h4{margin:14px 0 4px;font-size:13px;color:var(--navy)}
.doc .meta{color:var(--muted);font-size:12px;margin-top:2px}
.doc table{width:100%;border-collapse:collapse;margin-bottom:4px}
.doc th{background:var(--lb);color:var(--navy);text-align:left;padding:6px 8px;font-size:11.5px;border:1px solid #cfdbe8}
.doc td{padding:6px 8px;border:1px solid #dbe4ee;vertical-align:top}
.doc td.n,.doc th.n{text-align:right;white-space:nowrap}
.doc tr.tot td{font-weight:700;background:#f3f7fb}
.doc .pendtxt{color:#a86b00;font-weight:650}
.doc .small{font-size:11.5px;color:#46556a}
.doc ul{margin:6px 0 6px 18px;padding:0}
.doc .draftbar{background:var(--redbg);border:1px solid #e9aaa3;color:#8a2217;font-weight:700;padding:8px 12px;border-radius:5px;margin-bottom:12px}
.doc .intbar{background:var(--amberbg);border:1px solid #f0d58f;color:#6f4600;font-weight:700;padding:7px 12px;border-radius:5px;margin-bottom:12px}
.doc p{margin:6px 0}
.doc .clause{margin-bottom:10px}
.doc .clause h4{margin-bottom:2px}

/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,25,45,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal .mh{padding:14px 18px;font-weight:700;font-size:16px;border-bottom:1px solid var(--line)}
.modal .mh.red{background:var(--redbg);color:var(--red);border-radius:12px 12px 0 0}
.modal .mb{padding:16px 18px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;z-index:120;font-size:13px}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* print */
@media print{
  @page{margin:.5in}
  body{background:#fff;font-size:11pt}
  .topbar,.left,.out-head,.no-print,.toast,.modal-bg{display:none!important}
  .layout{display:block;padding:0;max-width:none}
  .right{position:static;max-height:none;border:0;border-radius:0;display:block;overflow:visible}
  .out-body{overflow:visible;padding:0}
  .tab-pane{display:none!important}
  .tab-pane.on{display:block!important}
  .print-hide{display:none!important}
  .doc h3,.doc th,.doc tr.tot td,.doc .ats-badge,.doc .draftbar{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc table,.doc .clause{break-inside:avoid}
  .doc h3{break-after:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<style>
.ph{display:inline-block;background:#fff3d6;color:#8a5a00;border:1px solid #f0d58f;border-radius:4px;padding:0 6px;font-size:10.5px;font-weight:700;margin-left:4px;vertical-align:middle}
.inst{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;background:#fff}
.inst .top{display:grid;grid-template-columns:minmax(150px,2fr) 110px 110px auto;gap:10px;align-items:end}
@media(max-width:800px){.inst .top{grid-template-columns:1fr 1fr}}
.mx{width:100%;border-collapse:collapse;margin:6px 0 14px;font-size:12.5px}
.mx th{background:var(--lb);text-align:left;padding:5px 8px;border:1px solid #cfdbe8;color:var(--navy)}
.mx td{padding:5px 8px;border:1px solid #dbe4ee}
.mx td.n,.mx th.n{text-align:right;white-space:nowrap}
.modal.wide{max-width:900px}
.tbtn.on{background:#fff;color:var(--navy);border-color:#fff}
.cfgwrap{max-width:1250px;margin:0 auto;padding:20px 24px 70px}
.mx input[type=number]{width:92px;padding:4px 6px;font-size:12.5px}
.mx input[type=text],.mx select{padding:4px 6px;font-size:12.5px;width:100%;min-width:90px}
.cfgwrap textarea{min-height:44px}
.cfgbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
@media print{#cfgView{display:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brandmark">
    <span class="nd"><img src="https://netdynamicconsulting.com/images/common/logobanner.png" alt="NetDynamic" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'"><b style="display:none;color:#0b2a4a">NetDynamic</b></span>
    <div>
      <h1>ATS360 Commercial Pricing Generator <span style="font-weight:400;color:#a9c4de">v3</span></h1>
      <div class="tag" id="topTag">Internal deal configurator &middot; mockup</div>
    </div>
  </div>
  <div class="sp"></div>
  <button class="tbtn on" id="vBuilder" data-act="setView" data-v="builder">Deal Builder</button>
  <button class="tbtn" id="vConfig" data-act="setView" data-v="config">Configuration (Matrix)</button>
  <button class="tbtn" data-act="loadDemo">Load demo deal</button>
  <button class="tbtn" data-act="blank">New blank deal</button>
</header>

<main class="layout">
  <div class="left" id="left"></div>
  <aside class="right">
    <div class="out-head">
      <div class="out-top"><div class="nm" id="outName">Deal</div><span class="status g" id="outStatus">WITHIN POLICY</span></div>
      <div class="tabs" id="tabs">
        <button data-tab="summary" class="on">Commercial Summary</button>
        <button data-tab="proposal">Client Proposal</button>
        <button data-tab="handoff">Implementation Handoff</button>
        <button data-tab="contract">Contract Scope</button>
        <button data-tab="pricelist">Partner Price List</button>
      </div>
    </div>
    <div class="out-body">
      <div class="tab-pane on" id="pane-summary"></div>
      <div class="tab-pane" id="pane-proposal"></div>
      <div class="tab-pane" id="pane-handoff"></div>
      <div class="tab-pane" id="pane-contract"></div>
      <div class="tab-pane" id="pane-pricelist"></div>
    </div>
  </aside>
</main>
<div id="cfgView" style="display:none"></div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   CENTRAL PRICING MATRIX — single source of truth (all values PROPOSED)
   status "placeholder" = number invented to make the engine run; needs approval.
   ===================================================================== */
const pricingPolicy = {
  version:"0.3-proposed",
  matrixApproved:false,
  escalation:5,
  yearsOptions:[1,2,3,4,5],

  segments:{
    corporate:{ label:"Corporate",              gov:false, defaultPackage:"ONBOARD", coreFlag:true,  levelOffered:false, note:"Typically multi-entity; expect Multi-company structure and OneWorld." },
    emerging: { label:"Emerging",               gov:false, defaultPackage:"ONBOARD", coreFlag:false, levelOffered:false, note:"Smaller deals; ATS Core is an accepted option here." },
    govcity:  { label:"Government — City",      gov:true,  defaultPackage:"ONBOARD", coreFlag:true,  levelOffered:true,  note:"Level (flat) annual billing is commonly requested." },
    govcounty:{ label:"Government — County",    gov:true,  defaultPackage:"ONBOARD", coreFlag:true,  levelOffered:true,  note:"Level (flat) annual billing is commonly requested." },
    nonprofit:{ label:"Nonprofit / Education",  gov:false, defaultPackage:"ONBOARD", coreFlag:true,  levelOffered:false, note:"" },
    other:    { label:"Other",                  gov:false, defaultPackage:"ONBOARD", coreFlag:true,  levelOffered:false, note:"" }
  },
  regions:{ US:"United States", CA:"Canada", UK:"United Kingdom", EU:"Europe", OTHER:"Other" },

  channels:{
    direct:   { label:"Direct", swBasis:"target", implBasis:"target", partner:false, note:"Normal direct sale. No partner commission." },
    oracle:   { label:"Oracle / NetSuite Sourced", swBasis:"strategic", implBasis:"target", partner:false, note:"Strategic / attach software pricing where approved." },
    referral: { label:"Referral Partner", swBasis:"list", implBasis:"list", partner:true, note:"e.g. Emerge. Customer pricing defaults to List; commission is an acquisition cost, not a second discount." },
    reseller: { label:"Reseller / Prime Contractor", swBasis:"list", implBasis:"list", partner:true, note:"e.g. DLT. Customer pricing defaults to List; margin structure may differ from referral commission." }
  },
  compensationBases:{ recurring:"Recurring software only", services:"Software + selected services", fixed:"Fixed amount", other:"Other (% of manual base)" },

  licensing:{
    // Platform fee is per ATS instance and INCLUDES the onboarding add-on monthlies. It includes NO user licenses.
    platform:{
      ONBOARD:{ name:"ATS360 Platform — Onboarding bundle", list:2500, target:1500, strategic:1500, floor:1200, status:"proposed",
                includes:"E-Signature, Pre-Hire Portal and E-Verify capability included" },
      CORE:   { name:"ATS360 Platform — Core",              list:1500, target:900,  strategic:900,  floor:700,  status:"placeholder",
                includes:"Core recruiting only (no onboarding add-ons)" }
    },
    minRecruiters:5,
    seats:{
      ats:{ label:"ATS360 Recruiter", tiers:[{ qty:5,  list:500, target:399, strategic:399, floor:300, status:"placeholder" }],
            single:{ list:100, target:80, strategic:80, floor:60, status:"placeholder" } },
      hm: { label:"Hiring Manager",   tiers:[{ qty:10, list:200, target:160, strategic:160, floor:120, status:"placeholder" }],
            single:{ list:20,  target:16, strategic:16, floor:12, status:"placeholder" } }
    },
    resume:{ allowance:6000, testing:100, overage:0.16 }
  },

  implementation:{
    rates:{ list:250, target:150, strategic:150, floor:120 },            // base packages & connections ($/commercial hour)
    customRates:{ list:250, target:210, floor:185 },                       // deal-specific custom work
    connRates:{ list:250, target:210, strategic:210, floor:185 },        // connections & payroll readiness — kept from the commercial workbook; confirm
    everifyHoursOnlyIfActive:false,                                      // false = E-Verify hours are part of the fixed Onboarding package
    hours:{ core:{ oneWorld:75, nonOneWorld:130 }, everify:10, esig:10, prehire:30 },   // prehire = hours PER COUNTRY, per instance
    packages:{
      CORE:{ name:"ATS360 Core Deployment",
             blurb:"Core ATS360 configuration — special cases only.",

function execValid(s,scope){ const e=s.exec[scope]; return !!(e&&e.yes&&e.approver&&e.approver.trim()&&e.reason); }
function acctFramework(s){ const gov=P.segments[s.segment].gov; if(s.region==="US") return gov?"gasb":"usgaap"; if(s.region==="CA") return gov?"psab":"ifrs"; return "ifrs"; }

function resolvePartner(s){
  const ch=P.channels[s.channel]; if(!ch.partner) return null;
  const pc=P.partners.find(p=>p.id===s.partnerId)||null, pr=s.partner;
  return { cfg:pc, name:pc?pc.name:(pr.name||""), pct:pr.pct!=null?pr.pct:(pc?pc.pct:null), base:pr.base||(pc&&pc.base)||"recurring",
           fixed:pr.fixed!=null?pr.fixed:(pc?pc.fixed:null), otherBase:pr.otherBase, svcImpl:pr.svcImpl, svcCustom:pr.svcCustom };
}

function calc(s){
  const seg=P.segments[s.segment], ch=P.channels[s.channel], F=[];
  const flag=(lvl,msg,fix)=>F.push({lvl,msg,fix});
  const CM=P.costMatrix, MT=P.multi;
  const swBasis = s.ov.swBasis==="auto"?ch.swBasis:s.ov.swBasis;
  const implBasis = s.ov.implBasis==="auto"?ch.implBasis:s.ov.implBasis;
  const esc_ = (s.ov.escalation==null?P.escalation:s.ov.escalation)/100;
  const insts = s.multi ? s.instances : s.instances.slice(0,1);
  const N = Math.max(1,insts.length);
  const pkg = s.pkg;
  let usedPlaceholder=false;
  const PB = resolvePartner(s) || {cfg:null,name:"",pct:null,base:"recurring",fixed:null,otherBase:null,svcImpl:false,svcCustom:false};

  /* ---- package flags ---- */
  if(!pkg) flag("a","ATS360 package not selected (Onboarding or Core).");
  if(pkg==="CORE"){
    if(seg.coreFlag && !(s.coreReason||"").trim()) flag("a","ATS Core sold without onboarding — special case; record the reason.");
    else flag("i","ATS Core sold without onboarding"+((s.coreReason||"").trim()?" — reason: "+s.coreReason.trim():"")+".");
  }
  if(s.multi && s.instances.length<2) flag("a","Multi-company structure selected but fewer than 2 ATS instances configured.");

  /* ---- multi-company package discount (additional instances) ---- */
  let dPlat=0, dImpl=0;
  if(N>1){
    const tier=[...MT.tiers].sort((a,b)=>b.min-a.min).find(t=>N>=t.min);
    if(tier){ dPlat=(+tier.platformDiscPct||0)/100; dImpl=(+tier.implDiscPct||0)/100; }
    if(dPlat>0||dImpl>0) flag("i","Multi-company package pricing applied to "+(MT.appliesTo==="all"?"all":"additional")+" instances: "+(dPlat*100).toFixed(0)+"% platform, "+(dImpl*100).toFixed(0)+"% implementation. Delivery hours are unchanged, so margin shrinks.");
    else flag("i","Multi-company package discount is not configured — every instance is charged in full (set it in Configuration).");
  }
  const applies=ix=>(MT.appliesTo==="all"||ix>0);
  const dp=ix=>applies(ix)?dPlat:0, di=ix=>applies(ix)?dImpl:0;
  const fFloor=d=>MT.applyToFloor?(1-d):1;

  /* ---- subscription (per instance) ---- */
  const sw=[], instInfo=[];
  const mkLine=(o)=>{ o.lineList=o.unitList*o.qty; o.lineFinal=o.unitFinal*o.qty; o.lineFloor=o.unitFloor*o.qty; sw.push(o); return o; };
  const seatLines=(kind,qtyRaw,it,ix,suffix)=>{
    const cfg=LIC.seats[kind]; let q=(qtyRaw===null||qtyRaw===""||isNaN(qtyRaw))?null:Math.max(0,Math.floor(qtyRaw));
    const min = kind==="ats"?LIC.minRecruiters:0;
    if(q===null){ flag("a","Missing "+cfg.label+" user count for "+(it.name||"instance "+(ix+1))+"."); q=min; }
    if(kind==="ats" && q<min){ flag("a",(it.name||"Instance "+(ix+1))+": "+q+" recruiter user(s) entered — minimum "+min+" is billed."); q=min; }
    let rem=q;
    const tier=[...cfg.tiers].sort((a,b)=>b.qty-a.qty).find(t=>rem>=t.qty);
    if(tier){ if(tier.status==="placeholder") usedPlaceholder=true;
      mkLine({ kind:kind+"-bundle", inst:ix, name:cfg.label+" Users — bundle of "+tier.qty+suffix, qty:1, users:tier.qty, unitList:tier.list, unitFinal:pick(tier,swBasis), unitFloor:tier.floor, note:"" }); rem-=tier.qty; }
    if(rem>0){ if(cfg.single.status==="placeholder") usedPlaceholder=true;
      mkLine({ kind:kind+"-single", inst:ix, name:"Additional "+cfg.label+" User"+suffix, qty:rem, users:rem, unitList:cfg.single.list, unitFinal:pick(cfg.single,swBasis), unitFloor:cfg.single.floor, note:"Users above the bundle" }); }
    return q;
  };
  insts.forEach((it,ix)=>{
    const suffix = N>1 ? " — "+(it.name||"Instance "+(ix+1)) : "";
    const pf = LIC.platform[pkg||"ONBOARD"];
    if(pf.status==="placeholder") usedPlaceholder=true;
    const pFinal = swBasis==="custom" ? (s.ov.platformMonthly!=null?s.ov.platformMonthly:pf.target) : pf[swBasis];
    const first=sw.length;
    mkLine({ kind:"platform", inst:ix, name:"ATS360 Platform"+suffix, qty:1, unitList:pf.list, unitFinal:pFinal*(1-dp(ix)), unitFloor:pf.floor*fFloor(dp(ix)),
      note:pf.includes+" · includes annual allowance of "+LIC.resume.allowance.toLocaleString("en-US")+" resume parses"+(dp(ix)>0?" · multi-company package price":"") });
    const rq=seatLines("ats",it.recruiters,it,ix,suffix);
    const hq=seatLines("hm",it.hms,it,ix,suffix);
    const mo=sw.slice(first).reduce((a,l)=>a+l.lineFinal,0);
    instInfo.push({ id:it.id, name:it.name||"Instance "+(ix+1), rec:rq, hm:hq, monthly:mo, countries:it.countries, everify:it.everify });
  });
  const pendingModules=[];
  Object.keys(s.modules).filter(k=>s.modules[k]).forEach(k=>{
    const p=P.modules[k]; if(!p) return;
    if(p.regions && !p.regions.includes(s.region)){ flag("r",p.name+" is not available in the selected region."); return; }
    const u=p[swBasis==="custom"?"target":swBasis];
    if(u==null){ pendingModules.push({key:k,name:p.name,note:p.note}); flag("a",p.name+": pricing approval required (TBD — not quoted)."); }
    else mkLine({ kind:"module", name:p.name, qty:1, unitList:p.list==null?u:p.list, unitFinal:u, unitFloor:p.floor==null?u:p.floor, note:p.note||"" });
  });
  const monthlyList=sw.reduce((a,l)=>a+l.lineList,0), monthlyFinal=sw.reduce((a,l)=>a+l.lineFinal,0), monthlyFloor=sw.reduce((a,l)=>a+l.lineFloor,0);
  const arr=monthlyFinal*12, arrList=monthlyList*12;
  if(usedPlaceholder) flag("i","Some licensing prices are still marked placeholder in the Configuration matrix.");

  /* ---- cost matrix ---- */
  const costRec=(+CM.aws||0)+(+CM.sdn||0)+(+CM.third||0)+(+CM.support||0)+(+CM.other||0);
  const gm=Math.min(0.95,Math.max(0,(+CM.margin||0)/100));
  const costFloorARR = costRec>0?costRec/(1-gm):0;
  const policyFloorARR = monthlyFloor*12;
  const effFloorARR = Math.max(policyFloorARR,costFloorARR);
  const costKnownSW = costRec>0;
  const roleRows = Object.entries(CM.roles).map(([k,r])=>({k,label:r.label,cost:+r.cost>0?+r.cost:null,mix:+r.mix>0?+r.mix:null}));
  const costed=roleRows.filter(r=>r.cost!=null); let blended=null, mixAssumed=false;
  if(costed.length){ const ms=costed.reduce((a,r)=>a+(r.mix||0),0);
    if(ms>0&&costed.every(r=>r.mix)) blended=costed.reduce((a,r)=>a+r.cost*r.mix,0)/ms; else { blended=costed.reduce((a,r)=>a+r.cost,0)/costed.length; mixAssumed=true; } }
  const rim = +CM.implMargin>0?Math.min(0.95,+CM.implMargin/100):null;

  /* ---- implementation: hours per instance × rate card ---- */
  const H=IMP.hours, rates=IMP.rates, crates=IMP.connRates;
  const baseRate=pick(rates,implBasis), connRate=pick(crates,implBasis);
  const coreH = s.oneWorld?H.core.oneWorld:H.core.nonOneWorld;
  const instHours = insts.map((it,ix)=>{
    const nC=Math.max(1,Object.values(it.countries).filter(Boolean).length);
    const evOn=!IMP.everifyHoursOnlyIfActive || (it.countries.US && it.everify==="activate");
    const ob=pkg==="ONBOARD";
    const o={ name:it.name||"Instance "+(ix+1), nC, core:pkg?coreH:0, ev:ob&&evOn?H.everify:0, es:ob?H.esig:0, pre:ob?H.prehire*nC:0 };
    o.total=o.core+o.ev+o.es+o.pre; return o;
  });
  const impl=[];
  const addImpl=(o)=>{ impl.push(o); };
  if(pkg){
    const tot=instHours.reduce((a,x)=>a+x.total,0);
    addImpl({ key:pkg, kind:"profile", name:IMP.packages[pkg].name+(N>1?" × "+N+" instances":""), baseName:IMP.packages[pkg].name, qty:N, hoursEach:tot/N, hours:tot,
      list:tot*rates.list, raw:instHours.reduce((a,x,ix)=>a+x.total*baseRate*(1-di(ix)),0), floor:instHours.reduce((a,x,ix)=>a+x.total*rates.floor*fFloor(di(ix)),0) });
  }
  const cdef = s.connKey?IMP.connections[s.connKey]:null;
  const anyUS = insts.some(it=>it.countries.US);
  let connIncluded=false, connQty=0, connHoursEach=0, payrollReady=false;
  if(cdef){
    connQty = Math.min(N,Math.max(1,Math.floor(s.connInstances||N)));
    const payOn = s.payrollEngine==="netsuite";
    connHoursEach = cdef.base + (payOn?cdef.pay:0);
    if(s.connDecision==="tbd") flag("a","HCM connection undecided ("+cdef.name+").");
    if(cdef.pay>0 && !payOn) flag("a","Payroll provider is not NetSuite payroll — payroll integration must be scoped separately (add it under Deal-Specific Scope).");
    if(cdef.pay>0 && payOn && !anyUS) flag("a","Payroll Readiness applies to U.S. operations only (NetSuite native payroll) — no U.S. pre-hire country is selected.");
    if(s.connDecision==="include" && connHoursEach>0){
      connIncluded=true; payrollReady = cdef.pay>0 && payOn;
      if(!pkg) flag("r","Required dependency missing: "+cdef.name+" requires an ATS360 package.");
      if(cdef.hcm && cdef.hcm!==s.hcm) flag("a",cdef.name+" does not match the selected HCM profile ("+P.hcmProfiles[s.hcm]+").");
      let fac=0; for(let k=0;k<connQty;k++){ fac+=1-di(k); }
      addImpl({ key:s.connKey, kind:"connect", name:cdef.name+(connQty>1?" × "+connQty+" instances":""), baseName:cdef.name, qty:connQty, hoursEach:connHoursEach, hours:connHoursEach*connQty,
        list:connHoursEach*connQty*crates.list, raw:connHoursEach*connRate*fac, floor:connHoursEach*crates.floor*(MT.applyToFloor?fac:connQty) });
    }
  } else if(s.hcm==="tbd") flag("a","NetSuite HCM profile still to be confirmed — connection scope unknown.");
  else if(s.hcm==="other") flag("a","HCM profile is Other / Custom — no standard connector; scope under Deal-Specific Scope.");
  if(s.hcm!=="none" && s.hcm!=="tbd" && s.hcm!=="other" && !cdef) flag("a","HCM profile is "+P.hcmProfiles[s.hcm]+" but no connection is selected.");
  if(pkg==="ONBOARD" && anyUS && !payrollReady) flag("i","No Payroll Readiness: the Pre-Hire Portal collects data to the employee record only — tax forms are not collected and nothing is pushed to payroll. Make sure the client expects this.");

  const rawTotal=impl.reduce((a,l)=>a+l.raw,0);
  const customImpl = implBasis==="custom";
  const customTotal = customImpl ? (s.ov.implTotal!=null?s.ov.implTotal:rawTotal) : null;
  impl.forEach(l=>{ l.final = customImpl ? (rawTotal>0?l.raw*customTotal/rawTotal:0) : l.raw; });
  const implList=impl.reduce((a,l)=>a+l.list,0), implFinal=impl.reduce((a,l)=>a+l.final,0), implFloor=impl.reduce((a,l)=>a+l.floor,0), implHours=impl.reduce((a,l)=>a+l.hours,0);
  const implFloorCost=(blended!=null&&rim!=null)?implHours*blended/(1-rim):0;
  const implFloorEff=Math.max(implFloor,implFloorCost);

  /* ---- E-Verify / pre-hire per instance ---- */
  let evSummary="none";
  if(pkg==="ONBOARD"){
    const evs=insts.map(it=>it.countries.US?it.everify:"na");
    evSummary = evs.every(e=>e==="na")?"na": evs.includes("tbd")?"tbd": evs.includes("activate")?"activate":"no";
    insts.forEach((it,ix)=>{ if(!Object.values(it.countries).some(Boolean)) flag("a","No pre-hire country selected for "+(it.name||"instance "+(ix+1))+"."); });
  }
  if(evSummary==="tbd") flag("i","E-Verify activation decision pending — confirm before kickoff.");

  /* ---- custom work ---- */
  const CR=IMP.customRates;
  const autoRate = implBasis==="list"?CR.list:implBasis==="floor"?CR.floor:CR.target;
  const rows=s.rows.map(r=>{
    const hours=+r.hours>0?+r.hours:0;
    const rate=r.rate==="auto"?autoRate:r.rate==="list"?CR.list:r.rate==="target"?CR.target:(r.customRate!=null?+r.customRate:CR.target);
    const pending=hours<=0;
    const o={...r,hoursN:hours,rateN:rate,pending,price:pending?null:r2(hours*rate),list:pending?null:hours*CR.list,floor:pending?null:hours*CR.floor,warn:"",warnLvl:"",included:false};
    if(r.include){
      if(r.status==="excluded"){ o.warn="Excluded rows cannot be quoted."; o.warnLvl="r"; }
      else if(pending){ o.warn="Cannot include in quote until commercial effort is approved."; o.warnLvl="a"; flag("r","Custom scope \""+(r.name||"Untitled")+"\" included without approved effort."); }
      else{ o.included=true;
        if(!["confirmed","recommended","future"].includes(r.status)){ o.warn="Status is “"+P.customWorkStatuses[r.status]+"” — confirm scope before sending."; o.warnLvl="a"; flag("a","Custom scope \""+(r.name||"Untitled")+"\" is quoted but status is "+P.customWorkStatuses[r.status]+"."); }
        if(r.status==="future"){ o.warn="Future Phase item manually activated for this quote."; o.warnLvl="a"; } }
    }
    return o;
  });
  const incRows=rows.filter(r=>r.included);
  const customFinal=incRows.reduce((a,r)=>a+r.price,0), customFloor=incRows.reduce((a,r)=>a+r.floor,0), customList=incRows.reduce((a,r)=>a+r.list,0), customHours=incRows.reduce((a,r)=>a+r.hoursN,0);
  const customFloorCost=(blended!=null&&rim!=null)?customHours*blended/(1-rim):0;
  const customFloorEff=Math.max(customFloor,customFloorCost);
  const pendingRows=rows.filter(r=>!r.included&&r.status!=="excluded");
  if(pendingRows.length) flag("i",pendingRows.length+" deal-specific item(s) pending / not quoted — excluded from totals.");

  /* ---- support, modules deps, future ---- */
  const sup=P.support[s.support], supportAnnual=sup.price==null?0:sup.price;
  if(sup.price==null) flag("a",sup.name+": pricing not yet approved (support pricing pending).");
  const fut=s.future.enabled?Object.keys(s.future.items).filter(k=>s.future.items[k]):[];
  const EH=futureProducts();
  fut.forEach(k=>{ flag("a",EH[k].name+": pricing TBD (future product, not quotable)."); (EH[k].requires||[]).forEach(req=>{ if(!fut.includes(req)) flag("r","Dependency: "+EH[k].name+" requires "+EH[req].name+"."); }); });
  if(Object.keys(s.modules).some(k=>s.modules[k])) flag("a","Optional module activation effort is not priced in any package — add it under Deal-Specific Scope or confirm it is out of scope.");
  if(s.modules["ATS-DOCUSIGN"]&&pkg==="ONBOARD") flag("i","DocuSign selected alongside native E-Signature — confirm the client needs both.");
  if(!s.oneWorld) flag("i","Non-OneWorld NetSuite: base implementation is "+H.core.nonOneWorld+" hours instead of "+H.core.oneWorld+" per instance (onboarding add-ons are extra). Confirm the edition before quoting.");
  if(!P.matrixApproved) flag("i","The pricing matrix is not marked approved (Configuration → General).");

  /* ---- term projection, billing profile, partner economics ---- */
  const pct=ch.partner?((+PB.pct||0)/100):0;
  if(ch.partner){ if(!PB.name.trim()) flag("a","Partner name missing."); if(PB.base==="fixed"?!(+PB.fixed>0):!(pct>0)) flag("a","Partner commission missing (set a default in Configuration → Channels & partners, or enter it on the deal)."); }
  const term=s.term, rawSub=[], rawSup=[];
  for(let y=1;y<=term;y++){ const g=Math.pow(1+esc_,y-1); rawSub.push(r2(arr*g)); rawSup.push(r2(supportAnnual*g)); }
  const level = s.billing==="level" && term>1;
  const levelSub=r2(rawSub.reduce((a,b)=>a+b,0)/term), levelSup=r2(rawSup.reduce((a,b)=>a+b,0)/term);
  const years=[];
  for(let y=1;y<=term;y++){
    const g=Math.pow(1+esc_,y-1);
    const subY=level?levelSub:rawSub[y-1], supY=level?levelSup:rawSup[y-1];
    const one=y===1?implFinal+customFinal:0;
    let recComp=0, oneComp=0;
    if(ch.partner){ const b=PB.base;
      if(b==="recurring"||b==="services") recComp=pct*subY;
      if(b==="services"&&y===1) oneComp=pct*((PB.svcImpl?implFinal:0)+(PB.svcCustom?customFinal:0));
      if(b==="fixed"&&y===1) oneComp=(+PB.fixed||0);
      if(b==="other"&&y===1) oneComp=pct*(+PB.otherBase||0); }
    const comp=r2(recComp+oneComp);
    years.push({ y, sub:subY, support:supY, impl:y===1?implFinal:0, custom:y===1?customFinal:0, total:r2(subY+supY+one), comp, retained:r2(subY+supY+one-comp), rawSub:rawSub[y-1], floorY:r2(effFloorARR*g), recRetained:r2(subY+supY-recComp) });
  }
  const y1=years[0];
  const recurringCompY1=ch.partner&&(PB.base==="recurring"||PB.base==="services")?pct*arr:0;
  const retainedARR=arr-recurringCompY1;
  const retainedImpl=implFinal-(ch.partner&&PB.base==="services"&&PB.svcImpl?pct*implFinal:0);
  const surplusTerm=years.reduce((a,y)=>a+(y.recRetained-y.floorY),0);

  /* ---- floors & executive overrides ---- */
  const floors=[
    { scope:"software", label:"Recurring software (ARR retained after partner compensation)", requested:retainedARR, floor:effFloorARR, active:true },
    { scope:"impl", label:"Implementation packages", requested:retainedImpl, floor:implFloorEff, active:impl.length>0 },
    { scope:"custom", label:"Included custom work", requested:customFinal, floor:customFloorEff, active:incRows.length>0 }
  ];
  let strategic=0;
  floors.forEach(f=>{
    f.below=f.active&&f.requested<f.floor-0.005; f.diff=f.below?r2(f.floor-f.requested):0;
    f.exec=f.below&&execValid(s,f.scope);
    f.funded=f.below&&!f.exec&&f.scope==="impl"&&surplusTerm>=f.diff;
    if(f.below){
      if(f.exec){ strategic+=f.diff; flag("a","Executive override on "+f.label+" — strategic investment "+fmt(f.diff)+" (approver: "+s.exec[f.scope].approver+")."); }
      else if(f.funded) flag("a","Implementation is "+fmt(f.diff)+" below floor but funded by "+fmt(surplusTerm)+" of recurring surplus over the "+term+"-year term — management review.");
      else flag("r",(f.scope==="software"&&ch.partner&&recurringCompY1>0?"Partner economics below floor — ":"Below commercial floor — ")+f.label+": "+fmt(f.requested)+" vs floor "+fmt(f.floor)+".",{scope:f.scope});
    }
  });

  /* ---- margins ---- */
  const svcCompCustom=ch.partner&&PB.base==="services"&&PB.svcCustom?pct*customFinal:0;
  const retainedCustom=customFinal-svcCompCustom;
  const pc=(rev,cost)=>(cost==null||rev<=0)?null:(rev-cost)/rev;
  const implCost=blended!=null?implHours*blended:null, customCost=blended!=null?customHours*blended:null;
  const needDelivery=implHours+customHours>0;
  const dealKnown=costKnownSW&&(!needDelivery||blended!=null);
  const oneTimeCost=needDelivery&&blended!=null?(implHours+customHours)*blended:0;
  const termRetained=years.reduce((a,y)=>a+y.retained,0);
  const mg={ swKnown:costKnownSW, costRec, blended, mixAssumed, roleRows,
    swMargin:pc(retainedARR,costKnownSW?costRec:null), swMarginD:costKnownSW?retainedARR-costRec:null,
    implCost, implMargin:pc(retainedImpl,implCost), implMarginD:implCost!=null?retainedImpl-implCost:null,
    customCost, customMargin:incRows.length?pc(retainedCustom,customCost):null,
    revPerHour:implHours>0?retainedImpl/implHours:null, dealKnown,
    dealMarginY1:dealKnown?y1.retained-(costRec+oneTimeCost):null, dealPctY1:dealKnown?pc(y1.retained,costRec+oneTimeCost):null,
    dealTerm:dealKnown?termRetained-(costRec*term+oneTimeCost):null, dealPctTerm:dealKnown?pc(termRetained,costRec*term+oneTimeCost):null };
  if(!costKnownSW) flag("i","Recurring cost-to-serve not yet in the Cost Matrix (Configuration) — software margin pending (does not block).");
  if(needDelivery&&blended==null) flag("i","Consultant / developer cost per hour not yet in the Cost Matrix (Configuration) — delivery margin pending (does not block).");
  if(mg.implMargin!=null&&mg.implMargin<0) flag("a","Implementation is priced below delivery cost (negative margin).");
  if(mg.swMargin!=null&&mg.swMargin<0) flag("a","Recurring software is priced below cost to serve (negative margin).");

  const status=F.some(x=>x.lvl==="r")?"r":F.some(x=>x.lvl==="a")?"a":"g";
  F.sort((a,b)=>({r:0,a:1,i:2}[a.lvl]-{r:0,a:1,i:2}[b.lvl]));

  return { seg, ch, PB, swBasis, implBasis, esc:esc_, insts, N, pkg, sw, instInfo, instHours, monthlyList, monthlyFinal, monthlyFloor, arr, arrList, pendingModules,
    costRec, costFloorARR, policyFloorARR, effFloorARR,
    impl, implList, implFinal, implFloor, implHours, implFloorEff, coreH, baseRate, connRate, dPlat, dImpl,
    cdef, connIncluded, connQty, connHoursEach, payrollReady, anyUS, evSummary,
    rows, incRows, customFinal, customFloor, customFloorEff, customList, customHours, pendingRows, autoRate,
    sup, supportAnnual, fut, years, y1, level, levelSub, levelSup, recurringCompY1, retainedARR, retainedImpl, surplusTerm,
    floors, strategic, mg, flags:F, status };
}

  let connExtra="";
  if(S.connKey){ const d=IMP.connections[S.connKey];
    connExtra=`<div class="grid g3" style="margin-top:12px;align-items:end">

  /* 9 support */
  const supCards=Object.entries(P.support).map(([k,d])=>`<button class="choice ${S.support===k?"sel":""}" data-act="pickSupport" data-v="${k}"><span class="tick">${S.support===k?"&#10003;":""}</span><h4>${d.name}</h4>

    ${k==="standard"?`<div class="hint" style="margin-top:8px"><b>Internal:</b> named-contact window and quick-fix fair-use threshold are not finalised — don't promise them.</div>`:""}</button>`).join("");
  h+=sec("support","9. Post-Go-Live Support","Support is not consulting",`<div class="choices">${supCards}</div>
    <div class="grid g2" style="margin-top:14px"><div class="note g"><b>Included support</b><ul style="margin:4px 0 0 16px;padding:0"><li>Defects</li><li>Tickets &amp; basic questions</li><li>Release communications</li><li>Standard product support</li></ul></div>
    <div class="note a"><b>Paid consulting / Change Order</b><ul style="margin:4px 0 0 16px;padding:0"><li>Workflow redesign · new configuration · new forms</li><li>Integrations · new modules</li><li>Training · workshops · custom automation · environment changes</li></ul></div></div>`,
    `<span class="pill ${P.support[S.support].price==null?"a":"g"}">${P.support[S.support].name}</span>`);

  /* 10 basis */
  const fl=c.floors.filter(f=>f.below);
  h+=sec("basis","10. Pricing Basis & Commercial Controls","Internal only",`
    <div class="grid g2"><div class="kvbox"><small class="hint">Effective Software Pricing Basis</small><div><b>${BASIS_LABEL[c.swBasis]}</b> <span class="hint">${S.ov.swBasis==="auto"?"(from channel)":"(manual override)"}</span></div></div>
    <div class="kvbox"><small class="hint">Effective Implementation Pricing Basis</small><div><b>${BASIS_LABEL[c.implBasis]}</b> <span class="hint">${S.ov.implBasis==="auto"?"(from channel)":"(manual override)"}</span></div></div></div>
    <details style="margin-top:12px" ${S.ov.swBasis!=="auto"||S.ov.implBasis!=="auto"||Object.keys(S.exec).length?"open":""}><summary class="linkbtn" style="cursor:pointer">Commercial Override</summary>

        ${S.ov.swBasis==="custom"?`<label class="f"><span class="l">Custom platform price ($/month per instance)</span><input type="number" min="0" step="1" data-t="num" data-k="ov.platformMonthly" data-guard="software" value="${S.ov.platformMonthly==null?"":S.ov.platformMonthly}" placeholder="${pf(S.pkg||"ONBOARD").target}"><div class="hint">Floor ${fmt(pf(S.pkg||"ONBOARD").floor)}/mo · users priced at Target</div></label>`:""}
        ${S.ov.implBasis==="custom"?`<label class="f"><span class="l">Custom implementation total ($)</span><input type="number" min="0" step="1" data-t="num" data-k="ov.implTotal" data-guard="impl" value="${S.ov.implTotal==null?"":S.ov.implTotal}" placeholder="${Math.round(c.impl.reduce((a,l)=>a+l.raw,0))}"><div class="hint">Effective floor ${fmt(c.implFloorEff)} (higher of policy and cost-derived)</div></label>`:""}
        <label class="f"><span class="l">Annual escalation (%)</span><input type="number" min="0" step="0.5" data-t="num" data-k="ov.escalation" value="${S.ov.escalation==null?"":S.ov.escalation}"><div class="hint">Policy default ${P.escalation}%</div></label></div>
      ${fl.length?`<div class="sub">Floor exceptions</div>${fl.map(f=>`<div class="flag ${f.exec||f.funded?"a":"r"}"><span>${f.label}: ${fmt(f.requested)} vs floor ${fmt(f.floor)} (short ${fmt(f.diff)})${f.funded?" — funded by recurring surplus":""}</span><span class="fx"><button class="linkbtn" data-act="requestExec" data-scope="${f.scope}">${f.exec?"Edit override":"Request executive override"}</button></span></div>`).join("")}`:""}
    </details>
    <div class="note b" style="margin-top:12px"><b>Cost-to-serve lives in the Cost Matrix.</b> Enter recurring costs and consultant / developer cost per hour in <button class="linkbtn" data-act="setView" data-v="config">Configuration (Matrix)</button>; every deal then shows its margin automatically. Until then margins read “Pending cost inputs”.
      <div class="hint" style="margin-top:6px">Current: recurring cost ${c.costRec>0?fmt(c.costRec)+"/yr":"pending"} · blended delivery cost ${c.mg.blended==null?"pending":fmt(c.mg.blended)+"/hr"}</div></div>`);

  const fw=P.accounting.frameworks[acctFramework(S)];

function MT_applies(){ return P.multi.appliesTo==="all"?"all":"additional"; }
function swPrice(p){ const c0=S.ov.swBasis==="auto"?P.channels[S.channel].swBasis:S.ov.swBasis; return c0==="custom"?(S.ov.platformMonthly!=null?S.ov.platformMonthly:p.target):p[c0]; }
function calcAutoRate(){ const b=S.ov.implBasis==="auto"?P.channels[S.channel].implBasis:S.ov.implBasis; return b==="list"?IMP.customRates.list:b==="floor"?IMP.customRates.floor:IMP.customRates.target; }
function rowPriceText(r){ if(r.status==="excluded") return "Excluded"; if(r.pending) return r.status==="future"?"Future Phase":"Pending Scope"; return fmt(r.price); }
function rowHtml(r,stOpts){
  return `<div class="crow"><div class="top">
    <label class="f"><span class="l">Requirement / Component</span><input type="text" data-row="${r.id}" data-f="name" value="${esc(r.name)}"></label>
    <label class="f"><span class="l">Scope Status</span><select data-row="${r.id}" data-f="status" data-struct="1">${stOpts.map(([v,l])=>`<option value="${v}" ${r.status===v?"selected":""}>${l}</option>`).join("")}</select></label>
    <label class="f"><span class="l">Est. hours</span><input type="number" min="0" step="0.5" data-t="num" data-row="${r.id}" data-f="hours" value="${r.hours==null?"":r.hours}" placeholder="—"></label>
    <label class="f"><span class="l">Pricing rate</span><select data-row="${r.id}" data-f="rate" data-struct="1"><option value="auto" ${r.rate==="auto"?"selected":""}>Auto (${fmt(calcAutoRate())}/hr)</option><option value="list" ${r.rate==="list"?"selected":""}>List ${fmt(IMP.customRates.list)}</option><option value="target" ${r.rate==="target"?"selected":""}>Target ${fmt(IMP.customRates.target)}</option><option value="custom" ${r.rate==="custom"?"selected":""}>Custom…</option></select>
      ${r.rate==="custom"?`<input type="number" min="0" step="1" data-t="num" data-row="${r.id}" data-f="customRate" value="${r.customRate==null?"":r.customRate}" placeholder="$/hr" style="margin-top:4px">`:""}</label>
    <label class="chk"><input type="checkbox" data-row="${r.id}" data-f="include" data-struct="1" ${r.include?"checked":""} ${r.status==="excluded"?"disabled":""}> Include in quote</label>
    <div class="calc ${r.pending?"pend":""}" id="rp-${r.id}">${rowPriceText(r)}</div></div>
    <div id="rw-${r.id}">${r.warn?`<div class="note ${r.warnLvl==="r"?"r":"a"}">${r.warn}</div>`:""}</div>
    <details><summary>Details, quantities &amp; open questions</summary><div class="more">
      <label class="f"><span class="l">Description</span><textarea data-row="${r.id}" data-f="desc">${esc(r.desc)}</textarea></label>
      <div class="grid g2" style="margin-top:8px"><label class="f"><span class="l">Quantity label</span><input type="text" data-row="${r.id}" data-f="qtyLabel" value="${esc(r.qtyLabel)}"></label><label class="f"><span class="l">Quantity</span><input type="text" data-row="${r.id}" data-f="qty" value="${esc(r.qty)}" placeholder="blank = unknown"></label></div>
      <label class="f" style="margin-top:8px"><span class="l">Notes</span><textarea data-row="${r.id}" data-f="notes">${esc(r.notes)}</textarea></label>
      <label class="f" style="margin-top:8px"><span class="l">Open questions (one per line)</span><textarea data-row="${r.id}" data-f="questions">${esc((r.questions||[]).join("\n"))}</textarea></label>
      <div style="display:flex;gap:18px;margin-top:10px;align-items:center;flex-wrap:wrap"><label class="chk"><input type="checkbox" data-row="${r.id}" data-f="showPending" ${r.showPending?"checked":""}> Show on client proposal as “Optional / Pending Scope”</label><button class="linkbtn red" data-act="delRow" data-v="${r.id}">Remove row</button></div></div></details></div>`;
}
function updateInlineHints(c){
  c.instInfo.forEach(i=>{ const e=document.querySelector(`[data-hint="inst:${i.id}"]`); if(e) e.textContent=`Billed: ${i.rec} recruiter + ${i.hm} hiring manager users · ${fmt(i.monthly)} / month for this instance`; });
  const set=(k,v)=>{ const e=document.querySelector(`[data-hint="${k}"]`); if(e) e.textContent=v; };
  set("p-cust",fmt(c.y1.total)); set("p-comp","− "+fmt(c.y1.comp)); set("p-ret",fmt(c.y1.retained));
}

   OUTPUTS

function kv(k,v,cls=""){ return `<div class="kv ${cls}"><span class="k">${k}</span><span class="v ${v==="Pending Scope"||v==="Pricing TBD"||String(v).indexOf("Pending")===0?"pend":""}">${v}</span></div>`; }
function pctStr(e){ return (e*100).toFixed(e*100%1?1:0)+"%"; }
function renderOutputs(c){
  c=c||calc(S);
  $("outName").textContent=(S.client||"Untitled deal")+" · "+c.ch.label;
  const st=$("outStatus"); st.className="status "+c.status; st.textContent=c.status==="g"?"WITHIN POLICY":c.status==="a"?"REVIEW REQUIRED":"BLOCKED";
  $("pane-summary").innerHTML=summaryHtml(c);
  $("pane-proposal").innerHTML=proposalHtml(c);
  $("pane-handoff").innerHTML=handoffHtml(c);
  $("pane-contract").innerHTML=contractHtml(c);
  $("pane-pricelist").innerHTML=priceListHtml();
  updateInlineHints(c);
  $("topTag").innerHTML="Internal deal configurator · mockup · matrix v"+esc(P.version)+" · "+(P.matrixApproved?"<b style=\"color:#8fe0b0\">approved</b>":"<b style=\"color:#ffd27a\">proposed values</b>");
}
function marginBlock(c){
  const m=c.mg, PN="Pending cost inputs", pf=n=>n==null?PN:(n*100).toFixed(1)+"%", both=(p,d)=>p==null?PN:pf(p)+" ("+fmt(d)+")", cls=n=>n!=null&&n<0?"neg":"";
  return `<div class="sumblock"><h5>Margin — internal (after partner compensation)</h5>
    ${kv("Recurring cost to serve / yr",m.swKnown?fmt(m.costRec):PN)}${kv("Software margin (Year 1 ARR retained)",both(m.swMargin,m.swMarginD))}
    ${kv("Blended delivery cost / hour",m.blended==null?PN:fmt(m.blended)+(m.mixAssumed?" (equal mix assumed)":""))}
    ${kv("Revenue per commercial hour",m.revPerHour==null?"—":fmt(m.revPerHour)+"/hr")}
    ${kv("Implementation delivery cost",m.implCost==null?(c.implHours?PN:"—"):fmt(m.implCost))}${kv("Implementation margin",c.impl.length?both(m.implMargin,m.implMarginD):"—")}
    ${c.incRows.length?kv("Custom work margin",m.customMargin==null?PN:pf(m.customMargin)):""}
    ${kv("Deal margin — Year 1",m.dealPctY1==null?PN:`<span class="${cls(m.dealMarginY1)}">${pf(m.dealPctY1)} (${fmt(m.dealMarginY1)})</span>`,"big")}
    ${kv("Deal margin — "+S.term+"-year term",m.dealPctTerm==null?PN:pf(m.dealPctTerm)+" ("+fmt(m.dealTerm)+")")}</div>`;
}
function summaryHtml(c){
  const yrs=c.years.map(y=>kv("Year "+y.y+(y.y===1?" (subscription + implementation + custom + support)":c.level?" (level billing)":" (recurring, +"+pctStr(c.esc)+"/yr compounded)"),fmt(y.total))).join("");
  const sub=c.sw.map(l=>kv(l.name+(l.qty>1?" × "+l.qty:""),fmt(l.lineFinal)+"/mo")).join("");

    add("4. "+d.name,`<p><b>Prerequisites:</b> ${d.hcm==="gov"?"Customer maintains an active Government HCM / NS4G environment with Position and Requisition data available":d.hcm==="sp"?"Customer maintains an active NetSuite SuitePeople environment":"Customer’s payroll is run in NetSuite"}, and approves one standard workflow before work begins.</p><p><b>Scope (${c.connQty} instance${c.connQty>1?"s":""}):</b> ${d.scope.join("; ")}.</p>${d.pay>0?"<p>Payroll readiness covers mapping I-9, W-4 / W-2 data to NetSuite payroll. Other payroll providers are outside this scope.</p>":""}<p><b>Change Order boundary:</b> custom fields, alternate triggers, approval paths, additional subsidiaries, non-standard mappings and custom payroll requirements are outside this scope.</p>`); }
  if(c.impl.length) add("Fixed-Fee / Fixed-Scope Provision",fixed);

  add("Commercial Terms",`<p>Subscription: Year 1 payable in advance upon signature; monthly thereafter. ${c.level?`Billing profile: level annual amount of ${fmt(c.levelSub+c.levelSup)} across the ${S.term}-year term, with the ${pctStr(c.esc)} annual escalation built in.`:`Annual escalation: ${pctStr(c.esc)}.`} Implementation: due upon signature. Project scheduling begins upon receipt of the first invoice payment.</p>`);
  return `<div class="doc"><div class="no-print" style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn sm" data-act="print" data-v="contract">Print</button></div>
    <div class="intbar">INTERNAL DRAFT — mock clause language generated from selections. Requires legal review before use.</div>${docHeader("Contract / SOW Scope Summary",S.client)}${cl.join("")}</div>`;
}

function priceListDoc(){
  const pl=S.priceList, pf=LIC.platform.ONBOARD, a=LIC.seats.ats, hm=LIC.seats.hm, R=IMP.rates.list, H=IMP.hours;
  const onb=(ow)=>(ow?H.core.oneWorld:H.core.nonOneWorld)+H.everify+H.esig+H.prehire;
  const sub=[["ATS360 Platform — per ATS instance","Includes E-Signature, Pre-Hire Portal and E-Verify capability, and an annual allowance of "+LIC.resume.allowance.toLocaleString("en-US")+" resume parses. Does not include user licenses.",fmt(pf.list)+" / month<div class='small'>"+fmt(pf.list*12)+" / year</div>"],

    ["Additional ATS360 Recruiter User","Above the bundle",fmt(a.single.list)+" / user / month"],

  const impl=`<tr><td>ATS360 Onboarding Deployment — NetSuite OneWorld</td><td class="small">Core ATS360 configuration plus E-Verify, native E-Signature and Pre-Hire Portal. Per ATS instance.</td><td class="n">${fmt(onb(true)*R)}</td></tr>
    <tr><td>ATS360 Onboarding Deployment — NetSuite non-OneWorld</td><td class="small">As above for a non-OneWorld NetSuite account. Per ATS instance.</td><td class="n">${fmt(onb(false)*R)}</td></tr>
    <tr><td>Additional Pre-Hire country (per instance)</td><td class="small">Each additional country needs its own portal and employee-record mapping.</td><td class="n">${fmt(H.prehire*R)}</td></tr>${conn}`;
  const mods=Object.values(P.modules).map(p=>`<tr><td>${esc(p.name)}</td><td class="small">${esc(p.note||"")}</td><td class="n">${p.list==null?"<span class='pendtxt'>Pricing available on request</span>":fmt(p.list)+" / month"}</td></tr>`).join("");
  const sup=Object.values(P.support).map(d=>`<tr><td>${d.name}</td><td class="small">${d.price===0?d.items.join(" · "):"Scope and pricing not yet approved"}</td><td class="n">${d.price===0?"Included in subscription":"<span class='pendtxt'>Not yet available</span>"}</td></tr>`).join("");
  return `<div class="doc">${pl.approved?"":`<div class="draftbar">DRAFT — pricing is proposed and has not been approved for release.</div>`}
    ${docHeader("ATS360 List Price Sheet",pl.partner||"Partner").replace(/<div class="meta">.*?<\/div>/,`<div class="meta"><b>Prepared for ${esc(pl.partner||"Partner")}</b> &middot; ${new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"})}${pl.valid?` &middot; Valid until ${esc(pl.valid)}`:""}</div>`)}
    <p class="small" style="margin-top:8px">ATS360 is NetDynamic’s NetSuite-native applicant tracking solution. All prices in USD, exclusive of taxes. A multi-company customer receives one ATS instance per company; subscription and implementation prices repeat per instance.</p>
    <h3>Subscription</h3><table><thead><tr><th>Component</th><th>Details</th><th class="n">List Price</th></tr></thead><tbody>${sub}</tbody></table><div class="small">${P.terms.licensing}</div>
    <h3>Implementation — fixed fee, fixed scope (per ATS instance)</h3><table><thead><tr><th>Package</th><th>Description</th><th class="n">List Price</th></tr></thead><tbody>${impl}</tbody></table>
    <div class="small">Pre-hire configuration is built for the United States, Canada and the United Kingdom; other countries are scoped separately. Connection packages apply only where the customer uses the matching HCM environment. Payroll Readiness applies to U.S. operations on NetSuite payroll only; without it the Pre-Hire Portal collects data to the employee record only (no tax forms, nothing pushed to payroll). ${P.terms.oneTime}.</div>
    ${pl.showModules?`<h3>Optional Modules &amp; Integrations</h3><table><thead><tr><th>Module</th><th>Notes</th><th class="n">List Price</th></tr></thead><tbody>${mods}</tbody></table>`:""}
    ${pl.showSupport?`<h3>Post-Go-Live Support</h3><table><thead><tr><th>Plan</th><th>Includes</th><th class="n">Price</th></tr></thead><tbody>${sup}</tbody></table>`:""}
    <h4>Terms</h4><ul class="small"><li>Subscriptions auto-renew annually with a ${P.escalation}% increase beginning in Year 2 unless otherwise stated in the agreement.</li><li>Implementation is fixed fee / fixed scope; out-of-scope work requires a Change Order.</li><li>Standard connection packages cover one approved standard workflow. Custom integrations, data migration and additional scope are quoted separately.</li><li>E-Verify is available to eligible U.S. employers; employer enrollment and account requirements apply.</li><li>DocuSign and Checkr require the customer’s own account; Checkr is U.S. only. SMS third-party usage charges may apply.</li><li>Additional resume parses beyond the annual allowance: ${fmt(LIC.resume.overage)} each.</li><li>NetDynamic will commence project scheduling upon receipt of the first invoice payment.</li></ul></div>`;
}

/* =====================================================================
   CONFIGURATION VIEW — editable pricing matrix (persisted in this browser)
   Every value the engine reads is edited here; blank = pending (never $0).
   ===================================================================== */
const CFG_KEY="nd_ats360_matrix_v3";
const cfgOpen={gen:true,lic:true,impl:true,hours:true,multi:true,seg:false,chan:true,mod:true,cost:true,acct:false};
function deepAssign(t,s){ Object.keys(s).forEach(k=>{ const sv=s[k]; if(sv&&typeof sv==="object"&&!Array.isArray(sv)&&t[k]&&typeof t[k]==="object"&&!Array.isArray(t[k])) deepAssign(t[k],sv); else t[k]=JSON.parse(JSON.stringify(sv===undefined?null:sv)); }); }
function saveCfg(){ try{ localStorage.setItem(CFG_KEY,JSON.stringify(P)); }catch(e){} }
function loadCfg(){ try{ const d=JSON.parse(localStorage.getItem(CFG_KEY)||"null"); if(d){ deepAssign(P,d); return true; } }catch(e){} return false; }
function resetCfg(){ deepAssign(P,JSON.parse(JSON.stringify(P_DEFAULT))); saveCfg(); }
function exportCfg(){ const blob=new Blob([JSON.stringify(P,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="ATS360_pricing_matrix_v"+(P.version||"matrix")+".json"; document.body.appendChild(a); a.click(); a.remove(); }
function importCfg(file){ if(!file) return; const rd=new FileReader(); rd.onload=()=>{ try{ deepAssign(P,JSON.parse(rd.result)); saveCfg(); renderConfig(); toast("Matrix imported"); }catch(e){ toast("That file is not a valid matrix export."); } }; rd.readAsText(file); }

function cin(path,o={}){ const v=getPath(P,path), t=o.t||"num";
  if(t==="num") return `<input type="number" step="any" min="0" data-cfg="${path}" data-t="num" ${o.req?'data-req="1"':""} value="${v==null?"":v}" placeholder="${o.req?"":"pending"}">`;
  if(t==="area") return `<textarea data-cfg="${path}">${esc(v)}</textarea>`;
  return `<input type="text" data-cfg="${path}" value="${esc(v)}">`; }
function csel(path,opts){ const v=getPath(P,path); return `<select data-cfg="${path}">${opts.map(([a,c])=>`<option value="${a}" ${String(v)===String(a)?"selected":""}>${esc(c)}</option>`).join("")}</select>`; }
function cchk(path,label){ return `<label class="chk"><input type="checkbox" data-cfg="${path}" ${getPath(P,path)?"checked":""}> ${label}</label>`; }
const CFG_ST=[["placeholder","Placeholder"],["proposed","Proposed"],["approved","Approved"]];
function prow(label,base,o={}){ const has=getPath(P,base).status!==undefined; return `<tr><td>${label}</td>${["list","target","strategic","floor"].map(k=>`<td>${cin(base+"."+k,{req:o.req})}</td>`).join("")}<td>${has?csel(base+".status",CFG_ST):"—"}</td></tr>`; }
function csec(id,title,sub,body){ const open=!!cfgOpen[id]; return `<section class="card ${open?"open":""}"><button class="hd" data-act="cfgToggle" data-id="${id}"><span class="chev">&#9656;</span><span class="t">${title}</span><span class="s">${sub||""}</span><span class="sp"></span></button><div class="bd">${body}</div></section>`; }
const BASIS_OPTS=[["list","List"],["target","Target"],["strategic","Strategic"],["floor","Floor"]];

    ${[["aws","AWS allocated annual cost per client ($)"],["sdn","SDN allocated annual cost per client ($)"],["third","Third-party recurring cost ($ / yr)"],["support","Support delivery cost ($ / yr)"],["other","Other direct cost ($ / yr)"],["margin","Required software gross margin (%)"],["implMargin","Required implementation gross margin (%)"]].map(([k,l])=>`<label class="f"><span class="l">${l}</span>${cin("costMatrix."+k)}</label>`).join("")}</div>
    <div class="sub">Delivery cost — what NetDynamic pays per hour</div><table class="mx"><thead><tr><th>Role</th><th class="n">Cost / hour ($)</th><th class="n">Share of delivery hours (%)</th></tr></thead><tbody>
    ${Object.keys(CM.roles).map(k=>`<tr><td>${esc(CM.roles[k].label)}</td><td>${cin("costMatrix.roles."+k+".cost")}</td><td>${cin("costMatrix.roles."+k+".mix")}</td></tr>`).join("")}</tbody></table>
    <div class="hint">Blank costs show “Pending cost inputs” on every deal. Shares left blank average the roles that have a cost. Software floor = higher of the matrix floor and cost ÷ (1 − required margin); a required implementation margin makes implementation and custom floors cost-based too.</div>`);

  h+=csec("acct","Capital vs operating framing","Indicative text used on the deal and (optionally) the proposal",`<div class="note a" style="margin-top:0">${esc(P.accounting.disclaimer)}</div>
    ${Object.keys(P.accounting.frameworks).map(k=>`<div class="sub">${esc(P.accounting.frameworks[k].label)}</div><label class="f"><span class="l">Selling angle</span>${cin("accounting.frameworks."+k+".angle",{t:"area"})}</label>
      <table class="mx"><tbody>${["subscription","implementation","training","custom","support"].map(l=>`<tr><td style="width:160px">${l}</td><td>${cin("accounting.frameworks."+k+".lines."+l,{t:"text"})}</td></tr>`).join("")}</tbody></table>`).join("")}`);
  h+=`<div class="cfgbar"><button class="btn pri" data-act="setView" data-v="builder">← Back to Deal Builder</button></div></div>`;
  $("cfgView").innerHTML=h;
  if(window.__cfgFocus){ const el=$("cfgView").querySelector(window.__cfgFocus); if(el) el.focus(); window.__cfgFocus=null; }
}
function cfgField(e,t){
  const path=t.dataset.cfg;
  let v=t.type==="checkbox"?t.checked:t.dataset.t==="num"?(t.value===""?null:parseFloat(t.value)):t.value;
  if(t.dataset.t==="num"){
    if(v==null&&t.dataset.req){ if(e.type==="change"){ renderConfig(); toast("This value is required"); } return; }
    if(v!=null&&isNaN(v)) return;
  }
  setPath(P,path,v); saveCfg();
  if(t.tagName==="SELECT"||t.type==="checkbox"){ window.__cfgFocus='[data-cfg="'+path+'"]'; renderConfig(); }
}
function setView(v){
  ui.view=v;
  document.querySelector(".layout").style.display=v==="builder"?"":"none";
  $("cfgView").style.display=v==="config"?"block":"none";
  $("vBuilder").classList.toggle("on",v==="builder"); $("vConfig").classList.toggle("on",v==="config");
  if(v==="config") renderConfig(); else renderLeft();
  window.scrollTo(0,0);
}

/* =====================================================================
   MODALS / EVENTS
   ===================================================================== */
function toast(t){ const e=$("toast"); e.textContent=t; e.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("on"),2200); }
function openModal(html,wide){ $("modal").className="modal"+(wide?" wide":""); $("modal").innerHTML=html; $("modalBg").classList.add("on"); const f=$("modal").querySelector("input,select,button"); if(f) f.focus(); }
function closeModal(){ $("modalBg").classList.remove("on"); $("modal").innerHTML=""; }
let pendingOverride=null;
function openOverride(scope,cancelFn){
  const c=calc(S), f=c.floors.find(x=>x.scope===scope); if(!f) return; const e=S.exec[scope]||{}; pendingOverride={scope,cancelFn};
  openModal(`<div class="mh red">Price Below Approved Floor</div><div class="mb"><div class="grid g3" style="margin-bottom:14px"><div class="kvbox"><small class="hint">Requested</small><div><b>${fmt(f.requested)}</b></div></div><div class="kvbox"><small class="hint">Approved floor</small><div><b>${fmt(f.floor)}</b></div></div><div class="kvbox"><small class="hint">Executive Strategic Investment</small><div><b style="color:var(--red)">${fmt(Math.max(0,f.floor-f.requested))}</b></div></div></div>
    <div class="hint" style="margin-bottom:10px">${esc(f.label)}. The difference stays internal and never appears on the client proposal.</div>
    <label class="chk" style="margin-bottom:10px"><input type="checkbox" id="exYes" ${e.yes?"checked":""}> Executive Override = Yes</label>
    <label class="f"><span class="l">Approver Name</span><input type="text" id="exWho" value="${esc(e.approver||"")}"></label>
    <label class="f" style="margin-top:10px"><span class="l">Override Reason</span><select id="exWhy"><option value="">Select…</option>${["Strategic account","Market entry","Partner commitment","Reference customer","Executive decision","Other"].map(r=>`<option ${e.reason===r?"selected":""}>${r}</option>`).join("")}</select></label>
    <div id="exErr" class="note r" style="display:none"></div></div><div class="mf"><button class="btn" data-act="exCancel">Cancel</button><button class="btn pri" data-act="exConfirm">Record override</button></div>`);
}
function exConfirm(){ const yes=$("exYes").checked, who=$("exWho").value.trim(), why=$("exWhy").value; if(!yes||!who||!why){ const e=$("exErr"); e.style.display="block"; e.textContent="Select Executive Override = Yes, enter the approver’s name and choose a reason."; return; } S.exec[pendingOverride.scope]={yes:true,approver:who,reason:why}; pendingOverride=null; closeModal(); renderLeft(); toast("Executive override recorded"); }
function exCancel(){ const p=pendingOverride; pendingOverride=null; closeModal(); if(p&&p.cancelFn) p.cancelFn(); renderLeft(); }
function validateDeal(){
  const c=calc(S), groups=[["r","Blocked","Resolve or override"],["a","Review required","Resolve or accept before sending"],["i","For awareness",""]];
  const body=c.flags.length?groups.map(([l,t,s])=>{ const fl=c.flags.filter(f=>f.lvl===l); return fl.length?`<div class="sub">${t} (${fl.length}) <span style="font-weight:400;color:var(--muted)">${s}</span></div>${fl.map(f=>`<div class="flag ${l}"><span>${esc(f.msg)}</span></div>`).join("")}`:""; }).join(""):`<div class="note g">No exceptions. Deal is within policy.</div>`;
  openModal(`<div class="mh">Deal validation — <span class="status ${c.status}" style="margin-left:6px">${c.status==="g"?"WITHIN POLICY":c.status==="a"?"REVIEW REQUIRED":"BLOCKED"}</span></div><div class="mb">${body}</div><div class="mf"><button class="btn pri" data-act="closeModal">Close</button></div>`);
}
function setPath(o,path,v){ const p=path.split("."); let x=o; for(let i=0;i<p.length-1;i++) x=x[p[i]]; x[p[p.length-1]]=v; }
function getPath(o,path){ return path.split(".").reduce((x,k)=>x[k],o); }
function focusSelector(t){ if(t.dataset.k) return `[data-k="${t.dataset.k}"]`; if(t.dataset.row) return `[data-row="${t.dataset.row}"][data-f="${t.dataset.f}"]`; if(t.dataset.inst) return `[data-inst="${t.dataset.inst}"][data-f="${t.dataset.f}"]`; return null; }
function valOf(t){ return t.type==="checkbox"?t.checked : t.dataset.t==="num"?(t.value===""?null:parseFloat(t.value)) : t.value; }

function onField(e){
  const t=e.target; if(!(t instanceof HTMLElement)) return;
  if(t.dataset.cfg!==undefined){ cfgField(e,t); return; }
  if(t.dataset.k!==undefined){
    let v=valOf(t); const k=t.dataset.k;
    if(k==="partner.base"&&v==="") v=null;
    if(t.tagName==="SELECT"&&k==="term") v=parseInt(v,10);
    if(k.indexOf("priceList.")===0){ setPath(S,k,v); const d=$("plDoc"); if(d) d.innerHTML=priceListDoc(); return; }
    if(t.dataset.guard&&e.type==="change"&&v!=null){ if(guardedChange(t.dataset.guard,k,v)) return; }
    setPath(S,k,v);
    if(k==="hcm"){ S.connKey = v==="gov"?"GOV":v==="sp"?"SP":""; S.connDecision = S.connKey?"include":"tbd"; }
    if(k==="region"&&v!=="US") S.modules["ATS-CHECKR"]=false;
    if(k==="channel") S.partnerId="";
    if(k==="ov.swBasis"&&v!=="custom") S.ov.platformMonthly=null;
    if(k==="ov.implBasis"&&v!=="custom") S.ov.implTotal=null;
    if(k==="segment"&&!S.pkg) S.pkg=P.segments[v].defaultPackage;
    if(t.tagName==="SELECT"||t.type==="checkbox"){ window.__focus=focusSelector(t); renderLeft(); } else renderOutputs();
    return;
  }
  if(t.dataset.inst){
    const it=S.instances.find(x=>x.id===t.dataset.inst); if(!it) return; const f=t.dataset.f, v=valOf(t);
    if(f.indexOf("cty_")===0){ it.countries[f.slice(4)]=v; window.__focus=focusSelector(t); renderLeft(); return; }
    it[f]=v; renderOutputs(); return;
  }
  if(t.dataset.row){
    const r=S.rows.find(x=>x.id===t.dataset.row); if(!r) return; const f=t.dataset.f; let v=valOf(t);
    if(f==="questions") v=t.value.split("\n").map(x=>x.trim()).filter(Boolean);
    r[f]=v; if(f==="status"&&v==="excluded") r.include=false;
    if(t.dataset.struct){ window.__focus=focusSelector(t); renderLeft(); } else { const c=calc(S); updateRowCells(c); renderOutputs(c); }
  }
}
function updateRowCells(c){ c.rows.forEach(r=>{ const p=$("rp-"+r.id), w=$("rw-"+r.id); if(p){ p.textContent=rowPriceText(r); p.className="calc "+(r.pending?"pend":""); } if(w) w.innerHTML=r.warn?`<div class="note ${r.warnLvl==="r"?"r":"a"}">${r.warn}</div>`:""; }); }
function guardedChange(scope,k,v){
  const c0=calc(S); const floor=scope==="software"?LIC.platform[S.pkg||"ONBOARD"].floor:scope==="impl"?c0.implFloorEff:0;
  if(scope!=="software"&&scope!=="impl") return false;
  if(v>=floor-0.005){ delete S.exec[scope]; return false; }
  setPath(S,k,v); openOverride(scope,()=>{ setPath(S,k,floor); }); return true;
}
document.addEventListener("input",e=>{ if(e.target.matches("input[type=text],input[type=number],textarea")) onField(e); });
document.addEventListener("change",e=>{ if(e.target.id==="logoFile"){ handleLogo(e.target.files[0]); return; } if(e.target.id==="cfgImportFile"){ importCfg(e.target.files[0]); return; } if(e.target.matches("input,select,textarea")) onField(e); });
document.addEventListener("click",e=>{
  const tab=e.target.closest("[data-tab]"); if(tab){ setTab(tab.dataset.tab); return; }
  const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act, v=b.dataset.v;
  switch(a){
    case "toggle": ui.open[b.dataset.id]=!ui.open[b.dataset.id]; $("sec-"+b.dataset.id).classList.toggle("open",!!ui.open[b.dataset.id]); b.setAttribute("aria-expanded",!!ui.open[b.dataset.id]); break;
    case "setOW": S.oneWorld=(v==="true"); renderLeft(); break;
    case "setMulti": S.multi=(v==="true"); if(S.multi&&S.instances.length<2) S.instances.push(newInst("")); renderLeft(); break;
    case "addInst": S.instances.push(newInst("")); renderLeft(); break;
    case "delInst": S.instances=S.instances.filter(i=>i.id!==v); renderLeft(); break;
    case "pickPkg": S.pkg=v; renderLeft(); break;
    case "setEv": { const it=S.instances.find(i=>i.id===b.dataset.i); if(it){ it.everify=v; renderLeft(); } break; }
    case "pickConn": S.connKey=v; S.connDecision=v?"include":"tbd"; renderLeft(); break;
    case "setHcm": S.connDecision=v; renderLeft(); break;
    case "toggleMod": S.modules[v]=!S.modules[v]; renderLeft(); break;
    case "toggleFuture": S.future.items[v]=!S.future.items[v]; renderLeft(); break;
    case "pickSupport": S.support=v; renderLeft(); break;
    case "addRow": S.rows.push(rowTpl({})); ui.open.custom=true; renderLeft(); { const rs=document.querySelectorAll(".crow"); const last=rs[rs.length-1]; if(last){ last.scrollIntoView({block:"center"}); const i=last.querySelector("input"); if(i) i.focus(); } } break;
    case "addHcmRow": S.rows.push(rowTpl({ name:"Custom HCM Integration", desc:"Describe the deviation from the standard connect (fields, triggers, approvals, subsidiaries, mappings, payroll provider).", status:"estimate" })); ui.open.custom=true; renderLeft(); toast("Added to Deal-Specific Scope — needs estimate"); $("sec-custom").scrollIntoView({block:"start"}); break;
    case "addCountryRow": { const n=($("newCountry")||{}).value||""; S.rows.push(rowTpl({ name:"Pre-Hire country build — "+(n.trim()||"new country"), desc:"Build the pre-hire configuration and field mappings for a country that is not yet built (built: US, Canada, UK).", status:"estimate", notes:"Mappings differ by country; needs estimate." })); ui.open.custom=true; renderLeft(); toast("Country build added — needs estimate"); break; }
    case "delRow": S.rows=S.rows.filter(r=>r.id!==v); renderLeft(); break;
    case "pickLogo": $("logoFile").click(); break;
    case "rmLogo": S.logo=""; renderLeft(); break;
    case "requestExec": openOverride(b.dataset.scope,null); break;
    case "exConfirm": exConfirm(); break;
    case "exCancel": exCancel(); break;
    case "closeModal": closeModal(); break;
    case "setView": setView(v); break;
    case "cfgToggle": cfgOpen[b.dataset.id]=!cfgOpen[b.dataset.id]; b.closest(".card").classList.toggle("open",!!cfgOpen[b.dataset.id]); break;
    case "cfgAddPartner": P.partners.push({id:nid("pt"),name:"",channel:"reseller",pct:null,base:"recurring",fixed:null,note:""}); saveCfg(); renderConfig(); break;
    case "cfgDelPartner": P.partners.splice(+v,1); saveCfg(); renderConfig(); break;
    case "cfgAddTier": P.multi.tiers.push({min:(P.multi.tiers.length?P.multi.tiers[P.multi.tiers.length-1].min+5:2),platformDiscPct:null,implDiscPct:null}); saveCfg(); renderConfig(); break;
    case "cfgDelTier": P.multi.tiers.splice(+v,1); saveCfg(); renderConfig(); break;
    case "cfgExport": exportCfg(); break;
    case "cfgImportPick": $("cfgImportFile").click(); break;
    case "cfgReset": if(confirm("Reset the whole matrix to the built-in defaults? Your edited values will be lost.")){ resetCfg(); renderConfig(); toast("Matrix reset to defaults"); } break;
    case "save": saveDraft(); break;
    case "validate": validateDeal(); break;
    case "previewProposal": setTab("proposal"); break;
    case "genHandoff": setTab("handoff"); toast("Implementation handoff generated"); break;
    case "genContract": setTab("contract"); toast("Contract scope generated"); break;
    case "reset": if(confirm("Reset to the demo deal? Unsaved changes and the saved draft will be cleared.")){ try{localStorage.removeItem(LS_KEY);}catch(x){} S=demoState(); renderLeft(); setTab("summary"); toast("Reset to demo deal"); } break;
    case "loadDemo": S=demoState(); renderLeft(); toast("Demo deal loaded"); break;
    case "blank": S=baseState(); renderLeft(); toast("New blank deal"); break;
    case "print": printTab(v); break;
  }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&$("modalBg").classList.contains("on")){ if(pendingOverride) exCancel(); else closeModal(); } });
function setTab(t){ ui.tab=t; document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t)); document.querySelectorAll(".tab-pane").forEach(p=>p.classList.toggle("on",p.id==="pane-"+t)); const body=document.querySelector(".out-body"); if(body) body.scrollTop=0; if(window.innerWidth<=1150) $("pane-"+t).scrollIntoView({block:"start"}); }
function printTab(name){
  const c=calc(S);
  if(name==="pricelist"&&!S.priceList.approved&&!confirm("This price list is not marked as approved, so it will print with a DRAFT banner. Print anyway?")) return;
  if(name==="proposal"&&c.status!=="g"){ const msg=c.status==="r"?"This deal is BLOCKED by policy. The printout will be watermarked as a DRAFT. Print anyway?":"This deal still has items requiring review. Print the client proposal anyway?"; if(!confirm(msg)) return; }
  setTab(name); setTimeout(()=>window.print(),80);
}
function handleLogo(file){
  if(!file) return; const rd=new FileReader();
  rd.onload=()=>{ if(file.type==="image/svg+xml"){ S.logo=rd.result; renderLeft(); return; }
    const img=new Image(); img.onload=()=>{ const max=480, sc=Math.min(1,max/Math.max(img.width,img.height)); const cv=document.createElement("canvas"); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); S.logo=cv.toDataURL("image/png"); renderLeft(); toast("Logo added"); };
    img.onerror=()=>toast("That file could not be read as an image."); img.src=rd.result; };
  rd.readAsDataURL(file);
}
function saveDraft(){ try{ localStorage.setItem(LS_KEY,JSON.stringify({S,uid})); toast("Draft saved in this browser"); }catch(e){ toast("Could not save draft (browser storage unavailable or full)"); } }
function loadDraft(){ try{ const d=JSON.parse(localStorage.getItem(LS_KEY)||"null"); if(d&&d.S){ const b=baseState(); S=Object.assign(b,d.S); S.ov=Object.assign(b.ov,d.S.ov||{}); S.partner=Object.assign(baseState().partner,d.S.partner||{}); delete S.cost; S.priceList=Object.assign(baseState().priceList,d.S.priceList||{}); uid=Math.max(uid,d.uid||1); if(!S.instances||!S.instances.length) S.instances=[newInst("Primary ATS")]; return true; } }catch(e){} return false; }

const cfgLoaded=loadCfg(); const restored=loadDraft(); renderLeft(); if(restored) toast("Saved draft restored"); else if(cfgLoaded) toast("Saved matrix values loaded");
</script>
