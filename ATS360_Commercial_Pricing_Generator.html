<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetDynamic ATS360 Commercial Pricing Generator</title>
<style>
:root{
  --navy:#0b2a4a; --navy2:#123a63; --blue:#1f6fb2; --teal:#0f8b8d;
  --lb:#e9f2fb; --lb2:#f4f8fc; --line:#d9e1ea; --ink:#18263a; --muted:#5d6b7e;
  --green:#1e8e5a; --greenbg:#e6f5ec; --amber:#a86b00; --amberbg:#fff3d6; --red:#c0392b; --redbg:#fdeaea;
  --r:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Inter,system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:#f3f6fa;font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* top bar */
.topbar{background:var(--navy);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:30}
.topbar h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.1px}
.topbar .tag{font-size:12px;color:#a9c4de}
.topbar .sp{flex:1}
.tbtn{background:transparent;border:1px solid #4f7096;color:#dbe8f5;border-radius:7px;padding:6px 11px;font-size:12.5px}
.tbtn:hover{background:#17406b}
.brandmark{display:flex;align-items:center;gap:10px}
.brandmark .nd{background:#fff;border-radius:6px;padding:4px 8px;display:flex;align-items:center}
.brandmark img{height:24px;display:block}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 590px;gap:20px;padding:20px 24px 60px;max-width:1700px;margin:0 auto}
.left{min-width:0}
.right{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 78px);display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media(max-width:1150px){.layout{grid-template-columns:1fr}.right{position:static;max-height:none}}

/* cards */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.card>.hd{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--lb);border:0;border-bottom:1px solid transparent;padding:12px 16px;color:var(--navy)}
.card.open>.hd{border-bottom-color:var(--line)}
.card>.hd .t{font-weight:650;font-size:15px}
.card>.hd .s{font-size:12.5px;color:var(--muted);margin-left:2px}
.card>.hd .sp{flex:1}
.card>.hd .chev{transition:transform .15s;color:var(--blue)}
.card.open>.hd .chev{transform:rotate(90deg)}
.card>.bd{display:none;padding:16px}
.card.open>.bd{display:block}
.grid{display:grid;gap:12px 16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:700px){.g2,.g3{grid-template-columns:1fr}}
label.f{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
label.f>span.l{display:block;margin-bottom:4px}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid #c5d0dd;border-radius:7px;padding:8px 10px;background:#fff}
textarea{resize:vertical;min-height:54px}
input:disabled,select:disabled{background:#f1f4f8;color:#8793a3}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.sub{font-size:12px;font-weight:700;color:var(--navy);margin:16px 0 8px;letter-spacing:.2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--lb2);border:1px solid #cfe0f1;color:var(--navy2);border-radius:20px;padding:3px 10px;font-size:12px}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:650}
.pill.g{background:var(--greenbg);color:var(--green)}
.pill.a{background:var(--amberbg);color:var(--amber)}
.pill.r{background:var(--redbg);color:var(--red)}
.pill.b{background:var(--lb);color:var(--blue)}
.pill.n{background:#eef1f5;color:var(--muted)}
.note{border-radius:8px;padding:9px 12px;font-size:12.5px;margin-top:10px}
.note.a{background:var(--amberbg);color:#6f4600;border:1px solid #f0d58f}
.note.r{background:var(--redbg);color:#8a2217;border:1px solid #f1b8b1}
.note.g{background:var(--greenbg);color:#14653f;border:1px solid #b9e0c9}
.note.b{background:var(--lb2);color:var(--navy2);border:1px solid #cfe0f1}

/* choice cards */
.choices{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.choice{border:1.5px solid var(--line);border-radius:var(--r);padding:14px;background:#fff;text-align:left;position:relative}
.choice:hover{border-color:#9bbbdb}
.choice.sel{border-color:var(--blue);background:var(--lb2);box-shadow:inset 0 0 0 1px var(--blue)}
.choice.dis{opacity:.55;cursor:not-allowed}
.choice h4{margin:0 0 4px;font-size:14.5px;color:var(--navy)}
.choice .price{font-weight:700;font-size:16px;color:var(--navy);margin:6px 0}
.choice ul{margin:6px 0 0;padding-left:18px;color:#334559;font-size:12.5px}
.choice .tick{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;border:1.5px solid #b3c2d3;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.choice.sel .tick{background:var(--blue);border-color:var(--blue)}
.seg{display:inline-flex;border:1px solid #c5d0dd;border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;font-size:12.5px;border-right:1px solid #c5d0dd}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}
.seg button:disabled{opacity:.5;cursor:not-allowed}

/* custom rows */
.crow{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;background:#fff}
.crow .top{display:grid;grid-template-columns:minmax(150px,2fr) minmax(130px,1.1fr) 84px minmax(110px,1fr) auto minmax(100px,.9fr);gap:10px;align-items:end}
@media(max-width:900px){.crow .top{grid-template-columns:1fr 1fr}}
.crow .calc{font-weight:700;color:var(--navy);text-align:right;min-height:34px;display:flex;align-items:center;justify-content:flex-end}
.crow .calc.pend{color:var(--amber);font-weight:650}
.crow details{margin-top:8px}
.crow summary{cursor:pointer;color:var(--blue);font-size:12.5px;font-weight:600}
.crow .more{margin-top:10px}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);font-weight:600;white-space:nowrap}
.chk input{width:16px;height:16px}
.linkbtn{background:none;border:0;color:var(--blue);padding:0;font-size:12.5px;font-weight:600;text-decoration:underline}
.linkbtn.red{color:var(--red)}
.btn{border:1px solid #b9c7d7;background:#fff;color:var(--navy);border-radius:8px;padding:8px 14px;font-weight:600}
.btn:hover{background:var(--lb2)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy2)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.danger{border-color:#e3a9a2;color:var(--red)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.actionbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.policy-line{margin:6px 0 20px;text-align:center;color:var(--navy2);font-weight:600;font-size:13px}
.dropzone{display:flex;align-items:center;gap:12px}
.logo-prev{width:120px;height:56px;border:1px dashed #b3c2d3;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11.5px;background:#fafcfe;overflow:hidden}
.logo-prev img{max-width:100%;max-height:100%;object-fit:contain}
.future{opacity:.9;background:repeating-linear-gradient(135deg,#fafbfd,#fafbfd 10px,#f4f6f9 10px,#f4f6f9 20px)}

/* right panel */
.out-head{background:var(--navy);color:#fff;padding:10px 12px 0}
.out-top{display:flex;align-items:center;gap:10px;padding:2px 4px 10px}
.out-top .nm{font-weight:650;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{padding:4px 11px;border-radius:20px;font-size:12px;font-weight:750;letter-spacing:.2px}
.status.g{background:#d6f0e1;color:#0f6a3f}
.status.a{background:#ffe9b3;color:#7a4a00}
.status.r{background:#ffd3cd;color:#8f2116}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{background:transparent;border:0;color:#a9c4de;padding:8px 10px;font-size:12.5px;font-weight:600;border-radius:7px 7px 0 0;white-space:nowrap}
.tabs button.on{background:#fff;color:var(--navy)}
.out-body{overflow:auto;padding:16px;flex:1}
.tab-pane{display:none}
.tab-pane.on{display:block}
.sumblock{border:1px solid var(--line);border-radius:9px;margin-bottom:12px;overflow:hidden}
.sumblock h5{margin:0;padding:7px 12px;background:var(--lb);color:var(--navy);font-size:12.5px;font-weight:700}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 12px;border-top:1px solid #edf1f6;font-size:13px}
.kv:first-of-type{border-top:0}
.kv .k{color:#4a596c}
.kv .v{font-weight:650;text-align:right}
.kv.big .v{font-size:15px;color:var(--navy)}
.kv .v.pend{color:var(--amber)}
.kv .v.neg{color:var(--red)}
.flag{display:flex;gap:8px;padding:7px 10px;border-radius:7px;margin-bottom:6px;font-size:12.5px;align-items:flex-start}
.flag.r{background:var(--redbg);color:#8a2217}
.flag.a{background:var(--amberbg);color:#6f4600}
.flag.i{background:var(--lb2);color:var(--navy2)}
.flag .fx{margin-left:auto;white-space:nowrap}
.hero{background:var(--lb2);border:1px solid #cfe0f1;border-radius:9px;padding:12px 14px;margin-bottom:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero div small{display:block;color:var(--muted);font-size:11.5px}
.hero div b{font-size:17px;color:var(--navy)}
.invest{background:#f4ecff;border:1px solid #d9c6f5;color:#4b2a7a;border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:12.5px}

/* documents */
.doc{background:#fff;color:#111c2b;font-size:12.5px}
.doc .dh{display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:3px solid var(--navy);padding-bottom:12px;margin-bottom:14px}
.doc .dh .lg{display:flex;align-items:center;gap:14px}
.doc .dh img.nd{max-height:44px;max-width:190px;display:block}
.doc .dh img.client{max-height:56px;max-width:180px;object-fit:contain;display:block}
.logo-ph{display:none;align-items:center;justify-content:center;height:40px;padding:0 12px;border:1.5px solid var(--navy);color:var(--navy);font-weight:700;border-radius:4px;font-size:13px}
.ats-badge{display:inline-flex;align-items:center;height:36px;padding:0 12px;background:var(--teal);color:#fff;font-weight:750;border-radius:4px;letter-spacing:.4px;font-size:13px}
.doc h2{margin:0;font-size:22px;color:var(--navy)}
.doc h3{margin:18px 0 6px;font-size:14px;color:#fff;background:var(--navy);padding:5px 10px;border-radius:4px}
.doc h4{margin:14px 0 4px;font-size:13px;color:var(--navy)}
.doc .meta{color:var(--muted);font-size:12px;margin-top:2px}
.doc table{width:100%;border-collapse:collapse;margin-bottom:4px}
.doc th{background:var(--lb);color:var(--navy);text-align:left;padding:6px 8px;font-size:11.5px;border:1px solid #cfdbe8}
.doc td{padding:6px 8px;border:1px solid #dbe4ee;vertical-align:top}
.doc td.n,.doc th.n{text-align:right;white-space:nowrap}
.doc tr.tot td{font-weight:700;background:#f3f7fb}
.doc .pendtxt{color:#a86b00;font-weight:650}
.doc .small{font-size:11.5px;color:#46556a}
.doc ul{margin:6px 0 6px 18px;padding:0}
.doc .draftbar{background:var(--redbg);border:1px solid #e9aaa3;color:#8a2217;font-weight:700;padding:8px 12px;border-radius:5px;margin-bottom:12px}
.doc .intbar{background:var(--amberbg);border:1px solid #f0d58f;color:#6f4600;font-weight:700;padding:7px 12px;border-radius:5px;margin-bottom:12px}
.doc p{margin:6px 0}
.doc .clause{margin-bottom:10px}
.doc .clause h4{margin-bottom:2px}

/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,25,45,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal .mh{padding:14px 18px;font-weight:700;font-size:16px;border-bottom:1px solid var(--line)}
.modal .mh.red{background:var(--redbg);color:var(--red);border-radius:12px 12px 0 0}
.modal .mb{padding:16px 18px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;z-index:120;font-size:13px}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* print */
@media print{
  @page{margin:.5in}
  body{background:#fff;font-size:11pt}
  .topbar,.left,.out-head,.no-print,.toast,.modal-bg{display:none!important}
  .layout{display:block;padding:0;max-width:none}
  .right{position:static;max-height:none;border:0;border-radius:0;display:block;overflow:visible}
  .out-body{overflow:visible;padding:0}
  .tab-pane{display:none!important}
  .tab-pane.on{display:block!important}
  .print-hide{display:none!important}
  .doc h3,.doc th,.doc tr.tot td,.doc .ats-badge,.doc .draftbar{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc table,.doc .clause{break-inside:avoid}
  .doc h3{break-after:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brandmark">
    <span class="nd"><img src="https://netdynamicconsulting.com/images/common/logobanner.png" alt="NetDynamic" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'"><b style="display:none;color:#0b2a4a">NetDynamic</b></span>
    <div>
      <h1>ATS360 Commercial Pricing Generator</h1>
      <div class="tag">Internal deal configurator &middot; mockup &middot; policy v0.1 (proposed)</div>
    </div>
  </div>
  <div class="sp"></div>
  <button class="tbtn" data-act="loadDemo">Load Roswell demo</button>
  <button class="tbtn" data-act="blank">New blank deal</button>
</header>

<main class="layout">
  <div class="left" id="left"></div>
  <aside class="right">
    <div class="out-head">
      <div class="out-top">
        <div class="nm" id="outName">Deal</div>
        <span class="status g" id="outStatus">WITHIN POLICY</span>
      </div>
      <div class="tabs" id="tabs">
        <button data-tab="summary" class="on">Commercial Summary</button>
        <button data-tab="proposal">Client Proposal</button>
        <button data-tab="handoff">Implementation Handoff</button>
        <button data-tab="contract">Contract Scope</button>
        <button data-tab="pricelist">Partner Price List</button>
      </div>
    </div>
    <div class="out-body">
      <div class="tab-pane on" id="pane-summary"></div>
      <div class="tab-pane" id="pane-proposal"></div>
      <div class="tab-pane" id="pane-handoff"></div>
      <div class="tab-pane" id="pane-contract"></div>
      <div class="tab-pane" id="pane-pricelist"></div>
    </div>
  </aside>
</main>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   CENTRAL PRICING POLICY  — single source of truth (mock, proposed)
   Mirrors NetDynamic_Commercial_Pricing_Master.xlsx. TBD = do not quote.
   ===================================================================== */
const IMPL_RATES   = { list:250, target:210, strategic:210, floor:185 };   // $/commercial hour
const CUSTOM_RATES = { list:250, target:210, floor:185 };                   // deal-specific custom work

const pricingPolicy = {
  version: "0.1-proposed",
  escalation: 5,                       // % per year, Year 2+
  yearsOptions: [1,2,3,4,5],
  channels: {
    direct:   { label:"Direct",                    swBasis:"target",    implBasis:"target", partner:false,
                note:"Normal direct sale. No partner commission." },
    oracle:   { label:"Oracle / NetSuite Sourced", swBasis:"strategic", implBasis:"target", partner:false,
                note:"Strategic / attach software pricing where approved. Oracle is not assumed commissionable." },
    referral: { label:"Referral Partner",          swBasis:"list",      implBasis:"list",   partner:true,
                note:"e.g. Emerge. Customer pricing defaults to List; commission is acquisition cost, not a second discount." },
    reseller: { label:"Reseller / Prime Contractor", swBasis:"list",    implBasis:"list",   partner:true,
                note:"e.g. DLT. Customer pricing defaults to List; margin structure may differ from referral commission." }
  },
  compensationBases: {
    recurring:"Recurring software only", services:"Software + selected services", fixed:"Fixed amount", other:"Other (% of manual base)"
  },
  products: {
    "ATS-PLATFORM": { family:"ATS360", type:"subscription", name:"ATS360 Platform", billing:"monthly",
                      list:2500, target:2100, strategic:1800, floor:1500,
                      includedUsers:{ ats:5, hiringManagers:10 } },
    "ATS-USER":     { family:"ATS360", type:"subscription", name:"Additional ATS360 Recruiter User", billing:"monthly",
                      list:100, target:75, strategic:60, floor:50 },
    "ATS-HM":       { family:"ATS360", type:"subscription", name:"Additional Hiring Manager User", billing:"monthly",
                      list:20, target:15, strategic:12, floor:10 },
    "ATS-SMS":      { family:"ATS360", type:"module", name:"SMS Messaging — Twilio", billing:"monthly",
                      list:null, target:null, strategic:null, floor:null,
                      note:"Third-party usage charges may apply.", regions:["US","CA","OTHER"] },
    "ATS-VIDEO":    { family:"ATS360", type:"module", name:"Asynchronous Video Interviews", billing:"monthly",
                      list:null, target:null, strategic:null, floor:null, note:"Applicant video screening.", regions:["US","CA","OTHER"] },
    "ATS-DOCUSIGN": { family:"ATS360", type:"module", name:"DocuSign Integration", billing:"monthly",
                      list:null, target:null, strategic:null, floor:null,
                      note:"Requires the client's own DocuSign subscription/account.", regions:["US","CA","OTHER"] },
    "ATS-CHECKR":   { family:"ATS360", type:"module", name:"Checkr Background Check", billing:"monthly",
                      list:null, target:null, strategic:null, floor:null,
                      note:"US only. Requires the client's own Checkr account.", regions:["US"] }
  },
  implementationProfiles: {
    "ATS-CORE": { name:"ATS360 Core Deployment", commercialHours:75,
      blurb:"Everything needed to stand up ATS360 recruiting with standard configuration.",
      includes:["ATS360 installation / configuration","Discovery & branding","1 internal + 1 external career portal","Standard email templates","Roles & permissions","Hiring Manager portal & standard workflows","Testing / UAT","Administrator, hiring manager & HR training","Go-live, handoff & project coordination","Post-go-live transition / hypercare allowance"],
      excludes:["Custom workflows","Custom integrations","Extra subsidiaries","Data migration","HCM connection packages"] },
    "ATS-HIRE": { name:"ATS360 Hire-to-Onboard Deployment", commercialHours:150,
      blurb:"Core plus the full offer-to-employee journey.",
      includes:["Everything in Core","Native E-Signature implementation","Offer Journey","Pre-Hire Portal & pre-hire forms","Jurisdictional onboarding / compliance configuration","Employee conversion","E-Verify configuration (eligible U.S. employers, if activated)"],
      excludes:["Non-standard form volumes","Payroll mapping","Direct third-party integrations","Custom onboarding packages"] }
  },
  hcmConnections: {
    "SP-CONNECT":  { name:"Standard SuitePeople Connect", commercialHours:25, appliesTo:"sp", env:"SuitePeople",
      scope:["Standard requisition-to-ATS workflow","Standard field mapping","Standard trigger","UAT","Handoff"] },
    "GOV-CONNECT": { name:"Standard Government HCM Connect", commercialHours:30, appliesTo:"gov", env:"Government HCM / NS4G",
      scope:["Position / Requisition to ATS workflow","Standard Government HCM mapping","Position data","Requisition data","UAT","Handoff"] }
  },
  hcmProfiles: { none:"None / Standard NetSuite", sp:"SuitePeople", gov:"Government HCM / NS4G", other:"Other / Custom", tbd:"TBD / To Confirm" },
  customCustomTriggers:["Custom fields","Alternate triggers","Multiple approval paths","Additional subsidiaries","Additional mappings","Unusual position structures","Custom classification logic","Additional automation","Custom payroll requirements"],
  support: {
    standard: { name:"Standard Support", price:0, status:"included",
      items:["Product defect triage","Support email / ticket channel","Release notices / newsletters","Baseline support","Post-go-live health checks per approved policy","Defect remediation"] },
    enhanced: { name:"Enhanced Support", price:null, status:"tbd",
      items:["Ongoing named contact","Scheduled support touchpoints","Faster support response","Prepaid consulting hours"] },
    premium:  { name:"Premium Support", price:null, status:"tbd",
      items:["Higher-touch relationship","Named contact + backup","Additional check-ins","Enhanced response targets","Workshops / consulting allowance"] }
  },
  customWorkStatuses: {
    confirmed:"Confirmed", estimate:"Needs Estimate", discovery:"Discovery Required", quantity:"Quantity Needed",
    feasibility:"Feasibility Review", future:"Future Phase", recommended:"Recommended", notdiscussed:"Not Discussed", excluded:"Excluded"
  },
  // Future product families — structure only; pricing TBD, disabled by default.
  families: {
    EMPLOYEE_HUB: { name:"Employee Hub", status:"future",
      products:{

/* =====================================================================
   CALCULATION ENGINE
   ===================================================================== */
function connectorKey(s){
  if(s.hcm==="sp") return "SP-CONNECT";
  if(s.hcm==="gov") return "GOV-CONNECT";
  return s.hcmOverrideKey || "";
}
function execValid(s,scope){ const e=s.exec[scope]; return !!(e && e.yes && e.approver && e.approver.trim() && e.reason); }

function calc(s){
  const ch = P.channels[s.channel];
  const F = []; const flag=(lvl,msg,fix)=>F.push({lvl,msg,fix});
  const swBasis   = s.ov.swBasis==="auto"   ? ch.swBasis   : s.ov.swBasis;
  const implBasis = s.ov.implBasis==="auto" ? ch.implBasis : s.ov.implBasis;
  const esc_ = (s.ov.escalation==null?P.escalation:s.ov.escalation)/100;
  const unit = (p,b)=> p[b==="custom"?"target":b];

  /* ---- subscription ---- */
  const plat = P.products["ATS-PLATFORM"], pu=P.products["ATS-USER"], ph=P.products["ATS-HM"];
  const platFinal = swBasis==="custom" ? (s.ov.platformMonthly!=null ? s.ov.platformMonthly : plat.target) : plat[swBasis];
  const sw = [];
  sw.push({ key:"ATS-PLATFORM", name:"ATS360 Platform", qty:1, unitList:plat.list, unitFinal:platFinal, note:"Includes "+plat.includedUsers.ats+" Recruiter Users and "+plat.includedUsers.hiringManagers+" Hiring Manager Users" });
  const rec = (s.recruiters===null||s.recruiters===""||isNaN(s.recruiters)) ? null : Math.max(0,Math.floor(s.recruiters));
  const hmN = (s.hms===null||s.hms===""||isNaN(s.hms)) ? null : Math.max(0,Math.floor(s.hms));
  if(rec===null) flag("a","Missing ATS360 Recruiter user count.");
  if(hmN===null) flag("a","Missing Hiring Manager user count.");
  const extraR = Math.max(0,(rec||0)-plat.includedUsers.ats), extraH = Math.max(0,(hmN||0)-plat.includedUsers.hiringManagers);
  const recQ = rec==null?plat.includedUsers.ats:rec, hmQ = hmN==null?plat.includedUsers.hiringManagers:hmN;
  const inclR = Math.min(recQ,plat.includedUsers.ats), inclH=Math.min(hmQ,plat.includedUsers.hiringManagers);
  sw.push({ key:"ATS-USER-INC", name:"ATS360 Recruiter Users", qty:inclR, included:true, unitList:0, unitFinal:0, note:"Included in platform" });
  if(extraR>0) sw.push({ key:"ATS-USER", name:"Additional ATS360 Recruiter Users", qty:extraR, unitList:pu.list, unitFinal:unit(pu,swBasis), note:"Users above "+plat.includedUsers.ats });
  sw.push({ key:"ATS-HM-INC", name:"Hiring Manager Users", qty:inclH, included:true, unitList:0, unitFinal:0, note:"Included in platform" });
  if(extraH>0) sw.push({ key:"ATS-HM", name:"Additional Hiring Manager Users", qty:extraH, unitList:ph.list, unitFinal:unit(ph,swBasis), note:"Users above "+plat.includedUsers.hiringManagers });
  const pendingModules=[];
  Object.keys(s.modules).filter(k=>s.modules[k]).forEach(k=>{
    const p=P.products[k]; if(!p) return;
    if(p.regions && !p.regions.includes(s.region)){ flag("r",p.name+" is not available in the selected region."); return; }
    const u = p[swBasis==="custom"?"target":swBasis];
    if(u==null){ pendingModules.push({key:k,name:p.name,note:p.note}); flag("a",p.name+": pricing approval required (TBD — not quoted)."); }
    else sw.push({ key:k, name:p.name, qty:1, unitList:p.list, unitFinal:u, note:p.note||"" });
  });
  sw.forEach(l=>{ l.lineList=l.unitList*l.qty; l.lineFinal=l.unitFinal*l.qty; });
  const monthlyList = sw.reduce((a,l)=>a+l.lineList,0), monthlyFinal=sw.reduce((a,l)=>a+l.lineFinal,0);
  const arr = monthlyFinal*12, arrList=monthlyList*12;

  /* ---- cost-derived floor ---- */
  const costRec = (+s.cost.aws||0)+(+s.cost.sdn||0)+(+s.cost.third||0)+(+s.cost.support||0)+(+s.cost.other||0);
  const gm = Math.min(0.95,Math.max(0,(+s.cost.margin||0)/100));
  const costFloorARR = costRec>0 ? costRec/(1-gm) : 0;
  const policyFloorARR = 12*(plat.floor + extraR*pu.floor + extraH*ph.floor);
  const effFloorARR = Math.max(policyFloorARR,costFloorARR);

  /* ---- implementation ---- */
  const impl=[]; const addImpl=(key,def,kind)=>{
    const h=def.commercialHours;
    impl.push({ key, name:def.name, kind, hours:h, list:h*IMPL_RATES.list, raw:h*(implBasis==="custom"?IMPL_RATES.target:IMPL_RATES[implBasis]), floor:h*IMPL_RATES.floor });
  };
  if(s.impl && P.implementationProfiles[s.impl]) addImpl(s.impl,P.implementationProfiles[s.impl],"profile");
  else flag("a","Implementation profile not selected.");
  const ck = connectorKey(s), cdef = ck?P.hcmConnections[ck]:null;
  const connectorIncluded = !!(cdef && s.hcmDecision==="include");
  if(cdef){
    if(s.hcmDecision==="tbd") flag("a","HCM connection undecided ("+cdef.name+").");
    if(connectorIncluded){
      if(!s.impl){ flag("r","Required dependency missing: "+cdef.name+" requires an ATS360 deployment profile."); }
      addImpl(ck,cdef,"connect");
    }
  } else if(s.hcm==="tbd"){ flag("a","NetSuite HCM profile still to be confirmed — connection scope unknown."); }
  else if(s.hcm==="other"){ flag("a","HCM profile is Other / Custom — no standard connector exists; scope under Deal-Specific Scope."); }
  const rawTotal = impl.reduce((a,l)=>a+l.raw,0);
  const customImpl = implBasis==="custom";
  const customTotal = customImpl ? (s.ov.implTotal!=null ? s.ov.implTotal : rawTotal) : null;
  impl.forEach(l=>{ l.final = customImpl ? (rawTotal>0? l.raw*customTotal/rawTotal : 0) : l.raw; });
  const implList=impl.reduce((a,l)=>a+l.list,0), implFinal=impl.reduce((a,l)=>a+l.final,0), implFloor=impl.reduce((a,l)=>a+l.floor,0), implHours=impl.reduce((a,l)=>a+l.hours,0);

  /* ---- custom work ---- */
  const autoRate = implBasis==="list"?CUSTOM_RATES.list : implBasis==="floor"?CUSTOM_RATES.floor : CUSTOM_RATES.target;
  const rows = s.rows.map(r=>{
    const hours = +r.hours>0 ? +r.hours : 0;
    const rate = r.rate==="auto"?autoRate : r.rate==="list"?CUSTOM_RATES.list : r.rate==="target"?CUSTOM_RATES.target : (r.customRate!=null?+r.customRate:CUSTOM_RATES.target);
    const pending = hours<=0;
    const out = { ...r, hoursN:hours, rateN:rate, pending, price: pending?null:r2(hours*rate), list: pending?null:hours*CUSTOM_RATES.list, floor: pending?null:hours*CUSTOM_RATES.floor, warn:"", warnLvl:"", included:false };
    if(r.include){
      if(r.status==="excluded"){ out.warn="Excluded rows cannot be quoted."; out.warnLvl="r"; }
      else if(pending){ out.warn="Cannot include in quote until commercial effort is approved."; out.warnLvl="a"; flag("r","Custom scope \""+(r.name||"Untitled")+"\" included without approved effort."); }
      else{
        out.included=true;
        if(!["confirmed","recommended","future"].includes(r.status)){ out.warn="Status is “"+P.customWorkStatuses[r.status]+"” — confirm scope before sending."; out.warnLvl="a"; flag("a","Custom scope \""+(r.name||"Untitled")+"\" is quoted but status is "+P.customWorkStatuses[r.status]+"."); }
        if(r.status==="future"){ out.warn="Future Phase item manually activated for this quote."; out.warnLvl="a"; }
      }
    }
    return out;
  });
  const incRows = rows.filter(r=>r.included);
  const customFinal = incRows.reduce((a,r)=>a+r.price,0), customFloor=incRows.reduce((a,r)=>a+r.floor,0), customList=incRows.reduce((a,r)=>a+r.list,0), customHours=incRows.reduce((a,r)=>a+r.hoursN,0);
  const pendingRows = rows.filter(r=>!r.included && r.status!=="excluded");
  if(pendingRows.length) flag("i",pendingRows.length+" deal-specific item(s) pending / not quoted — excluded from totals.");

  /* ---- support ---- */
  const sup = P.support[s.support];
  const supportAnnual = sup.price==null?0:sup.price;
  if(sup.price==null) flag("a",sup.name+": pricing not yet approved (support pricing pending).");

  /* ---- dependencies / future ---- */
  const fut = s.future.enabled ? Object.keys(s.future.items).filter(k=>s.future.items[k]) : [];
  const EH = P.families.EMPLOYEE_HUB.products;
  fut.forEach(k=>{
    flag("a",EH[k].name+": pricing TBD (future product, not quotable).");
    (EH[k].requires||[]).forEach(req=>{
      if(!fut.includes(req)) flag("r","Dependency: "+EH[k].name+" requires "+EH[req].name+".");
    });
  });
  if(fut.includes("EH-PERF") && !fut.includes("EH-PLATFORM")) flag("r","Performance Management cannot be sold without Employee Hub.");

  /* ---- E-Verify / capability logic ---- */
  let everify="none";
  if(s.impl==="ATS-HIRE") everify = s.region==="US" ? s.everify : "na";
  if(everify==="tbd") flag("i","E-Verify activation decision pending — confirm before kickoff.");
  if(s.modules["ATS-DOCUSIGN"] && s.impl==="ATS-HIRE") flag("i","DocuSign selected alongside native E-Signature — confirm the client actually needs both.");
  const modsSelected = Object.keys(s.modules).filter(k=>s.modules[k]);
  if(modsSelected.length) flag("a","Optional module activation effort is not priced in any package — add it under Deal-Specific Scope or confirm it is out of scope.");

  /* ---- 3-year (N-year) projection & partner economics ---- */
  const pct = ch.partner ? ((+s.partner.pct||0)/100) : 0;
  if(ch.partner){
    if(!s.partner.name.trim()) flag("a","Partner name missing.");
    if(s.partner.base==="fixed" ? !(+s.partner.fixed>0) : !(pct>0)) flag("a","Partner commission missing.");
  }
  const years=[]; let compY1=0;
  const implCust = implFinal+customFinal;
  for(let y=1;y<=s.term;y++){
    const g=Math.pow(1+esc_,y-1);
    const subY = r2(arr*g), supY=r2(supportAnnual*g);
    const one = y===1 ? implFinal+customFinal : 0;
    let comp=0;
    if(ch.partner){
      const b=s.partner.base;
      if(b==="recurring"||b==="services") comp += pct*subY;
      if(b==="services" && y===1) comp += pct*((s.partner.svcImpl?implFinal:0)+(s.partner.svcCustom?customFinal:0));
      if(b==="fixed" && y===1) comp += (+s.partner.fixed||0);
      if(b==="other" && y===1) comp += pct*(+s.partner.otherBase||0);
    }
    comp=r2(comp);
    years.push({ y, sub:subY, support:supY, impl: y===1?implFinal:0, custom: y===1?customFinal:0, total:r2(subY+supY+one), comp, retained:r2(subY+supY+one-comp) });
    if(y===1) compY1=comp;
  }
  const y1 = years[0];
  const recurringCompY1 = ch.partner && (s.partner.base==="recurring"||s.partner.base==="services") ? pct*arr : 0;
  const retainedARR = arr - recurringCompY1;
  const svcComp = ch.partner ? (s.partner.base==="services" ? pct*((s.partner.svcImpl?implFinal:0)+(s.partner.svcCustom?customFinal:0)) : (s.partner.base==="fixed"?(+s.partner.fixed||0): s.partner.base==="other"?pct*(+s.partner.otherBase||0):0)) : 0;
  const retainedImpl = implFinal - (ch.partner && s.partner.base==="services" && s.partner.svcImpl ? pct*implFinal : 0);

  /* ---- floor tests + executive overrides ---- */
  const floors = [
    { scope:"software", label:"Recurring software (ARR retained after partner compensation)", requested:retainedARR, floor:effFloorARR, active:true, unit:"/yr" },
    { scope:"impl", label:"Implementation packages", requested:retainedImpl, floor:implFloor, active:impl.length>0 },
    { scope:"custom", label:"Included custom work", requested:customFinal, floor:customFloor, active:incRows.length>0 }
  ];
  let strategic=0;
  floors.forEach(f=>{
    f.below = f.active && f.requested < f.floor-0.005;
    f.diff = f.below ? r2(f.floor-f.requested) : 0;
    f.exec = f.below && execValid(s,f.scope);
    if(f.below){
      if(f.exec){ strategic+=f.diff; flag("a","Executive override on "+f.label+" — strategic investment "+fmt(f.diff)+" (approver: "+s.exec[f.scope].approver+")."); }
      else flag("r", (f.scope==="software"&&ch.partner&&recurringCompY1>0?"Partner economics below floor — ":"Below commercial floor — ")+f.label+": "+fmt(f.requested)+" vs floor "+fmt(f.floor)+".", {scope:f.scope});
    }
  });

  /* ---- status ---- */
  const status = F.some(x=>x.lvl==="r") ? "r" : F.some(x=>x.lvl==="a") ? "a" : "g";
  F.sort((a,b)=>({r:0,a:1,i:2}[a.lvl]-{r:0,a:1,i:2}[b.lvl]));

  return { ch, swBasis, implBasis, esc:esc_, sw, monthlyList, monthlyFinal, arr, arrList, pendingModules,
    rec:recQ, hm:hmQ, extraR, extraH, costRec, costFloorARR, policyFloorARR, effFloorARR,
    impl, implList, implFinal, implFloor, implHours, connectorIncluded, cdef, ck,
    rows, incRows, customFinal, customFloor, customList, customHours, pendingRows, autoRate,
    sup, supportAnnual, fut, everify, years, y1, compY1, retainedARR, recurringCompY1, svcComp,
    floors, strategic, flags:F, status };
}

      <div><div class="hint" style="margin-top:22px">Software basis: <b>${BASIS_LABEL[c.swBasis]}</b> &middot; Implementation basis: <b>${BASIS_LABEL[c.implBasis]}</b></div></div>
    </div>
    <div class="hint" style="margin-top:6px">${esc(ch.note)}</div>${partnerCard}`);

  /* 3 Platform */
  h += sec("platform","3. ATS360 Platform","Selected automatically",`
    <div class="grid g3" style="margin-bottom:12px">
      <div><span class="pill g">Selected</span><div style="margin-top:6px;font-weight:650">ATS360 Platform</div><div class="hint">Includes ${P.products["ATS-PLATFORM"].includedUsers.ats} Recruiter + ${P.products["ATS-PLATFORM"].includedUsers.hiringManagers} Hiring Manager users</div></div>
      <label class="f"><span class="l">ATS360 Recruiter Users</span><input type="number" min="0" step="1" data-t="num" data-k="recruiters" value="${S.recruiters==null?"":S.recruiters}"><div class="hint">${c.extraR>0?`${c.extraR} additional × ${fmt(c.sw.find(l=>l.key==="ATS-USER").unitFinal)}/mo`:"Within included allowance — $0 additional"}</div></label>
      <label class="f"><span class="l">Hiring Manager Users</span><input type="number" min="0" step="1" data-t="num" data-k="hms" value="${S.hms==null?"":S.hms}"><div class="hint">${c.extraH>0?`${c.extraH} additional × ${fmt(c.sw.find(l=>l.key==="ATS-HM").unitFinal)}/mo`:"Within included allowance — $0 additional"}</div></label>
    </div>
    <div class="sub">Included capabilities</div>
    <div class="chips">${P.atsIncluded.map(x=>`<span class="chip">${x}</span>`).join("")}</div>
    <div class="note b">E-Signature, Pre-Hire and E-Verify are capabilities of ATS360, not separate products. Whether they are <b>configured</b> is decided by the implementation profile (step 4).</div>`,
    `<span class="pill n">${fmt(c.sw[0].unitFinal)}/mo</span>`);

  /* 4 Implementation */
  const iCards = Object.entries(P.implementationProfiles).map(([k,d])=>{
    const t = d.commercialHours*IMPL_RATES[c.implBasis==="custom"?"target":c.implBasis];
    return `<button class="choice ${S.impl===k?"sel":""}" data-act="pickImpl" data-v="${k}"><span class="tick">${S.impl===k?"&#10003;":""}</span>
      <h4>${d.name}</h4><div class="hint">${d.blurb}</div><div class="price">${fmt(t)} <span class="hint" style="font-weight:400">fixed fee · ${BASIS_LABEL[c.implBasis]} basis</span></div>
      <ul>${d.includes.map(i=>`<li>${i}</li>`).join("")}</ul>
      <div class="hint" style="margin-top:8px"><b>Not automatically included:</b> ${d.excludes.join(", ")}</div></button>`;
  }).join("");
  let ev = "";
  if(S.impl==="ATS-HIRE"){
    if(S.region==="US") ev = `<div class="sub">E-Verify (inside Hire-to-Onboard)</div>
      <div class="seg" role="group">${[["activate","Activate"],["no","Do Not Activate"],["tbd","TBD"]].map(([v,l])=>`<button data-act="setEv" data-v="${v}" class="${S.everify===v?"on":""}">${l}</button>`).join("")}</div>
      <div class="hint">Available to eligible U.S. employers. Employer enrollment/account requirements apply.</div>`;
    else ev = `<div class="sub">E-Verify</div><div class="note b"><b>E-Verify: Not Applicable — Jurisdiction.</b> The fixed implementation package is not reduced and there is no separate E-Verify software charge.</div>`;
  }
  h += sec("impl","4. Implementation Profile","Fixed fee / fixed scope",`
    <div class="choices">${iCards}</div>${ev}
    <div class="note a" style="margin-top:12px"><b>Fixed-fee rule.</b> Commercial hours are an <u>internal</u> pricing and capacity parameter — never a bank of consulting hours. If the work finishes in fewer hours: no refund, no future hours, no substituting new scope. If agreed scope expands: Change Order.</div>`,
    S.impl?`<span class="pill n">${fmt(c.implFinal-(c.connectorIncluded?c.impl.find(l=>l.kind==="connect").final:0))}</span>`:`<span class="pill a">Not selected</span>`);

  /* 5 HCM */
  let hcmBody="";
  const ckey=connectorKey(S), cd=ckey?P.hcmConnections[ckey]:null;
  if(S.hcm==="sp"||S.hcm==="gov"){
    const t=cd.commercialHours*IMPL_RATES[c.implBasis==="custom"?"target":c.implBasis];
    hcmBody = `<div class="choice ${S.hcmDecision==="include"?"sel":""}" style="cursor:default">
      <span class="pill g" style="float:right">Recommended based on ${cd.env} environment</span>
      <h4>${cd.name}</h4><div class="price">${fmt(t)} <span class="hint" style="font-weight:400">fixed fee</span></div>
      <ul>${cd.scope.map(i=>`<li>${i}</li>`).join("")}</ul>
      <div class="seg" style="margin-top:12px">${[["include","Include"],["exclude","Exclude"],["tbd","TBD"]].map(([v,l])=>`<button data-act="setHcm" data-v="${v}" class="${S.hcmDecision===v?"on":""}">${l}</button>`).join("")}</div></div>`;
  } else if(S.hcm==="none"){
    hcmBody = `<div class="note b"><b>No HCM Connect</b> — standard NetSuite. Override only if a connector is genuinely needed:</div>
      <label class="f" style="max-width:340px;margin-top:8px"><span class="l">Optional override</span>${sel("hcmOverrideKey",S.hcmOverrideKey,[["","No HCM Connect"],["SP-CONNECT","Standard SuitePeople Connect"],["GOV-CONNECT","Standard Government HCM Connect"]],`data-after="override"`)}</label>
      ${S.hcmOverrideKey?`<div class="seg" style="margin-top:8px">${[["include","Include"],["exclude","Exclude"],["tbd","TBD"]].map(([v,l])=>`<button data-act="setHcm" data-v="${v}" class="${S.hcmDecision===v?"on":""}">${l}</button>`).join("")}</div>`:""}`;
  } else if(S.hcm==="other"){
    hcmBody = `<div class="note a"><b>Other / Custom HCM</b> — no standard connector applies. Anything here is a custom HCM integration and must be scoped and estimated under Deal-Specific Scope.</div><button class="btn sm" style="margin-top:8px" data-act="addHcmRow">Add custom HCM integration row</button>`;
  } else {
    hcmBody = `<div class="note a"><b>HCM profile still to be confirmed.</b> Confirm the NetSuite HCM environment in step 1 before quoting a connection.</div>`;
  }
  hcmBody += `<div class="note b" style="margin-top:12px"><b>Standard Connect vs Custom HCM Integration.</b> A Standard Connect covers only the documented, locked standard workflow. These move to Deal-Specific Custom Work: ${P.customCustomTriggers.join("; ").toLowerCase()}.
    <div style="margin-top:6px"><button class="linkbtn" data-act="addHcmRow">Move a deviation to Deal-Specific Scope</button></div></div>`;
  h += sec("hcm","5. NetSuite HCM Connection",esc(P.hcmProfiles[S.hcm]),hcmBody,
    c.connectorIncluded?`<span class="pill g">${fmt(c.impl.find(l=>l.kind==="connect").final)}</span>`:(cd&&S.hcmDecision==="tbd"?`<span class="pill a">Undecided</span>`:`<span class="pill n">None</span>`));

  /* 6 Modules */
  const modCards = ["ATS-SMS","ATS-VIDEO","ATS-DOCUSIGN","ATS-CHECKR"].map(k=>{
    const p=P.products[k], on=!!S.modules[k], dis = p.regions && !p.regions.includes(S.region);
    return `<button class="choice ${on?"sel":""} ${dis?"dis":""}" data-act="toggleMod" data-v="${k}" ${dis?"disabled":""}>
      <span class="tick">${on?"&#10003;":""}</span><h4>${p.name}</h4>
      <div class="hint">${esc(p.note||"")}</div>
      <div style="margin-top:8px"><span class="pill a">Pricing TBD</span> ${on?`<span class="pill r">Pricing approval required</span>`:""}</div>
      ${dis?`<div class="hint" style="margin-top:6px">Not available in selected region.</div>`:""}</button>`;
  }).join("");
  h += sec("mods","6. Optional Modules & Integrations","Pricing not yet approved",`<div class="choices">${modCards}</div>
    <div class="hint" style="margin-top:10px">A TBD-priced module never appears as $0. It flags the deal for review and is excluded from totals.</div>`,
    `<span class="pill ${Object.values(S.modules).some(Boolean)?"a":"n"}">${Object.values(S.modules).filter(Boolean).length} selected</span>`);

  /* 7 Custom */
  const stOpts = Object.entries(P.customWorkStatuses);
  const rowsHtml = c.rows.length ? c.rows.map(r=>rowHtml(r,stOpts)).join("") : `<div class="note b">No deal-specific scope yet. Add a row for anything that is not covered by the packages above.</div>`;
  h += sec("custom","7. Deal-Specific Scope","Custom work &mdash; unknown scope is never $0",`
    <div class="hint" style="margin-bottom:10px">Rates: List ${fmt(CUSTOM_RATES.list)}/hr · Target ${fmt(CUSTOM_RATES.target)}/hr · Internal floor ${fmt(CUSTOM_RATES.floor)}/hr. Rows with no estimated hours show <b>Pending Scope</b>.</div>
    <div id="rows">${rowsHtml}</div>
    <button class="btn" data-act="addRow">+ Add scope row</button>`,
    `<span class="pill ${c.incRows.length?"g":"n"}">${c.incRows.length} quoted</span> <span class="pill ${c.pendingRows.length?"a":"n"}">${c.pendingRows.length} pending</span>`);

  /* 8 Support */
  const supCards = Object.entries(P.support).map(([k,d])=>`<button class="choice ${S.support===k?"sel":""}" data-act="pickSupport" data-v="${k}"><span class="tick">${S.support===k?"&#10003;":""}</span>
    <h4>${d.name}</h4>
    <div class="price">${d.price===0?"Included":""}${d.price==null?`<span class="pill a">Pricing not yet approved</span>`:""}</div>
    <div class="hint">${d.price===0?"Included in subscription · $0 additional":"Possible future scope"}</div>
    <ul>${d.items.map(i=>`<li>${i}</li>`).join("")}</ul>
    ${k==="standard"?`<div class="hint" style="margin-top:8px"><b>Internal:</b> named-contact window (2 weeks vs 30 days) and quick-fix fair-use threshold are not finalised — don't promise them.</div>`:""}</button>`).join("");
  h += sec("support","8. Post-Go-Live Support","Support is not consulting",`<div class="choices">${supCards}</div>
    <div class="grid g2" style="margin-top:14px">
      <div class="note g"><b>Included support</b><ul style="margin:4px 0 0 16px;padding:0"><li>Defects</li><li>Tickets &amp; basic questions</li><li>Release communications</li><li>Standard product support</li></ul></div>
      <div class="note a"><b>Paid consulting / Change Order</b><ul style="margin:4px 0 0 16px;padding:0"><li>Workflow redesign · new configuration · new forms</li><li>Integrations · new modules</li><li>Training · workshops · custom automation · environment changes</li></ul></div>
    </div>
    <div class="hint" style="margin-top:8px">New configuration requested after go-live becomes a consulting scope or Change Order.</div>`,
    `<span class="pill ${P.support[S.support].price==null?"a":"g"}">${P.support[S.support].name}</span>`);

  /* 9 Pricing basis */
  const impF = c.floors.filter(f=>f.below);
  h += sec("basis","9. Pricing Basis & Commercial Controls","Internal only",`
    <div class="grid g2">
      <div class="kvbox"><small class="hint">Effective Software Pricing Basis</small><div><b>${BASIS_LABEL[c.swBasis]}</b> <span class="hint">${S.ov.swBasis==="auto"?"(from channel)":"(manual override)"}</span></div></div>
      <div class="kvbox"><small class="hint">Effective Implementation Pricing Basis</small><div><b>${BASIS_LABEL[c.implBasis]}</b> <span class="hint">${S.ov.implBasis==="auto"?"(from channel)":"(manual override)"}</span></div></div>
    </div>
    <details style="margin-top:12px" ${S.ov.swBasis!=="auto"||S.ov.implBasis!=="auto"||S.exec.software||S.exec.impl||S.exec.custom?"open":""}>
      <summary class="linkbtn" style="cursor:pointer">Commercial Override</summary>
      <div class="note r" style="margin-top:8px">Overrides below the approved floor require an executive override. Partner-sourced deals should not be discounted to fund commission.</div>
      <div class="grid g2" style="margin-top:10px">
        <label class="f"><span class="l">Software basis override</span>${sel("ov.swBasis",S.ov.swBasis,[["auto","Auto (from channel)"],["list","List"],["target","Target"],["strategic","Strategic"],["floor","Floor"],["custom","Custom"]])}</label>
        <label class="f"><span class="l">Implementation basis override</span>${sel("ov.implBasis",S.ov.implBasis,[["auto","Auto (from channel)"],["list","List"],["target","Target"],["floor","Floor"],["custom","Custom"]])}</label>
        ${S.ov.swBasis==="custom"?`<label class="f"><span class="l">Custom platform price ($/month)</span><input type="number" min="0" step="1" data-t="num" data-k="ov.platformMonthly" data-guard="software" value="${S.ov.platformMonthly==null?"":S.ov.platformMonthly}" placeholder="${P.products["ATS-PLATFORM"].target}"><div class="hint">Floor ${fmt(P.products["ATS-PLATFORM"].floor)}/mo · users priced at Target</div></label>`:""}
        ${S.ov.implBasis==="custom"?`<label class="f"><span class="l">Custom implementation total ($)</span><input type="number" min="0" step="1" data-t="num" data-k="ov.implTotal" data-guard="impl" value="${S.ov.implTotal==null?"":S.ov.implTotal}" placeholder="${Math.round(c.impl.reduce((a,l)=>a+l.raw,0))}"><div class="hint">Policy floor for selected packages ${fmt(c.implFloor)}</div></label>`:""}
        <label class="f"><span class="l">Annual escalation (%)</span><input type="number" min="0" step="0.5" data-t="num" data-k="ov.escalation" value="${S.ov.escalation==null?"":S.ov.escalation}"><div class="hint">Policy default ${P.escalation}%</div></label>
      </div>
      ${impF.length?`<div class="sub">Floor exceptions</div>${impF.map(f=>`<div class="flag ${f.exec?"a":"r"}"><span>${f.label}: ${fmt(f.requested)} vs floor ${fmt(f.floor)} (short ${fmt(f.diff)})</span><span class="fx"><button class="linkbtn" data-act="requestExec" data-scope="${f.scope}">${f.exec?"Edit override":"Request executive override"}</button></span></div>`).join("")}`:""}
    </details>
    <details style="margin-top:10px"><summary class="linkbtn" style="cursor:pointer">Cost-to-Serve Inputs (Finance)</summary>
      <div class="grid g3" style="margin-top:10px">
        ${[["aws","AWS allocated annual cost / client"],["sdn","SDN allocated annual cost / client"],["third","Third-party recurring cost"],["support","Support delivery cost"],["other","Other direct cost"],["margin","Required software gross margin (%)"]].map(([k,l])=>`<label class="f"><span class="l">${l}</span><input type="number" min="0" step="1" data-t="num" data-k="cost.${k}" value="${S.cost[k]==null?"":S.cost[k]}"></label>`).join("")}
      </div>
      <div class="hint" style="margin-top:8px">Minimum ARR = recurring cost ÷ (1 − margin). Effective software floor = higher of policy floor and cost-derived floor.</div>
      <div class="grid g3" style="margin-top:8px">
        <div class="kvbox"><small class="hint">Policy floor ARR</small><div><b>${fmt(c.policyFloorARR)}</b></div></div>
        <div class="kvbox"><small class="hint">Cost-derived floor ARR</small><div><b>${fmt(c.costFloorARR)}</b></div></div>
        <div class="kvbox"><small class="hint">Effective floor ARR</small><div><b>${fmt(c.effFloorARR)}</b></div></div>
      </div>
    </details>`);

  /* 10 Future */
  const EH=P.families.EMPLOYEE_HUB.products;
  h += `<section class="card future ${ui.open.future?"open":""}" id="sec-future"><button class="hd" data-act="toggle" data-id="future" aria-expanded="${!!ui.open.future}"><span class="chev">&#9656;</span><span class="t">Future Product Families</span><span class="s">Employee Hub &mdash; disabled, pricing TBD</span><span class="sp"></span><span class="pill n">Preview only</span></button>
    <div class="bd"><div class="hint">Data model is ready for additional families. Employee Hub has no approved pricing and cannot be quoted. Enable preview only to see how dependency rules behave.</div>
    <label class="chk" style="margin:10px 0"><input type="checkbox" data-k="future.enabled" ${S.future.enabled?"checked":""}> Enable future-product dependency preview</label>
    <div class="choices">${Object.entries(EH).map(([k,d])=>`<button class="choice ${S.future.items[k]?"sel":""} ${S.future.enabled?"":"dis"}" data-act="toggleFuture" data-v="${k}" ${S.future.enabled?"":"disabled"}>
      <h4>${d.name}</h4><div class="hint">${d.desc||(d.requires.length?"Requires Employee Hub":"Required for Performance, Vacation Tracker and Learning Center")}</div><div style="margin-top:6px"><span class="pill a">Pricing TBD</span></div></button>`).join("")}</div></div></section>`;

  /* actions */
  h += `<div class="actionbar no-print">
    <button class="btn pri" data-act="save">Save Draft</button>
    <button class="btn" data-act="validate">Validate Deal</button>
    <button class="btn teal" data-act="previewProposal">Preview Client Proposal</button>
    <button class="btn" data-act="genHandoff">Generate Implementation Handoff</button>
    <button class="btn" data-act="genContract">Generate Contract Scope</button>
    <button class="btn danger" data-act="reset">Reset</button></div>`;

  $("left").innerHTML = h;
  if(focusSel){ const el=$("left").querySelector(focusSel); if(el){ el.focus(); try{ if(el.setSelectionRange && el.type==="text") el.setSelectionRange(el.value.length,el.value.length);}catch(e){} } window.__focus=null; }
  renderOutputs(c);
}

function rowHtml(r,stOpts){
  return `<div class="crow" data-rid="${r.id}">
    <div class="top">
      <label class="f"><span class="l">Requirement / Component</span><input type="text" data-row="${r.id}" data-f="name" value="${esc(r.name)}"></label>
      <label class="f"><span class="l">Scope Status</span><select data-row="${r.id}" data-f="status" data-struct="1">${stOpts.map(([v,l])=>`<option value="${v}" ${r.status===v?"selected":""}>${l}</option>`).join("")}</select></label>
      <label class="f"><span class="l">Est. hours</span><input type="number" min="0" step="0.5" data-t="num" data-row="${r.id}" data-f="hours" value="${r.hours==null?"":r.hours}" placeholder="—"></label>
      <label class="f"><span class="l">Pricing rate</span><select data-row="${r.id}" data-f="rate" data-struct="1"><option value="auto" ${r.rate==="auto"?"selected":""}>Auto (${fmt(calcAutoRate())}/hr)</option><option value="list" ${r.rate==="list"?"selected":""}>List ${fmt(CUSTOM_RATES.list)}</option><option value="target" ${r.rate==="target"?"selected":""}>Target ${fmt(CUSTOM_RATES.target)}</option><option value="custom" ${r.rate==="custom"?"selected":""}>Custom…</option></select>
        ${r.rate==="custom"?`<input type="number" min="0" step="1" data-t="num" data-row="${r.id}" data-f="customRate" data-guard="custom" value="${r.customRate==null?"":r.customRate}" placeholder="$/hr" style="margin-top:4px">`:""}</label>
      <label class="chk"><input type="checkbox" data-row="${r.id}" data-f="include" data-struct="1" ${r.include?"checked":""} ${r.status==="excluded"?"disabled":""}> Include in quote</label>
      <div class="calc ${r.pending?"pend":""}" id="rp-${r.id}">${rowPriceText(r)}</div>
    </div>
    <div id="rw-${r.id}">${r.warn?`<div class="note ${r.warnLvl==="r"?"r":"a"}">${r.warn}</div>`:""}</div>
    <details><summary>Details, quantities &amp; open questions</summary><div class="more">
      <label class="f"><span class="l">Description</span><textarea data-row="${r.id}" data-f="desc">${esc(r.desc)}</textarea></label>
      <div class="grid g2" style="margin-top:8px">
        <label class="f"><span class="l">Quantity label</span><input type="text" data-row="${r.id}" data-f="qtyLabel" value="${esc(r.qtyLabel)}" placeholder="e.g. Number of forms"></label>
        <label class="f"><span class="l">Quantity</span><input type="text" data-row="${r.id}" data-f="qty" value="${esc(r.qty)}" placeholder="blank = unknown"></label>
      </div>
      <label class="f" style="margin-top:8px"><span class="l">Notes</span><textarea data-row="${r.id}" data-f="notes">${esc(r.notes)}</textarea></label>
      <label class="f" style="margin-top:8px"><span class="l">Open questions (one per line)</span><textarea data-row="${r.id}" data-f="questions">${esc((r.questions||[]).join("\n"))}</textarea></label>
      <div style="display:flex;gap:18px;margin-top:10px;align-items:center;flex-wrap:wrap">
        <label class="chk"><input type="checkbox" data-row="${r.id}" data-f="showPending" ${r.showPending?"checked":""}> Show on client proposal as “Optional / Pending Scope”</label>
        <button class="linkbtn red" data-act="delRow" data-v="${r.id}">Remove row</button></div>
    </div></details></div>`;
}
function calcAutoRate(){ const ch=P.channels[S.channel]; const b=S.ov.implBasis==="auto"?ch.implBasis:S.ov.implBasis; return b==="list"?CUSTOM_RATES.list:b==="floor"?CUSTOM_RATES.floor:CUSTOM_RATES.target; }
function rowPriceText(r){
  if(r.status==="excluded") return "Excluded";
  if(r.pending) return r.status==="future"?"Future Phase":"Pending Scope";
  return fmt(r.price);
}

/* =====================================================================
   OUTPUT RENDERERS
   ===================================================================== */
function kv(k,v,cls=""){ return `<div class="kv ${cls}"><span class="k">${k}</span><span class="v ${v==="Pending Scope"||v==="Pricing TBD"?"pend":""}">${v}</span></div>`; }
function renderOutputs(c){
  c = c||calc(S);
  $("outName").textContent = (S.client||"Untitled deal")+" · "+P.channels[S.channel].label;
  const st=$("outStatus"); st.className="status "+c.status;
  st.textContent = c.status==="g"?"WITHIN POLICY":c.status==="a"?"REVIEW REQUIRED":"BLOCKED";
  $("pane-summary").innerHTML = summaryHtml(c);
  $("pane-proposal").innerHTML = proposalHtml(c);
  $("pane-handoff").innerHTML = handoffHtml(c);
  $("pane-contract").innerHTML = contractHtml(c);
  $("pane-pricelist").innerHTML = priceListHtml();
}

function summaryHtml(c){
  const yrs = c.years.map(y=>kv("Year "+y.y+(y.y===1?" (subscription + implementation + custom + support)":" (recurring, +"+(c.esc*100).toFixed(c.esc*100%1?1:0)+"% / yr compounded)"),fmt(y.total))).join("");
  const sub = c.sw.filter(l=>!l.included||true).map(l=>l.included?kv(l.name,l.qty+" included"):kv(l.name+(l.qty>1?" × "+l.qty:""),fmt(l.lineFinal)+"/mo")).join("");
  const pm = c.pendingModules.map(m=>kv(m.name,"Pricing TBD")).join("");
  const impl = c.impl.map(l=>kv(l.name,fmt(l.final))).join("") || kv("Implementation profile","Not selected");
  const flags = c.flags.length ? c.flags.map(f=>`<div class="flag ${f.lvl}"><span>${f.lvl==="r"?"&#9940;":f.lvl==="a"?"&#9888;":"&#8505;"}</span><span>${esc(f.msg)}</span>${f.fix?`<span class="fx"><button class="linkbtn" data-act="requestExec" data-scope="${f.fix.scope}">Override</button></span>`:""}</div>`).join("") : `<div class="flag i">&#10003; All checks passed — no management involvement required.</div>`;
  return `
  <div class="hero">
    <div><small>Monthly subscription</small><b>${fmt(c.monthlyFinal)}</b></div>
    <div><small>Annual recurring</small><b>${fmt(c.arr)}</b></div>
    <div><small>Year 1 total</small><b>${fmt(c.y1.total)}</b></div>
  </div>
  ${c.strategic>0?`<div class="invest"><b>Executive Strategic Investment:</b> ${fmt(c.strategic)} below policy floor (internal only).</div>`:""}
  <div class="sumblock"><h5>Checks &amp; flags</h5><div style="padding:10px">${flags}</div></div>
  <div class="sumblock"><h5>Subscription</h5>${sub}${pm}

function handoffHtml(c){
  const rowTxt = r=>`<b>${esc(r.name)}</b> — ${P.customWorkStatuses[r.status]}${r.qtyLabel?` · ${esc(r.qtyLabel)}: ${r.qty?esc(r.qty):"<i>unknown</i>"}`:""}${(r.questions&&r.questions.length)?`<ul>${r.questions.map(q=>`<li>${esc(q)}</li>`).join("")}</ul>`:""}${r.notes?`<div class="small">${esc(r.notes)}</div>`:""}`;
  const decisions = [];
  c.rows.filter(r=>!r.included && ["estimate","discovery","quantity","feasibility","notdiscussed"].includes(r.status)).forEach(r=>decisions.push(rowTxt(r)));
  if(c.cdef && S.hcmDecision==="tbd") decisions.push("<b>HCM connection</b> — include / exclude decision pending ("+c.cdef.name+")");
  if(c.everify==="tbd") decisions.push("<b>E-Verify</b> — activation decision pending");
  c.pendingModules.forEach(m=>decisions.push("<b>"+esc(m.name)+"</b> — pricing approval required"));
  if(c.sup.price==null) decisions.push("<b>"+c.sup.name+"</b> — pricing and service levels not approved");
  const excluded = [];
  c.rows.filter(r=>r.status==="excluded").forEach(r=>excluded.push(esc(r.name)));
  if(c.cdef && S.hcmDecision==="exclude") excluded.push(c.cdef.name+" (client declined / excluded)");
  if(c.everify==="no") excluded.push("E-Verify activation (not activated)");
  if(c.everify==="na") excluded.push("E-Verify — not applicable (jurisdiction); package not reduced");
  const future = c.rows.filter(r=>!r.included && r.status==="future").map(r=>rowTxt(r));
  const caps = [];
  if(S.impl){ caps.push("ATS360 core recruiting (dashboard, career portals, applications, interviews, talent pools, reporting)");
    if(S.impl==="ATS-HIRE"){ caps.push("Native E-Signature","Offer Journey","Pre-Hire Portal & pre-hire forms","Jurisdictional onboarding / compliance","Employee conversion"); if(c.everify==="activate") caps.push("E-Verify (activated)"); }
    else caps.push("<i>E-Signature / Pre-Hire / E-Verify capabilities exist in the platform but are <b>not configured</b> under Core.</i>"); }
  const mods = Object.keys(S.modules).filter(k=>S.modules[k]).map(k=>P.products[k].name+" — "+(P.products[k].list==null?"<b>pricing TBD</b>":"priced")+(P.products[k].note?" · "+P.products[k].note:""));
  const risks = [];
  if(S.impl) risks.push("Any scope beyond the “"+P.implementationProfiles[S.impl].name+"” boundary requires a Change Order — unused internal allocation is not a credit.");
  if(c.cdef) risks.push("Standard Connect covers only the locked standard workflow; custom fields, alternate triggers, extra approval paths, additional subsidiaries or non-standard mappings are Change Orders.");
  c.rows.filter(r=>r.status==="quantity").forEach(r=>risks.push(esc(r.name)+": quantity not confirmed — volume drives effort."));
  c.rows.filter(r=>r.status==="discovery").forEach(r=>risks.push(esc(r.name)+": discovery incomplete — scope could be materially larger than packages."));
  c.rows.filter(r=>r.status==="notdiscussed" && /migration/i.test(r.name)).forEach(r=>risks.push("Data migration is not assumed. If the client later expects it, it is a Change Order."));
  if(c.rows.some(r=>r.status==="estimate"&&/integration|connect/i.test(r.name))) risks.push("Direct third-party integrations are not baseline; confirm no verbal commitment was made in demo.");
  if(Object.values(S.modules).some(Boolean)) risks.push("Optional module activation effort is not priced in the packages.");
  risks.push("Post-go-live new configuration, training or workflow redesign is consulting, not support.");
  const deps = [];
  if(S.hcm==="gov") deps.push("Government HCM / NS4G environment available with Position / Requisition data");
  if(S.hcm==="sp") deps.push("SuitePeople environment available and standard workflow locked");
  deps.push("Client-provided branding assets, forms and approver lists","Client SMEs available for discovery, UAT and training","Initial invoice paid before project scheduling begins");
  if(S.modules["ATS-DOCUSIGN"]) deps.push("Client DocuSign subscription/account");
  if(S.modules["ATS-CHECKR"]) deps.push("Client Checkr account");
  if(c.everify==="activate") deps.push("Employer E-Verify enrollment/account");
  const assumptions = ["Standard configuration only; no custom workflows unless listed under custom scope","One internal and one external career portal","No data migration unless explicitly scoped","Go-live follows successful UAT and sign-off","Post-go-live transition per Standard Support policy; health-check cadence per approved policy"];
  return `<div class="doc">
    <div class="no-print" style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn sm" data-act="print" data-v="handoff">Print</button></div>
    <div class="intbar">INTERNAL — Sales-to-Implementation handoff. Do not send to client.</div>
    ${docHeader(c,"Implementation Handoff")}
    <h3>Deal</h3>
    <table><tbody>
      <tr><td>Client</td><td>${esc(S.client||"—")}</td><td>Sector</td><td>${SECTOR_LABEL[S.sector]}</td></tr>
      <tr><td>Region</td><td>${REGION_LABEL[S.region]}</td><td>HCM environment</td><td>${P.hcmProfiles[S.hcm]}</td></tr>
      <tr><td>Channel</td><td>${c.ch.label}${c.ch.partner&&S.partner.name?" — "+esc(S.partner.name):""}</td><td>Term</td><td>${S.term} yr</td></tr>
      <tr><td>Selected ATS package</td><td>ATS360 Platform</td><td>Implementation profile</td><td>${S.impl?P.implementationProfiles[S.impl].name:"<span class='pendtxt'>Not selected</span>"}</td></tr>
      <tr><td>HCM connector</td><td>${c.connectorIncluded?c.cdef.name:(c.cdef?c.cdef.name+" — "+S.hcmDecision.toUpperCase():"None")}</td><td>E-Verify</td><td>${({none:"Not part of package",na:"Not Applicable — Jurisdiction",activate:"Activate",no:"Do Not Activate",tbd:"TBD"})[c.everify]}</td></tr>
      <tr><td>Recruiter users</td><td>${c.rec} (${c.extraR} additional)</td><td>Hiring Manager users</td><td>${c.hm} (${c.extraH} additional)</td></tr>
      <tr><td>Commercial implementation allocation</td><td>${c.implHours} hrs${c.customHours?` + ${c.customHours} custom`:""} <span class="small">(internal, fixed-fee)</span></td><td>Support tier</td><td>${c.sup.name}</td></tr>
      <tr><td>Actual hours</td><td><i class="small">future tracking</i></td><td>Forecast effort</td><td><i class="small">future tracking</i></td></tr>
    </tbody></table>
    <h3>Activated capabilities</h3>${listHtml(caps)}
    <h3>Selected optional modules</h3>${listHtml(mods)}
    <h3>Custom scope — quoted</h3>${listHtml(c.incRows.map(r=>`<b>${esc(r.name)}</b> — ${r.hoursN} commercial hrs · ${fmt(r.price)}${r.desc?`<div class="small">${esc(r.desc)}</div>`:""}`),"No custom work in the current quote.")}
    <h3>Pending customer decisions</h3>${listHtml(decisions,"None")}
    <h3>Excluded items</h3>${listHtml(excluded)}
    <h3>Future phases</h3>${listHtml(future)}
    <h3>Change Order risks</h3>${listHtml(risks.map(esc))}
    <h3>Dependencies</h3>${listHtml(deps.map(esc))}
    <h3>Go-live assumptions</h3>${listHtml(assumptions.map(esc))}
  </div>`;
}

function contractHtml(c){
  const cl=[]; const add=(t,body)=>cl.push(`<div class="clause"><h4>${t}</h4>${body}</div>`);
  const fixed = `<p>Implementation services are provided on a <b>fixed-fee, fixed-scope</b> basis for the deliverables described in this Statement of Work. NetDynamic’s internal effort estimates are used for pricing and capacity planning only and do not constitute a prepaid bank of consulting hours. If the scope is completed in less effort than estimated, Customer is not entitled to a refund, credit, or future hours, and unused effort may not be applied to new or substituted scope. Any change to agreed scope requires a written Change Order at the out-of-scope rate stated in the agreement.</p>`;
  if(!S.impl) add("Implementation","<p class='pendtxt'>No implementation profile selected — contract scope cannot be generated for services.</p>");
  if(S.impl){
    add("1. ATS360 Core Deployment",`<p>NetDynamic will deploy and configure ATS360 for Customer, including: discovery; branding; one internal and one external career portal; standard email templates; roles and permissions; standard ATS application configuration and interview flow; Hiring Manager portal; standard workflows; user acceptance testing support; administrator and hiring manager / HR training as applicable; go-live; implementation handoff; project coordination; and a post-go-live transition allowance.</p>
      <p><b>Not included unless listed in this SOW:</b> custom workflows, custom integrations, additional subsidiaries, data migration, and HCM connection packages.</p>`);
  }
  if(S.impl==="ATS-HIRE"){
    add("2. Hire-to-Onboard Scope",`<p>In addition to Core Deployment, NetDynamic will implement: native E-Signature; Offer Journey; the Pre-Hire Portal and pre-hire / onboarding forms; jurisdictional onboarding and compliance configuration; and employee conversion.</p>
      <p><b>Not included:</b> non-standard form volumes, payroll mapping, direct third-party integrations, and custom onboarding packages. Forms beyond the quantity agreed in this SOW require a Change Order.</p>`);
    if(c.everify==="activate") add("2a. E-Verify",`<p>NetDynamic will configure E-Verify within ATS360 for Customer’s U.S. operations. E-Verify is available to eligible U.S. employers; Customer is responsible for employer enrollment and account requirements with the applicable government program.</p>`);
    else if(c.everify==="na") add("2a. E-Verify","<p>E-Verify is not applicable to Customer’s jurisdiction and will not be configured. The implementation fee is not reduced as a result.</p>");
    else if(c.everify==="no") add("2a. E-Verify","<p>Customer has elected not to activate E-Verify at this time. Later activation is outside this SOW and is handled by Change Order.</p>");
    else if(c.everify==="tbd") add("2a. E-Verify","<p class='pendtxt'>[Pending] E-Verify activation decision to be confirmed before signature.</p>");
  }
  if(c.connectorIncluded && c.ck==="SP-CONNECT") add("3. Standard SuitePeople Connect",`<p><b>Prerequisites:</b> Customer maintains an active NetSuite SuitePeople environment and approves one standard workflow before work begins.</p>
    <p><b>Scope:</b> one standard requisition-to-ATS workflow with standard field mapping and trigger, UAT, and handoff.</p>
    <p><b>Change Order boundary:</b> custom fields, alternate triggers, approval paths, additional subsidiaries and non-standard mappings are outside this scope.</p>`);
  if(c.connectorIncluded && c.ck==="GOV-CONNECT") add("3. Standard Government HCM Connect",`<p><b>Prerequisites:</b> Customer maintains an active Government HCM / NS4G environment with Position and Requisition data available, and approves one standard workflow definition before work begins.</p>
    <p><b>Scope:</b> one standard Position / Requisition-to-ATS workflow, standard Government HCM mapping of position and requisition data, UAT, and handoff.</p>
    <p><b>Change Order boundary:</b> non-standard approvals, budget logic, classification complexity, custom payroll or position structures, and any other custom configuration are outside this scope.</p>`);
  if(c.impl.length) add("Fixed-Fee / Fixed-Scope Provision",fixed);
  const mods=Object.keys(S.modules).filter(k=>S.modules[k]);
  if(mods.length) add("Optional Modules",`<ul>${mods.map(k=>`<li>${P.products[k].name} — ${P.products[k].list==null?"<span class='pendtxt'>[pricing TBD — not contracted]</span>":""} ${esc(P.products[k].note||"")}</li>`).join("")}</ul>`);
  if(c.incRows.length){
    add("Deal-Specific Deliverables",`<table><thead><tr><th>Deliverable</th><th>Description</th><th>Quantity</th><th>Commercial Scope</th><th>Acceptance / Limitation</th></tr></thead><tbody>
    ${c.incRows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.desc)}</td><td>${r.qty?esc(r.qty)+(r.qtyLabel?" ("+esc(r.qtyLabel)+")":""):"As defined in SOW"}</td><td>Fixed fee ${fmt(r.price)}</td><td>Limited to the deliverable and quantity stated; additional quantity or changes by Change Order.${r.notes?" "+esc(r.notes):""}</td></tr>`).join("")}</tbody></table>`);
  }
  const notIncl = c.rows.filter(r=>!r.included && r.status!=="excluded");
  if(notIncl.length) add("Items Discussed but Not Contracted",`<p>The following were discussed and are <b>not included</b> in this SOW unless added by Change Order or amendment:</p>${listHtml(notIncl.map(r=>esc(r.name)+" — "+P.customWorkStatuses[r.status]))}`);
  add("Support",`<p>${c.sup.name}${c.sup.price===0?" is included in the subscription.":c.sup.price==null?" — <span class='pendtxt'>[pricing and service levels not approved]</span>":""} Support covers product defects, tickets, basic questions and release communications. New configuration, workflow redesign, new forms, integrations, new modules, training and workshops requested after go-live are consulting services handled under a separate scope or Change Order.</p>`);
  add("Commercial Terms",`<p>Subscription: Year 1 payable in advance upon signature; monthly thereafter. Implementation: due upon signature. Annual escalation: ${(c.esc*100).toFixed(c.esc*100%1?1:0)}% on renewal. Project scheduling begins upon receipt of the first invoice payment.</p>`);
  return `<div class="doc">
    <div class="no-print" style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn sm" data-act="print" data-v="contract">Print</button></div>
    <div class="intbar">INTERNAL DRAFT — mock clause language generated from selections. Requires legal review before use.</div>
    ${docHeader(c,"Contract / SOW Scope Summary")}${cl.join("")}</div>`;
}
