      <label class="chk"><input type="checkbox" data-k="priceList.showSupport" ${pl.showSupport?"checked":""}> Show support</label>
      <button class="btn sm" data-act="pickLogo">${S.logo?"Replace logo":"Upload partner logo"}</button>
      <button class="btn sm teal" data-act="print" data-v="pricelist">Print / Save PDF</button>
    </div>
    <div class="hint" style="margin-bottom:12px">Uses the logo from Deal Information. Content is List price only — hours, target, strategic, floor and commission never appear here.</div></div>
    <div id="plDoc">${priceListDoc()}</div>`;
}
function priceListDoc(){
  const pl=S.priceList, pp=P.products, esc_=P.escalation;
  const subRows = [
    ["ATS360 Platform","Includes "+pp["ATS-PLATFORM"].includedUsers.ats+" ATS360 Recruiter Users and "+pp["ATS-PLATFORM"].includedUsers.hiringManagers+" Hiring Manager Users",fmt(pp["ATS-PLATFORM"].list)+" / month <div class='small'>"+fmt(pp["ATS-PLATFORM"].list*12)+" / year</div>"],
    ["Additional ATS360 Recruiter User","Users above "+pp["ATS-PLATFORM"].includedUsers.ats,fmt(pp["ATS-USER"].list)+" / user / month"],
    ["Additional Hiring Manager User","Users above "+pp["ATS-PLATFORM"].includedUsers.hiringManagers,fmt(pp["ATS-HM"].list)+" / user / month"]
  ].map(r=>`<tr><td>${r[0]}</td><td class="small">${r[1]}</td><td class="n">${r[2]}</td></tr>`).join("");
  const impl = (obj)=>Object.entries(obj).map(([k,d])=>{
    const price=d.commercialHours*IMPL_RATES.list;
    return `<tr><td>${esc(d.name)}</td><td class="small">${esc(implDesc(k))}</td><td class="n">${fmt(price)}</td></tr>`;
  }).join("");
  const implRows = impl(P.implementationProfiles)+impl(P.hcmConnections);
  const mods = ["ATS-SMS","ATS-VIDEO","ATS-DOCUSIGN","ATS-CHECKR"].map(k=>{
    const p=pp[k];
    return `<tr><td>${esc(p.name)}</td><td class="small">${esc(p.note||"")}</td><td class="n">${p.list==null?"<span class='pendtxt'>Pricing available on request</span>":fmt(p.list)+" / month"}</td></tr>`;
  }).join("");
  const sup = P.support;
  const supRows = Object.entries(sup).map(([k,d])=>`<tr><td>${d.name}</td><td class="small">${d.price===0?d.items.join(" · "):"Scope and pricing not yet approved"}</td><td class="n">${d.price===0?"Included in subscription":(d.price==null?"<span class='pendtxt'>Not yet available</span>":fmt(d.price)+" / year")}</td></tr>`).join("");
  const date = new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
  return `<div class="doc">
    ${pl.approved?"":`<div class="draftbar">DRAFT — pricing is proposed and has not been approved for release.</div>`}
    <div class="dh"><div class="lg">
      <div><img class="nd" src="https://netdynamicconsulting.com/images/common/logobanner.png" alt="NetDynamic" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex'"><span class="logo-ph">NetDynamic</span></div>
      <span class="ats-badge">ATS360</span></div>
      <div>${S.logo?`<img class="client" src="${S.logo}" alt="${esc(pl.partner)} logo">`:`<span class="print-hide" style="border:1px dashed #b3c2d3;color:#8a98aa;padding:12px 18px;font-size:11px;border-radius:5px">Partner logo</span>`}</div></div>
    <h2>ATS360 List Price Sheet</h2>
    <div class="meta"><b>Prepared for ${esc(pl.partner||"Partner")}</b> &middot; ${date}${pl.valid?` &middot; Valid until ${esc(pl.valid)}`:""}</div>
    <p class="small" style="margin-top:8px">ATS360 is NetDynamic’s NetSuite-native applicant tracking solution. All prices are in USD, exclusive of taxes.</p>
    <h3>Subscription</h3>
    <table><thead><tr><th>Component</th><th>Details</th><th class="n">List Price</th></tr></thead><tbody>${subRows}</tbody></table>
    <div class="small">${P.terms.licensing}</div>
    <h3>Implementation — fixed fee, fixed scope</h3>
    <table><thead><tr><th>Package</th><th>Description</th><th class="n">List Price</th></tr></thead><tbody>${implRows}</tbody></table>
    <div class="small">Choose ATS360 Core <u>or</u> Hire-to-Onboard, not both. Connect packages apply only where the customer uses SuitePeople or Government HCM. ${P.terms.oneTime}.</div>
    ${pl.showModules?`<h3>Optional Modules &amp; Integrations</h3>
    <table><thead><tr><th>Module</th><th>Notes</th><th class="n">List Price</th></tr></thead><tbody>${mods}</tbody></table>`:""}
    ${pl.showSupport?`<h3>Post-Go-Live Support</h3>
    <table><thead><tr><th>Plan</th><th>Includes</th><th class="n">Price</th></tr></thead><tbody>${supRows}</tbody></table>`:""}
    <h4>Terms</h4><ul class="small">
      <li>Subscriptions auto-renew annually with a ${esc_}% increase beginning in Year 2 unless otherwise stated in the agreement.</li>
      <li>Implementation packages are fixed fee / fixed scope. Work outside the agreed scope requires a Change Order at the rate stated in the applicable agreement.</li>
      <li>Standard Connect packages cover one approved standard workflow. Custom integrations, data migration and additional scope are quoted separately.</li>
      <li>E-Verify is available to eligible U.S. employers; employer enrollment/account requirements apply.</li>
      <li>DocuSign and Checkr integrations require the customer’s own DocuSign or Checkr account; Checkr is U.S. only. SMS third-party usage charges may apply.</li>
      <li>NetDynamic will commence project scheduling upon receipt of the first invoice payment.</li>
    </ul></div>`;
}

function toast(t){ const e=$("toast"); e.textContent=t; e.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("on"),2200); }
function openModal(html){ $("modal").innerHTML=html; $("modalBg").classList.add("on"); const f=$("modal").querySelector("input,select,button"); if(f) f.focus(); }
function closeModal(){ $("modalBg").classList.remove("on"); $("modal").innerHTML=""; }

let pendingOverride=null;
function openOverride(scope, cancelFn){
  const c=calc(S); const f=c.floors.find(x=>x.scope===scope);
  if(!f){ return; }
  const e=S.exec[scope]||{};
  pendingOverride={scope,cancelFn};
  openModal(`<div class="mh red">Price Below Approved Floor</div><div class="mb">
    <div class="grid g3" style="margin-bottom:14px">
      <div class="kvbox"><small class="hint">Requested</small><div><b>${fmt(f.requested)}</b></div></div>
      <div class="kvbox"><small class="hint">Approved floor</small><div><b>${fmt(f.floor)}</b></div></div>
      <div class="kvbox"><small class="hint">Executive Strategic Investment</small><div><b style="color:var(--red)">${fmt(Math.max(0,f.floor-f.requested))}</b></div></div></div>
    <div class="hint" style="margin-bottom:10px">${esc(f.label)}. The difference stays visible internally and never appears on the client proposal.</div>
    <label class="chk" style="margin-bottom:10px"><input type="checkbox" id="exYes" ${e.yes?"checked":""}> Executive Override = Yes</label>
    <label class="f"><span class="l">Approver Name</span><input type="text" id="exWho" value="${esc(e.approver||"")}"></label>
    <label class="f" style="margin-top:10px"><span class="l">Override Reason</span><select id="exWhy"><option value="">Select…</option>${["Strategic account","Market entry","Partner commitment","Reference customer","Executive decision","Other"].map(r=>`<option ${e.reason===r?"selected":""}>${r}</option>`).join("")}</select></label>
    <div id="exErr" class="note r" style="display:none"></div></div>
    <div class="mf"><button class="btn" data-act="exCancel">Cancel</button><button class="btn pri" data-act="exConfirm">Record override</button></div>`);
}
function exConfirm(){
  const yes=$("exYes").checked, who=$("exWho").value.trim(), why=$("exWhy").value;
  if(!yes||!who||!why){ const e=$("exErr"); e.style.display="block"; e.textContent="Select Executive Override = Yes, enter the approver’s name and choose a reason."; return; }
  S.exec[pendingOverride.scope]={yes:true,approver:who,reason:why};
  pendingOverride=null; closeModal(); renderLeft(); toast("Executive override recorded");
}
function exCancel(){
  const p=pendingOverride; pendingOverride=null; closeModal();
  if(p&&p.cancelFn) p.cancelFn(); renderLeft();
}

function validateDeal(){
  const c=calc(S);
  const groups=[["r","Blocked","Must be resolved or overridden by management"],["a","Review required","Resolve or accept before sending"],["i","For awareness",""]];
  const body = c.flags.length ? groups.map(([l,t,s])=>{ const fl=c.flags.filter(f=>f.lvl===l); return fl.length?`<div class="sub">${t} (${fl.length}) <span style="font-weight:400;color:var(--muted)">${s}</span></div>${fl.map(f=>`<div class="flag ${l}"><span>${esc(f.msg)}</span></div>`).join("")}`:""; }).join("") : `<div class="note g">No exceptions. Deal is within policy.</div>`;
  openModal(`<div class="mh">Deal validation — <span class="status ${c.status}" style="margin-left:6px">${c.status==="g"?"WITHIN POLICY":c.status==="a"?"REVIEW REQUIRED":"BLOCKED"}</span></div><div class="mb">${body}</div><div class="mf"><button class="btn pri" data-act="closeModal">Close</button></div>`);
}

/* =====================================================================
   EVENTS
   ===================================================================== */
function setPath(obj,path,val){ const p=path.split("."); let o=obj; for(let i=0;i<p.length-1;i++) o=o[p[i]]; o[p[p.length-1]]=val; }
function getPath(obj,path){ return path.split(".").reduce((o,k)=>o[k],obj); }
const STRUCT = new Set(["region","hcm","channel","ov.swBasis","ov.implBasis","partner.base","future.enabled","hcmOverrideKey","term","sector","partner.svcImpl","partner.svcCustom"]);

function focusSelector(t){
  if(t.dataset.k) return `[data-k="${t.dataset.k}"]`;
  if(t.dataset.row) return `[data-row="${t.dataset.row}"][data-f="${t.dataset.f}"]`;
  return null;
}

function onField(e){
  const t=e.target; if(!(t instanceof HTMLElement)) return;
  if(t.dataset.k!==undefined){
    let v = t.type==="checkbox"?t.checked : t.dataset.t==="num" ? (t.value===""?null:parseFloat(t.value)) : t.value;
    if(t.tagName==="SELECT" && ["term"].includes(t.dataset.k)) v=parseInt(v,10);
    const k=t.dataset.k;
    if(k.indexOf("priceList.")===0){ setPath(S,k,v); const d=$("plDoc"); if(d) d.innerHTML=priceListDoc(); return; }
    const guard=t.dataset.guard;
    if(guard && e.type==="change" && v!=null){ if(guardedChange(guard,k,v,t)) return; }
    setPath(S,k,v);
    if(k==="hcm"){ S.hcmDecision = (v==="sp"||v==="gov")?"include":"tbd"; S.hcmOverrideKey=""; }
    if(k==="hcmOverrideKey"){ S.hcmDecision = v?"include":"tbd"; }
    if(k==="region" && v!=="US"){ S.modules["ATS-CHECKR"]=false; }
    if(k==="ov.swBasis" && v!=="custom") S.ov.platformMonthly=null;
    if(k==="ov.implBasis" && v!=="custom") S.ov.implTotal=null;
    if(k==="channel" && P.channels[v].partner && S.partner.base===undefined) S.partner.base="recurring";
    if(STRUCT.has(k) || (e.type==="change"&&t.tagName==="SELECT")){ window.__focus=focusSelector(t); renderLeft(); }
    else renderOutputs();
    return;
  }
  if(t.dataset.row){
    const r=S.rows.find(x=>x.id===t.dataset.row); if(!r) return;
    const f=t.dataset.f;
    let v = t.type==="checkbox"?t.checked : t.dataset.t==="num" ? (t.value===""?null:parseFloat(t.value)) : t.value;
    if(f==="questions") v=t.value.split("\n").map(x=>x.trim()).filter(Boolean);
    if(t.dataset.guard==="custom" && e.type==="change" && v!=null && v<CUSTOM_RATES.floor){
      const old=r.customRate;
      // temporary state so the modal can compute the shortfall
      r.customRate=v; r.hours = r.hours||0;
      const c=calc(S); const rowc=c.rows.find(x=>x.id===r.id);
      if(!(rowc.hoursN>0)){ r.customRate=v; renderLeft(); toast("Custom rate is below the "+fmt(CUSTOM_RATES.floor)+"/hr floor — enter hours to request an override."); return; }
      if(!(r.include)){ r.customRate=v; renderLeft(); return; }
    }
    r[f]=v;
    if(f==="status" && v==="excluded") r.include=false;
    if(t.dataset.struct || e.type==="change"){ window.__focus=focusSelector(t); renderLeft(); }
    else { const c=calc(S); updateRowCells(c); renderOutputs(c); }
    return;
  }
}
function updateRowCells(c){
  c.rows.forEach(r=>{
    const p=$("rp-"+r.id), w=$("rw-"+r.id);
    if(p){ p.textContent=rowPriceText(r); p.className="calc "+(r.pending?"pend":""); }
    if(w) w.innerHTML = r.warn?`<div class="note ${r.warnLvl==="r"?"r":"a"}">${r.warn}</div>`:"";
  });
}
// intercept below-floor entries on custom price inputs: show red modal rather than accept silently
function guardedChange(scope,k,v,input){
  const floor = scope==="software" ? P.products["ATS-PLATFORM"].floor : scope==="impl" ? calc(S).implFloor : 0;
  if(scope!=="software" && scope!=="impl") return false;
  if(v>=floor-0.005){ delete S.exec[scope]; return false; }
  const old = getPath(S,k); setPath(S,k,v);
  const cancel=()=>{ setPath(S,k,floor); };
  const c=calc(S);
  // for software, compare against the effective retained ARR floor
  openOverride(scope,cancel);
  return true;
}

document.addEventListener("input",e=>{ if(e.target.matches("input[type=text],input[type=number],textarea")) onField(e); });
document.addEventListener("change",e=>{ if(e.target.id==="logoFile"){ handleLogo(e.target.files[0]); return; } if(e.target.matches("input,select,textarea")) onField(e); });

document.addEventListener("click",e=>{
  const tab=e.target.closest("[data-tab]"); if(tab){ setTab(tab.dataset.tab); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act, v=b.dataset.v;
  switch(a){
    case "toggle": ui.open[b.dataset.id]=!ui.open[b.dataset.id]; $("sec-"+b.dataset.id).classList.toggle("open",!!ui.open[b.dataset.id]); b.setAttribute("aria-expanded",!!ui.open[b.dataset.id]); break;
    case "pickImpl": S.impl = S.impl===v?"":v; renderLeft(); break;
    case "setEv": S.everify=v; renderLeft(); break;
    case "setHcm": S.hcmDecision=v; renderLeft(); break;
    case "toggleMod": S.modules[v]=!S.modules[v]; renderLeft(); break;
    case "toggleFuture": S.future.items[v]=!S.future.items[v]; renderLeft(); break;
    case "pickSupport": S.support=v; renderLeft(); break;
    case "addRow": S.rows.push({ id:nid(), name:"", desc:"", status:"estimate", hours:null, rate:"auto", customRate:null, include:false, showPending:false, qtyLabel:"", qty:"", notes:"", questions:[] }); ui.open.custom=true; renderLeft(); { const rs=document.querySelectorAll(".crow"); const last=rs[rs.length-1]; if(last){ last.scrollIntoView({block:"center"}); const i=last.querySelector("input"); if(i) i.focus(); } } break;
    case "addHcmRow": S.rows.push({ id:nid(), name:"Custom HCM Integration", desc:"Describe the deviation from the standard connect (fields, triggers, approvals, subsidiaries, mappings).", status:"estimate", hours:null, rate:"auto", customRate:null, include:false, showPending:false, qtyLabel:"", qty:"", notes:"", questions:[] }); ui.open.custom=true; renderLeft(); toast("Added to Deal-Specific Scope — needs estimate"); document.getElementById("sec-custom").scrollIntoView({block:"start"}); break;
    case "delRow": S.rows=S.rows.filter(r=>r.id!==v); renderLeft(); break;
    case "pickLogo": $("logoFile").click(); break;
    case "rmLogo": S.logo=""; renderLeft(); break;
    case "requestExec": openOverride(b.dataset.scope,null); break;
    case "exConfirm": exConfirm(); break;
    case "exCancel": exCancel(); break;
    case "closeModal": closeModal(); break;
    case "save": saveDraft(); break;
    case "validate": validateDeal(); break;
    case "previewProposal": setTab("proposal"); break;
    case "genHandoff": setTab("handoff"); toast("Implementation handoff generated"); break;
    case "genContract": setTab("contract"); toast("Contract scope generated"); break;
    case "reset": if(confirm("Reset to the Roswell demo deal? Unsaved changes and the saved draft will be cleared.")){ try{localStorage.removeItem(LS_KEY);}catch(x){} S=demoState(); renderLeft(); setTab("summary"); toast("Reset to demo deal"); } break;
    case "loadDemo": S=demoState(); renderLeft(); toast("Roswell demo loaded"); break;
    case "blank": S=baseState(); renderLeft(); toast("New blank deal"); break;
    case "print": printTab(v); break;
  }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && $("modalBg").classList.contains("on")){ if(pendingOverride) exCancel(); else closeModal(); } });

function setTab(t){
  ui.tab=t;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  document.querySelectorAll(".tab-pane").forEach(p=>p.classList.toggle("on",p.id==="pane-"+t));
  const body=document.querySelector(".out-body"); if(body) body.scrollTop=0;
  if(window.innerWidth<=1150) $("pane-"+t).scrollIntoView({block:"start"});
}
function printTab(name){
  const c=calc(S);
  if(name==="pricelist" && !S.priceList.approved && !confirm("This price list is not marked as approved, so it will print with a DRAFT banner. Print anyway?")) return;
  if(name==="proposal" && c.status!=="g"){
    const msg = c.status==="r" ? "This deal is BLOCKED by policy. The printout will be watermarked as a DRAFT. Print anyway?" : "This deal still has items requiring review. Print the client proposal anyway?";
    if(!confirm(msg)) return;
  }
  setTab(name); setTimeout(()=>window.print(),80);
}

/* logo upload: downscale to keep draft small */
function handleLogo(file){
  if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{
    if(file.type==="image/svg+xml"){ S.logo=rd.result; renderLeft(); return; }
    const img=new Image();
    img.onload=()=>{
      const max=480, sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement("canvas"); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      S.logo=cv.toDataURL("image/png"); renderLeft(); toast("Client logo added");
    };
    img.onerror=()=>toast("That file could not be read as an image.");
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}

/* draft persistence */
function saveDraft(){
  try{ localStorage.setItem(LS_KEY,JSON.stringify({S,uid})); toast("Draft saved in this browser"); }
  catch(e){ toast("Could not save draft (browser storage unavailable or full)"); }
}
function loadDraft(){
  try{ const d=JSON.parse(localStorage.getItem(LS_KEY)||"null"); if(d&&d.S){ S=Object.assign(baseState(),d.S); S.ov=Object.assign(baseState().ov,d.S.ov||{}); S.partner=Object.assign(baseState().partner,d.S.partner||{}); S.cost=Object.assign(baseState().cost,d.S.cost||{}); S.priceList=Object.assign(baseState().priceList,d.S.priceList||{}); uid=Math.max(uid,d.uid||1); return true; } }catch(e){}
  return false;
}

/* init */
const restored = loadDraft();
renderLeft();
if(restored) toast("Saved draft restored");
</script>
