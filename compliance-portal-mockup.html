<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compliance Portal (name TBD): functional mockup</title>
<!--
  Compliance Portal (product name TBD) - functional mockup for the dev team.
  Single self-contained file: no external fonts, scripts, images or network calls.
  All data is fake and lives in memory. "Reset demo" restores the starting state.
  Demo date is fixed to Nov 19, 2026 so expiry and reminder states are predictable.
-->
<style>
:root{
  --brand:#17255a; --brand-2:#24357d; --accent:#e8590c; --accent-hover:#cf4e0a; --on-accent:#ffffff;
  --bg:#f2f4f8; --surface:#ffffff; --surface-2:#f7f8fb; --ink:#18203a; --muted:#5b6582; --line:#dde2ec;
  --ok:#1d7f54; --ok-bg:#e2f3ea; --warn:#8a5a0f; --warn-bg:#fcefd6; --bad:#b4332a; --bad-bg:#fbe4e1;
  --info:#2453c4; --info-bg:#e4ecfc; --neutral-bg:#eceff5; --parsed:#fff6d6; --parsed-line:#e2b93b;
  --note-bg:#fff8e6; --note-line:#e9c46a; --note-ink:#5c4210;
  --head-bg:#17255a; --head-ink:#ffffff;
  --radius:10px; --radius-sm:7px;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 6px 18px rgba(20,30,60,.07);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --brand:#9fb3ff; --brand-2:#c3d0ff; --accent:#f27a36; --accent-hover:#ff8c4d; --on-accent:#1a0f06;
    --bg:#0f1424; --surface:#171e33; --surface-2:#1c2440; --ink:#e7ebf5; --muted:#9aa4c0; --line:#2b3553;
    --ok:#5fd29a; --ok-bg:#163a2a; --warn:#f0c46b; --warn-bg:#3a2e14; --bad:#ff8a7e; --bad-bg:#43201d;
    --info:#8fb0ff; --info-bg:#1d2b55; --neutral-bg:#252e4a; --parsed:#3a3214; --parsed-line:#b38f1f;
    --note-bg:#2e2712; --note-line:#8a6d22; --note-ink:#f3dfa6;
    --head-bg:#0b1330; --head-ink:#ffffff;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.2}
p{margin:0}
a{color:var(--info)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Top demo bar ---------- */
.demobar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.demobar .title{font-weight:700;font-size:15px;color:var(--brand)}
.demobar .tbd{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:20px;padding:2px 8px}
.seg{display:inline-flex;background:var(--neutral-bg);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.demobar .spacer{flex:1}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-weight:600;color:var(--muted)}
.switch input{appearance:none;width:34px;height:20px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:17px}
.switch input:disabled{opacity:.5;cursor:not-allowed}

/* ---------- Buttons, chips, inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:var(--radius-sm);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.dark{background:var(--brand);border-color:var(--brand);color:#fff}
@media (prefers-color-scheme: dark){.btn.dark{color:#0f1424}}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--neutral-bg);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--neutral-bg);color:var(--muted)}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
.in,select.in,textarea.in{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);min-height:36px}
textarea.in{min-height:80px;resize:vertical}
.in.parsed{background:var(--parsed);border-color:var(--parsed-line)}
.in.err{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-bg)}
.err-msg{color:var(--bad);font-size:12px;margin-top:3px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-b{padding:14px 16px}
.stack>*+*{margin-top:12px}
.hr-line{height:1px;background:var(--line);margin:14px 0}

/* ---------- Dev notes ---------- */
.dn{display:none;margin:8px 0;padding:8px 10px;border:1px dashed var(--note-line);background:var(--note-bg);color:var(--note-ink);border-radius:8px;font-size:12.5px;line-height:1.45}
body.notes .dn{display:block}
body.notes .dn.inline{display:inline-block;margin:0 0 0 6px;padding:2px 7px}
.dn b{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;font-size:11px;background:var(--note-line);color:#2b1f05}
.dn.k-exists b{background:#9ad3b5;color:#0d3b25}
.dn.k-extend b{background:#a9c2f5;color:#10265e}
.dn.k-new b{background:#f5b48b;color:#4a1d03}
.dn.k-legal b{background:#f2a3a3;color:#4d0c0c}

/* ---------- HR portal shell ---------- */
.hr{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 54px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.side .ctx{font-size:12px;color:var(--muted);padding:4px 10px 12px}
.side .ctx strong{display:block;color:var(--ink);font-size:13px}
.navbtn{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:9px 10px;border:0;background:transparent;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn.on{background:var(--brand);color:#fff}
@media (prefers-color-scheme: dark){.navbtn.on{color:#0f1424}}
.navbtn .n{font-size:11.5px;padding:1px 7px;border-radius:20px;background:var(--accent);color:var(--on-accent)}
.main{min-width:0}
.band{background:var(--head-bg);color:var(--head-ink);padding:22px 28px 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.band h1{font-size:34px;font-weight:800;letter-spacing:-.02em}
.band p{opacity:.8;margin-top:6px}
.band .who{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.95}
.band .who select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:7px;padding:5px 8px}
.band .who select option{color:#18203a}
.content{padding:20px 28px 60px}
@media (max-width:900px){
  .hr{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .side .ctx{display:none}
  .navbtn{width:auto;white-space:nowrap;gap:8px}
  .band{padding:18px}
  .band h1{font-size:26px}
  .content{padding:16px}
}

/* status strip */
.strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.strip button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.strip button b{color:var(--ink);margin-left:4px}
.strip button.on{border-color:var(--brand);color:var(--brand);background:var(--info-bg)}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.bulkbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;margin-bottom:10px;border-radius:var(--radius);background:var(--brand);color:#fff}
@media (prefers-color-scheme: dark){.bulkbar{color:#0f1424}}
.bulkbar .btn{background:rgba(255,255,255,.95);color:#18203a;border-color:transparent}

/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;min-width:760px}
table.t th{font-size:12px;font-weight:700;color:var(--muted);text-align:left;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.dim td{opacity:.55}
.who-cell{display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--info-bg);color:var(--info);flex:none}
.linkbtn{border:0;background:none;padding:0;cursor:pointer;font-weight:700;color:var(--ink);text-align:left}
.linkbtn:hover{color:var(--accent);text-decoration:underline}
.bar{height:6px;border-radius:6px;background:var(--neutral-bg);overflow:hidden;width:90px}
.bar i{display:block;height:100%;background:var(--accent)}
.menuwrap{position:relative;display:inline-block}
.menu{position:absolute;right:0;top:calc(100% + 4px);z-index:30;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:5px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--surface-2)}
.menu button:disabled{opacity:.4;cursor:not-allowed}
.menu .sep{height:1px;background:var(--line);margin:4px 0}

/* review split */
.split{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
@media (max-width:1000px){.split{grid-template-columns:1fr}}
.qitem{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:12px;cursor:pointer;margin-bottom:8px}
.qitem.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--warn-bg)}
.diff td.changed{background:var(--warn-bg);font-weight:600}

/* drawer */
.overlay{position:fixed;inset:0;background:rgba(10,15,35,.45);z-index:60;display:flex;justify-content:flex-end}
.overlay.center{justify-content:center;align-items:center;padding:16px}
.drawer{width:min(720px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer-h{padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer-b{padding:16px 20px;overflow-y:auto;flex:1}
.drawer-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal{width:min(620px,100%);max-height:92vh;background:var(--surface);border-radius:12px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.formrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:8px;background:var(--surface-2)}
.formrow.off{background:var(--surface)}
.formrow.off .ctrls{opacity:.4;pointer-events:none}
.formrow .ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:640px){.formrow{grid-template-columns:1fr}}
.warnbox{padding:10px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13px}
.badbox{padding:10px 12px;border-radius:8px;background:var(--bad-bg);color:var(--bad);font-size:13px}
.okbox{padding:10px 12px;border-radius:8px;background:var(--ok-bg);color:var(--ok);font-size:13px}
.infobox{padding:10px 12px;border-radius:8px;background:var(--info-bg);color:var(--info);font-size:13px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:14px 16px}
.stat .v{font-size:28px;font-weight:800;letter-spacing:-.02em}
.stat .l{color:var(--muted);font-size:13px}
.hbar{display:grid;grid-template-columns:120px 1fr 48px;gap:10px;align-items:center;margin:8px 0}
.hbar .track{height:12px;border-radius:12px;background:var(--neutral-bg);overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--brand)}

/* ---------- Employee portal ---------- */
.empwrap{display:flex;flex-direction:column;align-items:center;padding:18px 12px 60px;gap:12px}
.emptools{width:min(980px,100%);display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.phone{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;min-height:720px;display:flex;flex-direction:column}
.p-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.p-logo{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;background:var(--portal,#7a1427)}
.p-head .co{font-weight:700;font-size:14px}
.p-head .sub{font-size:12px;color:var(--muted)}
.p-body{padding:16px;flex:1}
.p-foot{padding:14px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.p-hello h2{font-size:24px;font-weight:800;letter-spacing:-.01em}
.p-progress{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:14px;margin:14px 0}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--portal,#7a1427) calc(var(--p)*1%),var(--neutral-bg) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:14px}
.p-item{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.p-item .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--neutral-bg);font-weight:800;color:var(--portal,#7a1427);flex:none;font-size:13px}
.p-item .grow{flex:1;min-width:0}
.p-item h4{font-size:14px}
.p-btn{background:var(--portal,#7a1427);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.p-btn:disabled{opacity:.45;cursor:not-allowed}
.p-btn.full{width:100%;padding:12px}
.p-btn.line{background:transparent;color:var(--portal,#7a1427);border:1px solid var(--portal,#7a1427)}
.p-sec{font-size:15px;font-weight:700;margin:18px 0 8px}
.p-field{margin-bottom:12px}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
.methods button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;cursor:pointer;text-align:left;font-weight:600}
.methods button small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.methods button.on{border-color:var(--portal,#7a1427);box-shadow:0 0 0 2px var(--neutral-bg)}
.capture{border:1px dashed var(--line);border-radius:12px;padding:12px;margin:8px 0;background:var(--surface-2)}
.rule{padding:10px 12px;border-radius:10px;font-size:13px;margin:8px 0}
.rule.r-capture{background:var(--info-bg);color:var(--info)}
.rule.r-parse{background:var(--ok-bg);color:var(--ok)}
.confirm{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);margin:14px 0}
.confirm input{margin-top:3px;width:18px;height:18px;flex:none}
.otp{display:flex;gap:6px;justify-content:center;margin:16px 0}
.otp input{width:42px;height:50px;text-align:center;font-size:20px;font-weight:700;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.mail{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.mail .mh{padding:14px 18px;border-bottom:1px solid var(--line);font-size:13px}
.mail .mb{padding:18px}
.spinner{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--portal,#7a1427);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation:none}}

/* toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#18203a;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);font-weight:600;max-width:90vw}
.toast.bad{background:#8f241c}
@media (prefers-color-scheme: dark){.toast{background:#e7ebf5;color:#0f1424}.toast.bad{background:#ff8a7e;color:#2b0805}}

/* print */
#print-area{display:none}
@media print{
  body>*:not(#print-area){display:none!important}
  #print-area{display:block;color:#000;font-family:Georgia,serif}
  #print-area h1{font-size:20px;margin-bottom:6px}
  #print-area table{width:100%;border-collapse:collapse;margin:10px 0}
  #print-area td,#print-area th{border:1px solid #999;padding:6px;text-align:left;font-size:12px}
  #print-area .pg{page-break-after:always}
}
</style>
</head>
<body>
<div class="demobar" id="demobar"></div>
<main id="app"></main>
<div id="overlay-root"></div>
<div id="toast" aria-live="polite"></div>
<div id="print-area"></div>

<script>
'use strict';
/* =====================================================================
   FIXED DEMO DATE + HELPERS
   ===================================================================== */
const TODAY_ISO = '2026-11-19';
function toDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function iso(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
const TODAY = toDate(TODAY_ISO);
function addDays(s,n){ const x=toDate(s); x.setDate(x.getDate()+n); return iso(x); }
function daysFrom(s){ return Math.round((toDate(s)-TODAY)/864e5); }
function fmt(s){ if(!s) return '-'; return toDate(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function stamp(){ const t=new Date(); return fmt(TODAY_ISO)+', '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(n){ return n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase(); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function dn(kind,label,text,inline){ return `<div class="dn k-${kind}${inline?' inline':''}"><b>${esc(label)}</b>${text}</div>`; }
function maskAcct(v){ v=String(v||''); return v.length>4 ? '•••• '+v.slice(-4) : v; }
function maskSsn(v){ v=String(v||''); return v ? '•••-••-'+v.replace(/\D/g,'').slice(-4) : ''; }

function reqInfo(e){
  if(!e.req) return {code:'none',label:'Not sent',cls:'',done:0,total:0};
  const r=e.req, items=pkgItems(r.pkg), P=S.progress[e.id]||{};
  let done=0,sub=0,ret=0,err=0;
  items.forEach(i=>{const st=(P[i.key]||{}).status; if(st==='done')done++; else if(st==='submitted')sub++; else if(st==='returned')ret++; else if(st==='syncError')err++;});
  const total=items.length, complete=done+sub+err;
  const base={done:complete,total};
  if(r.status==='revoked') return {...base,code:'revoked',label:'Revoked',cls:''};
  if(done===total) return {...base,code:'completed',label:'Completed',cls:'ok'};
  if(daysFrom(r.expires)<0 && complete<total) return {...base,code:'expired',label:'Link expired',cls:'bad'};
  if(err) return {...base,code:'error',label:'Sync error',cls:'bad'};
  if(ret) return {...base,code:'returned',label:'Returned to employee',cls:'warn'};
  if(complete===total) return {...base,code:'review',label:'Awaiting review',cls:'warn'};
  if(complete===0 && !r.opened) return {...base,code:'sent',label:'Sent',cls:'info'};
  return {...base,code:'progress',label:'In progress',cls:'info'};
}
function hasOpen(e){ if(!e.req||e.req.status!=='open') return false; const c=reqInfo(e).code; return c!=='completed'; }
function visibleEmployees(){
  const u=user();
  return S.employees.filter(e=> S.settings.visibility==='all' || u.sub==='All' || e.sub===u.sub);

function reviewQueue(){
  const out=[];
  visibleEmployees().forEach(e=>{ const P=S.progress[e.id]||{}; Object.keys(P).forEach(k=>{ if(P[k].status==='submitted'||P[k].status==='syncError') out.push({eid:e.id,key:k,rec:P[k]}); }); });
  return out;
}
function credStatus(e,c){
  const t=CT(c.type), d=daysFrom(c.expires);
  if(c.status==='pending') return {code:'pending',label:'Pending verification',cls:'warn',d};
  if(d<0) return {code:'expired',label:'Expired',cls:'bad',d};
  if(d<=Math.max(...t.reminders)) return {code:'expiring',label:'Expiring',cls:'warn',d};
  return {code:'valid',label:'Valid',cls:'ok',d};
}
function nextReminder(c){ const t=CT(c.type), d=daysFrom(c.expires); const next=t.reminders.filter(x=>x<d).sort((a,b)=>b-a)[0]; return next==null?null:d-next; }
function allCreds(){ const out=[]; visibleEmployees().forEach(e=>e.creds.forEach(c=>out.push({e,c,st:credStatus(e,c)}))); return out.sort((a,b)=>a.st.d-b.st.d); }
function eligibility(e){
  if(e.status==='terminated') return 'Terminated';
  if(!S.settings.includeTypes[e.type]) return `Employee type "${e.type}" is excluded in Settings`;
  if(hasOpen(e)) return 'Already has an open package';
  return null;
}

/* ---------- Reports ---------- */
function reportsView(){
  const emps=visibleEmployees(), withReq=emps.filter(e=>e.req&&e.req.status==='open');

  const reviewN=reviewQueue().length, doneN=withReq.filter(e=>reqInfo(e).code==='completed').length;
  const creds=allCreds(), exp30=creds.filter(x=>x.st.d>=0&&x.st.d<=30).length, exp60=creds.filter(x=>x.st.d>30&&x.st.d<=60).length, exp90=creds.filter(x=>x.st.d>60&&x.st.d<=90).length, expired=creds.filter(x=>x.st.d<0).length;
  const states=[...new Set(withReq.map(e=>e.state))];
  const outstanding={}; withReq.forEach(e=>pkgItems(e.req.pkg).forEach(i=>{const r=peek(e.id,i.key); if(!r||['new','returned'].includes(r.status)) outstanding[i.key]=(outstanding[i.key]||0)+1;}));
  const errs=S.log.filter(l=>l.type==='error'&&!l.resolved).length;
  return `<div class="stats">
    <div class="card stat"><div class="v">${openN}</div><div class="l">Open requests</div></div>
    <div class="card stat"><div class="v">${reviewN}</div><div class="l">Forms awaiting review</div></div>
    <div class="card stat"><div class="v">${doneN}</div><div class="l">Completed packages</div></div>

    <div class="card"><div class="card-h"><h3>Completion by work state</h3></div><div class="card-b">${states.map(s=>{const L=withReq.filter(e=>e.state===s);const tot=L.reduce((a,e)=>a+reqInfo(e).total,0),dn2=L.reduce((a,e)=>a+reqInfo(e).done,0);const pc=tot?Math.round(dn2/tot*100):0;return `<div class="hbar"><span>${s} <span class="small muted">(${L.length})</span></span><span class="track"><i style="width:${pc}%"></i></span><strong>${pc}%</strong></div>`}).join('')||'<span class="muted">No open requests.</span>'}</div></div>
    <div class="card"><div class="card-h"><h3>Credential expirations</h3></div><div class="card-b">
      <div class="hbar"><span>Expired</span><span class="track"><i style="width:${Math.min(100,expired*25)}%;background:var(--bad)"></i></span><strong>${expired}</strong></div>
      <div class="hbar"><span>0 to 30 days</span><span class="track"><i style="width:${Math.min(100,exp30*25)}%;background:var(--accent)"></i></span><strong>${exp30}</strong></div>
      <div class="hbar"><span>31 to 60 days</span><span class="track"><i style="width:${Math.min(100,exp60*25)}%"></i></span><strong>${exp60}</strong></div>
      <div class="hbar"><span>61 to 90 days</span><span class="track"><i style="width:${Math.min(100,exp90*25)}%"></i></span><strong>${exp90}</strong></div></div></div>
  </div>
  <div class="card" style="margin-top:16px"><div class="card-h"><h3>Outstanding forms</h3><button class="btn sm" data-act="exportCsv">Export status CSV</button></div><div class="tw"><table class="t" style="min-width:420px"><thead><tr><th>Form</th><th>Employees still to complete</th></tr></thead><tbody>${Object.entries(outstanding).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<tr><td>${esc(C(k).label)}</td><td>${n}</td></tr>`).join('')||'<tr><td colspan="2" class="muted">Nothing outstanding.</td></tr>'}</tbody></table></div></div>
  ${dn('new','Reports','v1 reports: completion, outstanding items, expiring documents, sync errors. Built as saved searches plus this dashboard.')}`;
}

function fieldHTML(eid,key,f,d,parsed,errs){

function handleCapture(eid,key,slot,docId,fileName){
  const rec=prog(eid,key), dt=DT(docId);
  rec.files=rec.files||{}; rec.files[slot]={name:fileName,doc:docId}; if(rec.status==='new') rec.status='draft';
  if(dt.mode==='parse'){
    rec.parsing=slot; render();
    setTimeout(()=>{
      let sample = SAMPLE_PARSE[key];
      if(key==='i9') sample={[slot+'Num']:'X'+Math.floor(1e6+Math.random()*9e6),[slot+'Exp']:'2031-05-14'};
      if(key.startsWith('_renew_')) sample={number:'RN-'+Math.floor(1e5+Math.random()*9e5),expires:addDays(TODAY_ISO,730),issued:TODAY_ISO};
      sample=sample||{};
      Object.assign(rec.data,sample); rec.parsed=[...new Set([...(rec.parsed||[]),...Object.keys(sample)])]; rec.parsing=null; render();
      toast('Fields filled from your photo. Check each highlighted field.');
    },900);
  } else { render(); toast('Photo stored. It will not be read.'); }
}
function validate(e,key){
  const rec=prog(e.id,key), d=rec.data, errs=[];
  if(key==='i9'){
    if(!d.citizenship) errs.push('citizenship');
    if(/permanent|authorized/.test(d.citizenship||'')&&!d.aNumber) errs.push('aNumber');
    if(!d.i9ssn) errs.push('i9ssn');
    if(!d._choice) errs.push('_choice');
    const slots=d._choice==='A'?['docA']:d._choice==='BC'?['docB','docC']:[];
    slots.forEach(s=>{ if(!d['_'+s]) errs.push('_'+s); else if(S.settings.i9Copies==='all'&&!(rec.files||{})[s]) errs.push('file_'+s); });
    d.docChoice=slots.map(s=>d['_'+s]?DT(d['_'+s]).name:'').filter(Boolean).join(' + ');
  } else {
    (FIELDS[key]||[]).forEach(f=>{ if(!f[3] && (d[f[0]]==null||d[f[0]]==='')) errs.push(f[0]); });
    if(C(key).paper && d._method==='photo' && !(rec.files||{}).paper){ /* allow typed values even without photo */ }
  }
  if(C(key).sign && !d.sign) errs.push('sign');
  return errs;
}
function submitForm(eid,key){
  const e=E(eid), rec=prog(eid,key), item=pkgItems(e.req.pkg).find(i=>i.key===key);
  const errs=validate(e,key); rec.errors=errs;
  if(errs.length){ render(); toast('Complete the highlighted fields to submit.','bad'); return; }
  rec.submittedAt=stamp(); rec.confirmation=item.confirm?{at:rec.submittedAt,email:e.email}:null; rec.note=null;
  const parsed=rec.parsed&&rec.parsed.length;
  if(item.mode==='auto' && !parsed){
    if(S.demo.failSync && C(key).payroll){ rec.status='syncError'; rec.syncError='SuitePeople Payroll returned SP-412 (invalid value).'; addLogSys(eid,'error',`Sync failed: ${C(key).label}. SuitePeople returned SP-412.`,{notified:'NetDynamic support, '+S.settings.notify.nsAdmin}); }
    else { writeNs(e,key,rec); addLogSys(eid,'auto',`${C(key).label} auto-updated in NetSuite (no approval needed for this form)`); }
  } else { rec.status='submitted'; addLogSys(eid,'submit',`Employee submitted ${C(key).label}${parsed?' (values read from photo)':''}. Waiting for HR approval.`); }
  S.emp.screen='home'; S.emp.formKey=null; render(); toast(`${C(key).label} submitted`);
}
function addLogSys(eid,type,text,extra){ S.log.unshift(Object.assign({at:stamp(),who:E(eid).name+' (employee)',emp:eid,type,text},extra||{})); }

    openOverlay(`<div class="modal" role="dialog" aria-label="Add credential"><div class="drawer-h"><h3>Add credential for ${esc(e.name)}</h3></div><div class="drawer-b stack"><div><label class="f" for="acType">Type</label><select id="acType" class="in">${opts(S.credTypes.map(c=>[c.id,c.name]))}</select></div><div class="grid2"><div><label class="f" for="acNum">Number (if any)</label><input id="acNum" class="in"></div><div><label class="f" for="acExp">Expiration date</label><input id="acExp" type="date" class="in"></div></div></div><div class="drawer-f"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="doAddCred">Add credential</button></div></div>`,true); },
  doAddCred:()=>{ const exp=document.getElementById('acExp').value; if(!exp){toast('Add an expiration date.','bad');return;} const e=E(S.tmpAdd.eid); const c=cred(document.getElementById('acType').value,document.getElementById('acNum').value,null,exp); e.creds.push(c); addLog(e.id,'credential',`Added ${CT(c.type).name}, expires ${fmt(exp)}`); closeOverlay(); render(); toast('Credential added'); },
  afilter:t=>{S.activityFilter=t.dataset.v; render();},
  exportCsv:()=>csv(),
  terminate:t=>{ const e=E(t.dataset.id); if(!confirm(`Terminate ${e.name}? (demo of auto-revoke)`)) return; e.status='terminated'; addLog(e.id,'terminate','Employee terminated in NetSuite'); if(e.req&&e.req.status==='open'&&reqInfo(e).code!=='completed'){ e.req.status='revoked'; e.req.reason='Employee terminated (auto-revoked)'; S.log.unshift({at:stamp(),who:'System',emp:e.id,type:'revoke',text:'Request auto-revoked: employee terminated'}); } render(); toast('Employee terminated. Open request revoked.'); },
  s2:t=>{ const e=E(t.dataset.id); const docs=document.getElementById('s2docs').value.trim(); if(!docs){toast('Enter the document title examined.','bad');return;} e.i9s2={docs,number:document.getElementById('s2num').value,exp:document.getElementById('s2exp').value,first:document.getElementById('s2first').value,by:user().name,at:stamp()}; addLog(e.id,'section2','I-9 Section 2 completed'); render(); toast('Section 2 completed'); },
  everify:t=>{ const e=E(t.dataset.id); const old=-daysFrom(e.hire)>S.settings.everifyWarnDays;
    openOverlay(`<div class="modal" role="dialog" aria-label="Launch E-Verify"><div class="drawer-h"><h3>Launch E-Verify for ${esc(e.name)}</h3></div><div class="drawer-b stack">
      ${old?`<div class="badbox">Hire date is ${fmt(e.hire)}, more than ${S.settings.everifyWarnDays} days ago. E-Verify is for new hires. Only continue if your federal contract allows verifying existing employees.</div>`:`<div class="infobox">Hire date ${fmt(e.hire)}.</div>`}
      <label class="confirm"><input type="checkbox" id="evOk"><span class="small">I confirm this person is a new hire (or covered by our federal contract), Section 2 is complete, and E-Verify is not being used to screen a candidate.</span></label></div>
      <div class="drawer-f"><button class="btn" data-act="close">Cancel</button><button class="btn dark" data-act="doEverify" data-id="${e.id}">Launch case</button></div></div>`,true); },
  doEverify:t=>{ if(!document.getElementById('evOk').checked){toast('Tick the confirmation to continue.','bad');return;} const e=E(t.dataset.id); e.everify={status:'Employment authorized',caseNo:'2026'+Math.floor(1e9+Math.random()*9e9),at:stamp(),by:user().name}; addLog(e.id,'everify','E-Verify case opened: employment authorized'); closeOverlay(); render(); toast('E-Verify case opened'); },
  printDoc:t=>{ const [eid,key]=t.dataset.v.split('|'); doPrint(docHtml(E(eid),key)); },
  dlDoc:t=>{ const [eid,key]=t.dataset.v.split('|'); download(`${eid}_${key}_signed.html`,docHtml(E(eid),key)); },
  printAll:t=>{ const e=E(t.dataset.id); doPrint(signedDocs(e).map(d=>docHtml(e,d.key)).join('')); },
  dlAll:t=>{ const e=E(t.dataset.id); download(`${e.id}_all_signed.html`,signedDocs(e).map(d=>docHtml(e,d.key)).join('')); },
  // employee portal
  escreen:t=>{ const v=t.dataset.v; S.emp.screen=v; if(v==='otp'&&!S.settings.otp) S.emp.screen='home'; render(); window.scrollTo(0,0); },
  ehome:()=>{S.emp.screen='home'; render(); window.scrollTo(0,0);},
  otpGo:()=>{ if(S.emp.otp==='482913'){ S.emp.verified[S.emp.id]=true; S.emp.screen='home'; render(); } else toast('That code does not match. Check the latest email or send a new code.','bad'); },
  otpResend:()=>toast('New code sent. Demo code: 482913'),
  openForm:t=>{S.emp.screen='form'; S.emp.formKey=t.dataset.k; const r=prog(S.emp.id,t.dataset.k); if(r.status==='new') r.status='draft'; render(); window.scrollTo(0,0);},
  openRenewal:t=>{S.emp.screen='renewal'; S.emp.formKey=t.dataset.k; render(); window.scrollTo(0,0);},
  method:t=>{ prog(S.emp.id,t.dataset.k).data._method=t.dataset.v; render(); },
  samplePhoto:t=>handleCapture(S.emp.id,t.dataset.k,t.dataset.s,t.dataset.d,'sample-photo.jpg'),
  clearFile:t=>{ const r=prog(S.emp.id,t.dataset.k); delete r.files[t.dataset.s]; render(); },
  i9choice:t=>{ prog(S.emp.id,'i9').data._choice=t.dataset.v; render(); },
  saveDraft:t=>{ const r=prog(S.emp.id,t.dataset.k); if(r.status==='new') r.status='draft'; S.emp.screen='home'; render(); toast('Saved. You can finish later from the same link.'); },
  submitForm:t=>submitForm(S.emp.id,t.dataset.k),
  submitRenewal:t=>{ const e=E(S.emp.id), c=e.creds.find(x=>x.id===t.dataset.k), ct=CT(c.type), key='_renew_'+c.id, rec=prog(e.id,key), d=rec.data, errs=[];
    if(!d.expires||daysFrom(d.expires)<=0) errs.push('expires'); if(ct.file==='required'&&!(rec.files||{}).doc) errs.push('file_doc'); rec.errors=errs;
    if(errs.length){render(); toast('Complete the highlighted fields to submit.','bad'); return;}
    if(ct.verify){ c.status='pending'; c.newExpires=d.expires; c.newNumber=d.number; c.renewal.status='submitted'; addLogSys(e.id,'credential',`Submitted new ${ct.name}. Waiting for HR verification.`); }
    else { c.expires=d.expires; if(d.number) c.number=d.number; c.renewal=null; addLogSys(e.id,'credential',`Updated ${ct.name} (auto-accepted), now expires ${fmt(d.expires)}`); }
    delete S.progress[e.id][key]; S.emp.screen='home'; render(); toast('Update submitted'); },
};
function rowOp(e,op,quiet){
  const r=e.req;
  if(op==='remind'){ if(r.reminders>=S.settings.remindMax && S.settings.remindMax>0){ if(!quiet) toast(`Already sent ${r.reminders} reminders (maximum ${S.settings.remindMax}). You can still send manually.`); } r.reminders=(r.reminders||0)+1; addLog(e.id,'reminder',`Manual reminder sent (${r.reminders} total)`); if(!quiet) toast('Reminder sent'); }
  if(op==='extend'){ const base=daysFrom(r.expires)<0?TODAY_ISO:r.expires; r.expires=addDays(base,S.settings.linkDays); addLog(e.id,'extend',`Link extended to ${fmt(r.expires)}. Captured answers kept.`); if(!quiet) toast('Link extended to '+fmt(r.expires)); }
  if(op==='resend'){ r.expires=addDays(TODAY_ISO,S.settings.linkDays); r.sent=TODAY_ISO; addLog(e.id,'resend',`New link sent, expires ${fmt(r.expires)}. Previous link no longer works.`); if(!quiet) toast('New link sent'); }
  if(op==='revoke'){ r.status='revoked'; r.reason='Revoked by '+user().name; addLog(e.id,'revoke','Request revoked'); if(!quiet) toast('Request revoked'); }
}
function retry(eid,key,logEntry){
  const rec=peek(eid,key);
  if(S.demo.failSync){ addLog(eid,'error',`Retry failed: ${C(key).label}. SuitePeople returned SP-412.`,{notified:'NetDynamic support, '+S.settings.notify.nsAdmin}); render(); toast('Retry failed. Turn off "Simulate sync failure" in Settings › Demo controls to succeed.','bad'); return; }
  writeNs(E(eid),key,rec); S.log.forEach(l=>{ if(l.type==='error'&&l.emp===eid) l.resolved=true; }); addLog(eid,'approve',`Retry succeeded: ${C(key).label} updated in NetSuite`); render(); toast('NetSuite updated');
}

const CHG = {
  notes:t=>{S.notes=t.checked; render();},
  user:t=>{S.user=t.value; S.selected=[]; render(); toast('Signed in as '+user().name);},
  filter:t=>{S.filters[t.dataset.k]=t.value; render();},
  sel:t=>{ const id=t.dataset.id; S.selected=t.checked?[...new Set([...S.selected,id])]:S.selected.filter(x=>x!==id); render(); },
  selAll:t=>{ S.selected=t.checked?boardRows().map(e=>e.id):[]; render(); },
  sendPkg:t=>{ S.tmpSend.pkg=t.value; sendModal(S.tmpSend.ids,S.tmpSend.ids.length===1); },
  sendPkgSilent:t=>{ S.tmpSend.pkg=t.value; },
  pkgItem:t=>{ const i=S.tmpPkg.items.find(x=>x.key===t.dataset.k); const f=t.dataset.f; i[f]=f==='mode'?t.value:t.checked; pkgDrawer(true); },
  pkgName:t=>{ S.tmpPkg.name=t.value; },
  pkgDesc:t=>{ S.tmpPkg.desc=t.value; },
  pkgJob:t=>{ const j=t.dataset.j, p=S.tmpPkg; p.jobs=t.checked?[...p.jobs,j]:p.jobs.filter(x=>x!==j); },
  upl:t=>{ const u=S.tmpPkg.uploads[+t.dataset.ix], f=t.dataset.f; u[f]=f==='required'?t.checked:f==='max'?Math.max(1,+t.value||1):t.value; },
  ct:t=>{ const c=S.tmpCt, f=t.dataset.f;
    if(f==='reminders') c.reminders=t.value.split(',').map(x=>parseInt(x,10)).filter(x=>x>0).sort((a,b)=>b-a);
    else if(f.startsWith('r_')) c.rcpt[f.slice(2)]=t.checked;
    else if(f==='other') c.rcpt.other=t.value;
    else if(['idNumber','verify','spSync'].includes(f)) c[f]=t.checked;
    else { c[f]=t.value; if(f==='cat'){ if(t.value!=='Government ID') c.spSync=false; ctModal(c.id,c); } } },
  set:t=>{ let v=t.type==='checkbox'?t.checked:t.value; if(t.dataset.num) v=Math.max(0,parseInt(v,10)||0); if(t.dataset.p==='approvalLevels') v=+v; setp(S.settings,t.dataset.p,v); addLog(null,'settings','Setting changed: '+t.dataset.p); render(); },
  perm:t=>{ S.users.find(u=>u.id===t.dataset.u).perms[t.dataset.p]=t.checked?1:0; render(); },
  dt:t=>{ const d=DT(t.dataset.id); d[t.dataset.f]=t.value; render(); },
  demo:t=>{ S.demo[t.dataset.p]=t.checked; render(); },
  asEmp:t=>{ S.emp.id=t.value; S.emp.screen='invite'; S.emp.otp=''; render(); },
  confirm:t=>{ prog(S.emp.id,t.dataset.k).data._confirm=t.checked; render(); },
  fieldCheck:t=>{ const r=prog(S.emp.id,t.dataset.k); r.data[t.dataset.n]=t.checked?'Yes':''; },
  i9cit:t=>{ prog(S.emp.id,'i9').data.citizenship=t.value; render(); },
  capFile:t=>{ const f=t.files&&t.files[0]; if(!f) return; handleCapture(S.emp.id,t.dataset.k,t.dataset.s,t.dataset.d,f.name); },
  uplFile:t=>{ const f=t.files&&t.files[0]; if(!f) return; const r=prog(S.emp.id,'_upl'+t.dataset.ix); r.files=r.files||[]; const max=PK(E(S.emp.id).req.pkg).uploads[+t.dataset.ix].max; if(r.files.length>=max){toast(`You can upload up to ${max} files here.`,'bad');return;} r.files.push(f.name); render(); toast('File uploaded'); },
};
const INP = {
  field:t=>{ const r=prog(S.emp.id,t.dataset.k); r.data[t.dataset.n]=t.value; if(r.status==='new') r.status='draft';
    if(r.errors&&r.errors.includes(t.dataset.n)){ r.errors=r.errors.filter(x=>x!==t.dataset.n); t.classList.remove('err'); const m=t.parentElement.querySelector('.err-msg'); if(m) m.remove(); }
    if(r.parsed&&r.parsed.includes(t.dataset.n)){ t.classList.remove('parsed'); }
    if(t.dataset.rerender) render(); },
  otp:t=>{ const i=+t.dataset.i; t.value=t.value.replace(/\D/g,'').slice(-1); const a=(S.emp.otp||'').padEnd(6,' ').split(''); a[i]=t.value||' '; S.emp.otp=a.join('').replace(/\s+$/,''); if(t.value){ const nx=document.querySelector(`[data-inp="otp"][data-i="${i+1}"]`); if(nx) nx.focus(); } },
};

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');
  if(!t){ if(S.openMenu){ S.openMenu=null; render(); } return; }
  if(t.disabled) return;
  const fn=ACT[t.dataset.act]; if(fn) fn(t,ev);
});
document.addEventListener('change',ev=>{ const t=ev.target.closest('[data-chg]'); if(t&&CHG[t.dataset.chg]) CHG[t.dataset.chg](t,ev); });
document.addEventListener('input',ev=>{ const t=ev.target.closest('[data-inp]'); if(t&&INP[t.dataset.inp]) INP[t.dataset.inp](t,ev); });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'){ if(overlayRoot.innerHTML) closeOverlay(); else if(S.openMenu){S.openMenu=null; render();} } });

render();
</script>
